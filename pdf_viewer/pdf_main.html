<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; height: 100%; }
    :root {
      --pv-bottomBarPad: 92px;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.35;
    }

    .app {
      max-width: none;
      width: 100%;
      margin: 0;
      padding: 0;
      padding-bottom: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Status overlays on top of the full-window canvas. */
    .row[aria-label="Status"] {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 8px;
      z-index: 80;
      pointer-events: none;
      margin: 0;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    button {
      padding: 10px 12px;
      min-height: 44px;
      border: 1px solid currentColor;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: default; }

    input[type="text"], input[type="search"] {
      padding: 10px 12px;
      min-height: 44px;
      border: 1px solid currentColor;
      border-radius: 10px;
      width: min(560px, 100%);
    }

    #inGotoPage {
      padding: 10px 10px;
      min-height: 34px;
      border: 1px solid currentColor;
      border-radius: 10px;
      width: 50px;
      font-variant-numeric: tabular-nums;
    }

    /* Hide number spinners where supported */
    #inGotoPage::-webkit-outer-spin-button,
    #inGotoPage::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    #inGotoPage[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input[type="file"] {
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid currentColor;
      border-radius: 10px;
      width: min(320px, 100%);
      background: transparent;
    }

    .muted { opacity: 0.75; }
    .mono { font-variant-numeric: tabular-nums; }

    .canvasWrap {
      position: relative;
      border: 1px solid currentColor;
      border-radius: 12px;
      padding: 8px;
      flex: 1 1 auto;
      height: auto;
      min-height: 0;
      overflow: auto;
      background: transparent;
    }

    /* Full-window viewer surface (behind bottom bar). */
    #canvasWrap {
      position: fixed;
      inset: 0;
      z-index: 1;
      border: 0;
      border-radius: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
    }

    canvas { display: block; margin: 0 auto; }

    /* Highlight overlay (absolute div with rectangles) */
    #hlOverlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }

    /* Saved OCR overlay (clickable when Select mode is OFF) */
    #savedOverlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: auto;
    }

    .selectMode #savedOverlay {
      pointer-events: none;
    }

    .savedRect {
      position: absolute;
      border: none;
      outline: none;
      background: rgba(0, 160, 0, 0.10);
      border-radius: 4px;
      cursor: pointer;
    }

    /* Selection overlay */
    #selOverlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }

    #selRect {
      position: absolute;
      border: 2px solid rgba(0, 120, 215, 0.9);
      background: rgba(0, 120, 215, 0.12);
      border-radius: 4px;
      display: none;
    }

    .selectMode canvas {
      cursor: crosshair;
      touch-action: none;
    }

    .hl {
      position: absolute;
      background: rgba(255, 215, 0, 0.35);
      outline: 1px solid rgba(255, 165, 0, 0.55);
      border-radius: 2px;
    }

    /* Bottom controls always visible */
    .bottomBar {
      position: fixed;
      left: 12px;
      right: 12px;
      transform: none;
      bottom: 12px;
      width: auto;
      padding: 10px 12px;
      margin: 0;
      background: transparent;
      backdrop-filter: none;
      border: 0;
      border-radius: 12px;
      z-index: 90;
    }

    /* Controls are solid/opaque even though the bar container is transparent. */
    #bottomBar button,
    #bottomBar select,
    #bottomBar input {
      background: rgba(255, 255, 255, 0.96);
      color: #000;
      opacity: 1;
    }

    @media (prefers-color-scheme: dark) {
      #bottomBar button,
      #bottomBar select,
      #bottomBar input {
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
      }
    }

    @media (prefers-color-scheme: dark) {
      .bottomBar {
        background: rgba(0,0,0,0.01);
      }
    }

    .spacer { display: none; height: 0; }

    /* Search panel line-break on small screens */
    .break { flex-basis: 100%; height: 0; }

    dialog {
      border: 1px solid currentColor;
      border-radius: 12px;
      padding: 10px;
      margin: 0;
    }

    /* OCR dialog: always white (90% opaque), independent of OS dark mode. */
    #dlgOcr {
      background: rgba(255,255,255,0.1);
      color: #000;      
    }

    #dlgOcr::backdrop {
      background: rgba(0,0,0,0.1);
    }

    #ocrHdr {
      flex-wrap: nowrap;
      gap: 8px;
      overflow: hidden;
    }

    #ocrHdr strong {
      white-space: nowrap;
    }

    /* Keep dialog buttons fully opaque (solid). */
    #dlgOcr button {
      background: #fff;
      color: #000;
      opacity: 1;
    }

    /* OCR output textarea: transparent background. */
    #dlgOcr #ocrText {
      background: rgba(255,255,255,1);
      color: inherit;
    }

    /* OCR header status must be fully readable (not transparent/muted). */
    #dlgOcr #ocrHdrStatus {
      opacity: 1;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      background: rgba(255, 255, 255, 0.96);
      color: #000;
    }

    textarea {
      width: 100%;
      border: 1px solid currentColor;
      border-radius: 10px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      resize: none;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="app">
    <input id="fileInput" type="file" accept="application/pdf" hidden />

    <div class="row" aria-label="Status">
      <span id="status" class="muted"></span>
    </div>

    <div id="canvasWrap" class="canvasWrap">
      <canvas id="pdfCanvas"></canvas>
      <div id="savedOverlay" aria-hidden="true"></div>
      <div id="hlOverlay" aria-hidden="true"></div>
      <div id="selOverlay" aria-hidden="true">
        <div id="selRect"></div>
      </div>
    </div>

    <div class="spacer" aria-hidden="true"></div>
  </div>

  <div id="bottomBar" class="row bottomBar" aria-label="Controls">
    <button id="btnPrev" type="button"><</button>
    <button id="btnNext" type="button">></button>

    <button id="btnZoomOut" type="button">-</button>
    <button id="btnZoomIn" type="button">+</button>
    <span id="zoomInfo" class="muted mono">100%</span>
    <button id="btnFitWidth" type="button">FW</button>
    <input id="inGotoPage" type="number" inputmode="numeric" min="1" step="1" placeholder="#" aria-label="Page" />

    <button id="btnSelect" type="button">Sel</button>
    <select id="ocrLang" aria-label="Ln" style="min-height:44px; border:1px solid currentColor; border-radius:10px; padding:10px 12px;">
      <option value="eng">eng</option>
      <option value="swe">swe</option>
      <option value="eng+swe">e_s</option>
      <option value="ukr">ukr</option>
      <option value="rus">rus</option>
    </select>
    <button id="btnOcr" type="button" disabled>OCR</button>
    <button id="btnClearSel" type="button" disabled>Clear</button>
  </div>

  <dialog id="dlgOcr">
    <form method="dialog">
      <div id="ocrHdr" class="row" style="margin:0;">        
        <button id="btnSaveToFB_Ocr" type="button">Save</button>
        <span id="ocrHdrStatus" style="flex:1 1 auto; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;"></span>
        <button value="cancel">Close</button>
      </div>
      <textarea id="ocrText" rows="2" placeholder="(OCR output)"></textarea>
    </form>
  </dialog>

  <!-- PDF.js (CDN). If you want offline, download pdf.min.js + pdf.worker.min.js and update URLs. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tesseract.js (CDN) for OCR selection. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- Firebase auth + RTDB helper (GlobalVars / URL_DataSet) -->
  <script src="../assets/js/global_var.js"></script>
  <script>
    'use strict';

    // -----------------------------
    // Settings / state
    // -----------------------------
    // Use a same-origin relative URL so it works both on localhost server and GitHub Pages.
    // PDF is located next to this viewer: pdf_viewer/learnbook_sw_beg.pdf
    const DEFAULT_URL = './learnbook_sw_beg.pdf';

    const SCALE_MIN = 0.5;
    const SCALE_MAX = 2.5;
    const SCALE_STEP = 1.2;

    const LS_KEY = 'pdf_viewer_state_v1';
    const LS_KEY_OCR = 'pdf_viewer_ocr_v1';

    // OCR dialog sizing/placement
    const OCR_DLG_W = 520;
    const OCR_DLG_H = 100;
    const OCR_DLG_EDGE = 8;
    const OCR_HDR_H = 24;

    let pdfDoc = null;
    let pageNum = 1;
    let scale = 1.0;

    // Last loaded URL (used for Ctrl+L prompt default + persistence)
    let currentUrl = DEFAULT_URL;

    let renderTask = null;
    let renderSeq = 0;

    // Search cache
    let pageTextCache = new Map(); // pageNum -> { textLower, rawText }
    let searchQuery = '';
    let matches = []; // { pageNum }
    let matchIndex = -1;

    // Selection / OCR state
    let selectMode = false;
    let isSelecting = false;
    let selStart = null; // { xCss, yCss }
    let selRectCss = null; // { x, y, w, h } in CSS pixels relative to canvas
    let selRectCanvas = null; // { x, y, w, h } in canvas pixels

    let ocrWorker = null;
    let ocrWorkerLang = '';

    // -----------------------------
    // Elements
    // -----------------------------
    const elStatus = document.getElementById('status');
    const elZoomInfo = document.getElementById('zoomInfo');

    const elCanvasWrap = document.getElementById('canvasWrap');
    const elCanvas = document.getElementById('pdfCanvas');
    const elOverlay = document.getElementById('hlOverlay');
    const elSavedOverlay = document.getElementById('savedOverlay');
    const elSelOverlay = document.getElementById('selOverlay');
    const elSelRect = document.getElementById('selRect');
    const elFile = document.getElementById('fileInput');

    const elOcrLang = document.getElementById('ocrLang');
    const dlgOcr = document.getElementById('dlgOcr');
    const elOcrHdr = document.getElementById('ocrHdr');
    const elOcrHdrStatus = document.getElementById('ocrHdrStatus');
    const elOcrText = document.getElementById('ocrText');

    // Buttons
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnFitWidth = document.getElementById('btnFitWidth');
    const inGotoPage = document.getElementById('inGotoPage');

    const btnSelect = document.getElementById('btnSelect');
    const btnOcr = document.getElementById('btnOcr');
    const btnClearSel = document.getElementById('btnClearSel');
    const btnSaveToFB_Ocr = document.getElementById('btnSaveToFB_Ocr');

    // -----------------------------
    // PDF.js init
    // -----------------------------
    function initPdfJsWorker() {
      if (!window['pdfjsLib']) throw new Error('pdfjsLib not loaded');
      // cdnjs puts worker at same version
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // -----------------------------
    // Helpers
    // -----------------------------
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function setStatus(msg) {
      elStatus.textContent = msg || '';
    }

    function updateIndicators() {
      const total = pdfDoc ? pdfDoc.numPages : 0;
      elZoomInfo.textContent = `${Math.round(scale * 100)}%`;

      btnPrev.disabled = !pdfDoc || pageNum <= 1;
      btnNext.disabled = !pdfDoc || pageNum >= total;

      btnOcr.disabled = !selRectCanvas;
      btnClearSel.disabled = !selRectCanvas;
      btnSelect.textContent = selectMode ? 'Sel: ON' : 'Sel';

      if (inGotoPage) {
        try {
          inGotoPage.min = '1';
          inGotoPage.max = total ? String(total) : '';
        } catch {}
      }
    }

    function isTypingTarget(el) {
      if (!el) return false;
      const tag = (el.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return true;
      return !!el.isContentEditable;
    }

    function saveState(extra = {}) {
      try {
        const state = {
          url: String(currentUrl || ''),
          pageNum,
          scale,
          ...extra,
        };
        localStorage.setItem(LS_KEY, JSON.stringify(state));
      } catch {
        // ignore
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        const st = JSON.parse(raw);
        if (!st || typeof st !== 'object') return null;
        return st;
      } catch {
        return null;
      }
    }

    function clearHighlights() {
      elOverlay.innerHTML = '';
    }

    function setOcrStatus(msg) {
      // Show OCR/save status in the OCR dialog header (not in the page status line).
      try {
        if (elOcrHdrStatus) elOcrHdrStatus.textContent = msg || '';
      } catch {}
    }

    function clearOcrStatus() {
      setOcrStatus('');
    }

    function toIsoTimestamp(value, fallbackIso) {
      const fb = (fallbackIso && typeof fallbackIso === 'string') ? fallbackIso : new Date().toISOString();
      if (typeof value === 'string' && value.trim()) {
        const d = new Date(value);
        if (!Number.isNaN(d.getTime())) return d.toISOString();
        return fb;
      }
      const n = Number(value);
      if (Number.isFinite(n) && n > 0) {
        try { return new Date(n).toISOString(); } catch { return fb; }
      }
      return fb;
    }

    function clampInt(n, a, b) {
      return Math.floor(clamp(n, a, b));
    }

    // -----------------------------
    // Firebase RTDB helpers (pdf_viewer_ocr_v1)
    // -----------------------------
    const RTDB_ROOT = 'https://storage-eu-default-rtdb.firebaseio.com';

    // Cache: key = `${userKey}|${docKey}|${pageNum}` -> { entriesById }
    let savedCache = new Map();
    let savedKeyActive = '';
    let savedEntriesById = {}; // for current page
    let savedLoadInFlightKey = '';
    let activeSavedEntryId = '';
    let activeSavedRect1 = null;

    function clearActiveEditEntry() {
      activeSavedEntryId = '';
      activeSavedRect1 = null;
    }

    // UI state (store last page per document)
    let uiSaveTimer = null;

    function cleanStr(x) { return (x == null) ? '' : String(x).trim(); }

    function base64UrlKey(ident) {
      const s = cleanStr(ident);
      if (!s) return '';
      try {
        const bytes = new TextEncoder().encode(s);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        const b64 = btoa(bin);
        return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
      } catch {
        try {
          const b64 = btoa(unescape(encodeURIComponent(s)));
          return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        } catch {
          return '';
        }
      }
    }

    function pvEnsureGv() {
      if (window.gv && window.gv.URL_DS) return window.gv;
      const GVClass = (typeof GlobalVars === 'function')
        ? GlobalVars
        : (typeof globalThis !== 'undefined' && typeof globalThis.GlobalVars === 'function')
          ? globalThis.GlobalVars
          : (typeof window.GlobalVars === 'function')
            ? window.GlobalVars
            : null;
      if (GVClass) {
        const gv = new GVClass();
        window.gv = gv;
        return gv;
      }
      throw new Error('GlobalVars is not available (load ../assets/js/global_var.js first)');
    }

    async function pvEnsureSignedIn() {
      const gv = pvEnsureGv();
      if (gv.URL_DS && gv.URL_DS.idToken) return;
      if (typeof gv.SignIn_User !== 'function') throw new Error('gv.SignIn_User missing');
      await gv.SignIn_User();
    }

    function pvGetUserKey() {
      try {
        const gv = pvEnsureGv();
        const email = gv && gv.URL_DS ? cleanStr(gv.URL_DS.email) : '';
        return base64UrlKey(email) || 'anon';
      } catch {
        return 'anon';
      }
    }

    function pvGetDocKey() {
      // Prefer pdf.js fingerprints if available; encode for safe RTDB key.
      try {
        const fp = (pdfDoc && pdfDoc.fingerprints && pdfDoc.fingerprints[0]) ? cleanStr(pdfDoc.fingerprints[0]) : '';
        if (fp) return base64UrlKey(fp);
      } catch {}
      // Fallback to URL
      return base64UrlKey(currentUrl || DEFAULT_URL) || 'doc';
    }

    function pvMakeRtdbUrl(pathNoSlash) {
      const p = cleanStr(pathNoSlash).replace(/^\/+/, '');
      return `${RTDB_ROOT}/${p}.json`;
    }

    async function pvRtdbRequest(pathNoSlash, method = 'GET', body = null) {
      await pvEnsureSignedIn();
      const gv = pvEnsureGv();
      const token = gv && gv.URL_DS ? cleanStr(gv.URL_DS.idToken) : '';
      if (!token) throw new Error('Not authenticated (idToken missing)');

      const url = pvMakeRtdbUrl(pathNoSlash) + `?auth=${encodeURIComponent(token)}`;
      const init = { method: String(method || 'GET') };
      if (body != null) {
        init.headers = { 'Content-Type': 'application/json' };
        init.body = JSON.stringify(body);
      }

      const res = await fetch(url, init);
      if (!res.ok) {
        // One retry after re-sign-in if unauthorized
        if (res.status === 401) {
          try {
            const gv2 = pvEnsureGv();
            if (gv2 && typeof gv2.SignIn_User === 'function') await gv2.SignIn_User();
          } catch {}
          const gv3 = pvEnsureGv();
          const token2 = gv3 && gv3.URL_DS ? cleanStr(gv3.URL_DS.idToken) : '';
          const url2 = pvMakeRtdbUrl(pathNoSlash) + `?auth=${encodeURIComponent(token2)}`;
          const res2 = await fetch(url2, init);
          if (!res2.ok) {
            const txt2 = await (async () => { try { return await res2.text(); } catch { return ''; } })();
            throw new Error(`RTDB ${res2.status}: ${txt2}`);
          }
          return await res2.json();
        }
        const txt = await (async () => { try { return await res.text(); } catch { return ''; } })();
        throw new Error(`RTDB ${res.status}: ${txt}`);
      }
      return await res.json();
    }

    function pvActiveSavedKey(pageNumLocal) {
      const userKey = pvGetUserKey();
      const docKey = pvGetDocKey();
      return `${userKey}|${docKey}|${pageNumLocal}`;
    }

    function pvGetRtdbPagePath(pageNumLocal) {
      const userKey = pvGetUserKey();
      const docKey = pvGetDocKey();
      return `pdf_viewer_ocr_v1/${userKey}/${docKey}/${pageNumLocal}`;
    }

    function pvGetRtdbUiPath() {
      const userKey = pvGetUserKey();
      const docKey = pvGetDocKey();
      return `pdf_viewer_ocr_v1/${userKey}/${docKey}/_ui`;
    }

    async function pvLoadUiState() {
      try {
        const data = await pvRtdbRequest(pvGetRtdbUiPath(), 'GET');
        return (data && typeof data === 'object') ? data : null;
      } catch {
        return null;
      }
    }

    async function pvSaveUiStateNow() {
      if (!pdfDoc) return;
      try {
        const payload = {
          pageNum: Math.max(1, Math.floor(Number(pageNum) || 1)),
          ocrLang: cleanStr(elOcrLang && elOcrLang.value) || 'eng',
          updatedAt: Date.now(),
        };
        await pvRtdbRequest(pvGetRtdbUiPath(), 'PUT', payload);
      } catch {
        // ignore (viewer should work without firebase)
      }
    }

    function pvScheduleSaveUiState() {
      try {
        if (uiSaveTimer) clearTimeout(uiSaveTimer);
      } catch {}
      uiSaveTimer = setTimeout(() => {
        pvSaveUiStateNow();
      }, 650);
    }

    function clearSavedOverlay() {
      if (elSavedOverlay) elSavedOverlay.innerHTML = '';
    }

    function alignSavedOverlayToCanvas() {
      if (!elSavedOverlay) return;
      const rect = elCanvas.getBoundingClientRect();
      const canvasW = Math.max(1, Math.round(rect.width));
      const canvasH = Math.max(1, Math.round(rect.height));
      elSavedOverlay.style.width = `${canvasW}px`;
      elSavedOverlay.style.height = `${canvasH}px`;
      elSavedOverlay.style.left = `${elCanvas.offsetLeft}px`;
      elSavedOverlay.style.top = `${elCanvas.offsetTop}px`;
    }

    function rect1ToCanvasRect(rect1) {
      if (!rect1) return null;
      const x = Number(rect1.x);
      const y = Number(rect1.y);
      const w = Number(rect1.w);
      const h = Number(rect1.h);
      if (![x, y, w, h].every(n => Number.isFinite(n))) return null;
      return {
        x: x * scale,
        y: y * scale,
        w: w * scale,
        h: h * scale,
      };
    }

    function renderSavedOverlay() {
      if (!elSavedOverlay) return;
      clearSavedOverlay();
      alignSavedOverlayToCanvas();

      const entries = savedEntriesById && typeof savedEntriesById === 'object' ? savedEntriesById : {};
      for (const [entryId, entry] of Object.entries(entries)) {
        if (!entry || typeof entry !== 'object') continue;
        if (entryId.startsWith('_')) continue;
        const r = rect1ToCanvasRect(entry.rect1);
        if (!r) continue;

        const d = document.createElement('div');
        d.className = 'savedRect';
        d.dataset.entryId = String(entryId);
        d.style.left = `${r.x}px`;
        d.style.top = `${r.y}px`;
        d.style.width = `${Math.max(1, r.w)}px`;
        d.style.height = `${Math.max(1, r.h)}px`;
        elSavedOverlay.appendChild(d);
      }
    }

    async function loadSavedEntriesForCurrentPage(force = false) {
      if (!pdfDoc) return;
      const key = pvActiveSavedKey(pageNum);
      savedKeyActive = key;

      if (!force && savedCache.has(key)) {
        const cached = savedCache.get(key);
        savedEntriesById = (cached && cached.entriesById && typeof cached.entriesById === 'object') ? cached.entriesById : {};
        renderSavedOverlay();
        return;
      }

      if (savedLoadInFlightKey === key) return;
      savedLoadInFlightKey = key;Hi
      const path = pvGetRtdbPagePath(pageNum);

      try {
        const data = await pvRtdbRequest(path, 'GET');
        // If user navigated away while loading, do not overwrite.
        if (savedKeyActive !== key) return;
        const entriesByIdNext = (data && typeof data === 'object') ? data : {};
        savedEntriesById = entriesByIdNext;
        savedCache.set(key, { entriesById: entriesByIdNext });
        renderSavedOverlay();
      } catch (e) {
        // Ignore (viewer should work without firebase)
        try {
          const msg = (e && e.message) ? e.message : String(e || 'load failed');
          setStatus(`FB load failed: ${msg}`);
        } catch {}
      } finally {
        if (savedLoadInFlightKey === key) savedLoadInFlightKey = '';
      }
    }

    function findDuplicateEntryIdByRect1(rect1, tol = 2) {
      const entries = savedEntriesById && typeof savedEntriesById === 'object' ? savedEntriesById : {};
      const x = Number(rect1 && rect1.x);
      const y = Number(rect1 && rect1.y);
      const w = Number(rect1 && rect1.w);
      const h = Number(rect1 && rect1.h);
      if (![x, y, w, h].every(n => Number.isFinite(n))) return '';
      for (const [id, e] of Object.entries(entries)) {
        if (!e || typeof e !== 'object') continue;
        if (id.startsWith('_')) continue;
        const r = e.rect1;
        const ex = Number(r && r.x);
        const ey = Number(r && r.y);
        const ew = Number(r && r.w);
        const eh = Number(r && r.h);
        if (![ex, ey, ew, eh].every(n => Number.isFinite(n))) continue;
        if (
          Math.abs(ex - x) <= tol &&
          Math.abs(ey - y) <= tol &&
          Math.abs(ew - w) <= tol &&
          Math.abs(eh - h) <= tol
        ) {
          return String(id);
        }
      }
      return '';
    }

    function makeEntryIdFromRect1(rect1) {
      const x = Math.round(Number(rect1 && rect1.x) || 0);
      const y = Math.round(Number(rect1 && rect1.y) || 0);
      const w = Math.round(Number(rect1 && rect1.w) || 0);
      const h = Math.round(Number(rect1 && rect1.h) || 0);
      return `${x}_${y}_${w}_${h}`;

    function positionOcrDialogNearCanvasRect(rectCanvasPx) {
      if (!dlgOcr || !rectCanvasPx) return;
      const canvasRect = elCanvas.getBoundingClientRect();
      const sel = {
        x: canvasRect.left + rectCanvasPx.x,
        y: canvasRect.top + rectCanvasPx.y,
        w: rectCanvasPx.w,
        h: rectCanvasPx.h,
      };

      const vw = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
      const vh = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);

      const h = Math.min(OCR_DLG_H, Math.max(120, vh - OCR_DLG_EDGE * 2));

      const spaceAbove = sel.y;
      const spaceBelow = vh - (sel.y + sel.h);
      const placeBelow = spaceBelow >= spaceAbove;

      let left = (sel.x + sel.w / 2) - (w / 2);
      left = clampInt(left, OCR_DLG_EDGE, vw - w - OCR_DLG_EDGE);

      let top = placeBelow
        ? (sel.y + sel.h + OCR_DLG_EDGE)
        : (sel.y - h - OCR_DLG_EDGE);

    function setSelectMode(on) {

    function clearSelection() {
      selRectCss = null;
      selRectCanvas = null;
      isSelecting = false;

    }

    function clampRect(r, maxW, maxH) {
      const x = clamp(r.x, 0, Math.max(0, maxW - 1));
      const y = clamp(r.y, 0, Math.max(0, maxH - 1));
      const w = clamp(r.w, 1, Math.max(1, maxW - x));
      const h = clamp(r.h, 1, Math.max(1, maxH - y));
      return { x, y, w, h };
    }

    function getCanvasRectCss() {
      const rect = elCanvas.getBoundingClientRect();
      return rect;
    }

    function cssPointToCanvasPoint(xCss, yCss) {
      const rect = getCanvasRectCss();
      const sx = elCanvas.width / Math.max(1, rect.width);
      const sy = elCanvas.height / Math.max(1, rect.height);
      return {
        x: (xCss * sx),
        y: (yCss * sy),
      };
    }

    function updateSelectionOverlay() {
      if (!selRectCss) {
        if (elSelRect) elSelRect.style.display = 'none';
        return;
      }

      // Overlay should match canvas CSS pixels.
      const rect = elCanvas.getBoundingClientRect();
      const canvasW = Math.max(1, Math.round(rect.width));
      const canvasH = Math.max(1, Math.round(rect.height));
      elSelOverlay.style.width = `${canvasW}px`;
      elSelOverlay.style.height = `${canvasH}px`;
      elSelOverlay.style.left = `${elCanvas.offsetLeft}px`;
      elSelOverlay.style.top = `${elCanvas.offsetTop}px`;

      const r = clampRect(selRectCss, canvasW, canvasH);
      elSelRect.style.display = 'block';
      elSelRect.style.left = `${r.x}px`;
      elSelRect.style.top = `${r.y}px`;
      elSelRect.style.width = `${r.w}px`;
      elSelRect.style.height = `${r.h}px`;

      // Keep a canvas-pixel rect for OCR
      const p0 = cssPointToCanvasPoint(r.x, r.y);
      const p1 = cssPointToCanvasPoint(r.x + r.w, r.y + r.h);
      const cx = Math.floor(Math.min(p0.x, p1.x));
      const cy = Math.floor(Math.min(p0.y, p1.y));
      const cw = Math.max(1, Math.floor(Math.abs(p1.x - p0.x)));
      const ch = Math.max(1, Math.floor(Math.abs(p1.y - p0.y)));
      selRectCanvas = clampRect({ x: cx, y: cy, w: cw, h: ch }, elCanvas.width, elCanvas.height);
      updateIndicators();

      if (isOcrDialogOpen()) {
        try { positionOcrDialog(); } catch {}
      }
    }

    // Highlight strategy (v1): highlight any text item whose .str contains the query.
    async function highlightMatchesOnCurrentPage(queryLower, page, viewport) {
      clearHighlights();
      if (!queryLower) return;

      const tc = await page.getTextContent();
      const divs = [];

      // Overlay size should match canvas CSS pixels.
      const rect = elCanvas.getBoundingClientRect();
      const canvasW = Math.max(1, Math.round(rect.width));
      const canvasH = Math.max(1, Math.round(rect.height));
      elOverlay.style.width = `${canvasW}px`;
      elOverlay.style.height = `${canvasH}px`;
      elOverlay.style.left = `${elCanvas.offsetLeft}px`;
      elOverlay.style.top = `${elCanvas.offsetTop}px`;

      // Map PDF space -> viewport space.
      // item.transform is in text space; viewport.transform maps to canvas.
      // We'll approximate item box with item.width/height.
      for (const item of (tc.items || [])) {
        const s = (item && item.str) ? String(item.str) : '';
        if (!s) continue;
        if (s.toLowerCase().indexOf(queryLower) === -1) continue;

        // Transform: combine viewport.transform and item.transform
        const t = window.pdfjsLib.Util.transform(viewport.transform, item.transform);
        const x = t[4];
        const y = t[5];

        // item.width is in text space width; viewport.scale affects.
        const w = Math.max(2, (item.width || 0) * viewport.scale);
        const h = Math.max(8, (item.height || 0) * viewport.scale);

        // PDF.js Y grows up; viewport has Y down, but transform already accounts.
        // Place rect with bottom-aligned baseline-ish.
        const left = x;
        const top = (y - h);

        // Clamp into overlay bounds.
        if (!isFinite(left) || !isFinite(top) || !isFinite(w) || !isFinite(h)) continue;

        const d = document.createElement('div');
        d.className = 'hl';
        d.style.left = `${left}px`;
        d.style.top = `${top}px`;
        d.style.width = `${w}px`;
        d.style.height = `${h}px`;
        divs.push(d);
      }

      for (const d of divs) elOverlay.appendChild(d);
    }

    // Try to extract actual PDF text for a selected rectangle.
    // This is much more accurate than OCR for PDFs that have a real text layer.
    async function extractPdfTextInRect(page, viewport, rectCanvasPx) {
      if (!page || !viewport || !rectCanvasPx) return '';
      // Inflate selection a bit to catch diacritics that may be separate tiny glyph items.
      const pad = 3;
      const r = {
        x: Math.max(0, rectCanvasPx.x - pad),
        y: Math.max(0, rectCanvasPx.y - pad),
        w: Math.min(viewport.width, rectCanvasPx.w + pad * 2),
        h: Math.min(viewport.height, rectCanvasPx.h + pad * 2),
      };
      const tc = await page.getTextContent();
      const out = [];

      for (const item of (tc.items || [])) {
        const s = (item && item.str) ? String(item.str) : '';
        if (!s) continue;

        // Transform item bbox into viewport/canvas pixel space.
        const t = window.pdfjsLib.Util.transform(viewport.transform, item.transform);
        const w = Math.max(1, (item.width || 0) * viewport.scale);
        const h = Math.max(1, (item.height || 0) * viewport.scale);

        // Use an axis-aligned bbox; pdf.js exposes helper for this.
        let bbox;
        try {
          bbox = window.pdfjsLib.Util.getAxialAlignedBoundingBox([0, 0, w, h], t);
        } catch {
          // Fallback: approximate using transform translation.
          const x = t[4];
          const y = t[5];
          bbox = [x, y - h, x + w, y];
        }

        const left = Math.min(bbox[0], bbox[2]);
        const right = Math.max(bbox[0], bbox[2]);
        const top = Math.min(bbox[1], bbox[3]);
        const bottom = Math.max(bbox[1], bbox[3]);

        // Intersection with selected rectangle (no strict overlap threshold; selection is explicit)
        if (right < r.x || left > (r.x + r.w) || bottom < r.y || top > (r.y + r.h)) continue;

        out.push({ s, x: left, y: top, right, w });
      }

      if (!out.length) return '';

      // Reading order: group into lines (tolerant), then left-to-right.
      out.sort((a, b) => (a.y - b.y) || (a.x - b.x));

      const lines = [];
      const LINE_Y_TOL = 8; // pixels
      let cur = [];
      let curY = null;
      for (const it of out) {
        if (curY == null) {
          curY = it.y;
          cur = [it];
          continue;
        }
        if (Math.abs(it.y - curY) <= LINE_Y_TOL) {
          cur.push(it);
        } else {
          lines.push(cur);
          curY = it.y;
          cur = [it];
        }
      }
      if (cur && cur.length) lines.push(cur);

      const buildLine = (arr) => {
        arr.sort((a, b) => a.x - b.x);
        let outStr = '';
        let prev = null;
        for (const it of arr) {
          const token = String(it.s);
          if (!prev) {
            outStr += token;
            prev = it;
            continue;
          }

          const gap = it.x - (prev.right != null ? prev.right : (prev.x + (prev.w || 0)));
          const prevCharW = (prev.w && prev.s) ? (prev.w / Math.max(1, String(prev.s).length)) : 6;

          // If it looks like characters of the same word, avoid inserting spaces.
          const noSpace = (gap <= Math.max(2.2, prevCharW * 0.8));
          if (!noSpace) outStr += ' ';
          outStr += token;
          prev = it;
        }
        return outStr.replace(/\s+/g, ' ').trim();
      };

      const joined = lines.map(buildLine).filter(Boolean).join('\n');
      return joined.trim();
    }

    // -----------------------------
    // Rendering
    // -----------------------------
    async function renderPage() {
      if (!pdfDoc) return;

      const seq = ++renderSeq;
      updateIndicators();

      // Cancel previous render if still running
      try {
        if (renderTask && typeof renderTask.cancel === 'function') renderTask.cancel();
      } catch {
        // ignore
      }

      setStatus('Rendering...');
      clearHighlights();

      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale });

      // Set canvas to viewport size
      const ctx = elCanvas.getContext('2d', { alpha: false });
      elCanvas.width = Math.floor(viewport.width);
      elCanvas.height = Math.floor(viewport.height);

      // Keep overlay aligned to canvas size (in CSS pixels)
      elOverlay.style.left = `${elCanvas.offsetLeft}px`;
      elOverlay.style.top = `${elCanvas.offsetTop}px`;
      alignSavedOverlayToCanvas();

      const renderContext = { canvasContext: ctx, viewport };
      renderTask = page.render(renderContext);

      try {
        await renderTask.promise;
      } catch (e) {
        // If a newer render started, ignore.
        if (seq !== renderSeq) return;
        setStatus('Render cancelled');
        return;
      }

      if (seq !== renderSeq) return;
      setStatus('');

      // Highlight matches for the current query (best-effort)
      if (searchQuery) {
        try {
          await highlightMatchesOnCurrentPage(searchQuery, page, viewport);
        } catch {
          // ignore
        }
      }

      updateIndicators();
      saveState();

      // Re-align selection overlay after render (canvas size may change)
      try { updateSelectionOverlay(); } catch {}

      // Saved entries: render (cached) and load if missing
      try { renderSavedOverlay(); } catch {}
      try { loadSavedEntriesForCurrentPage(false); } catch {}
    }

    function setPage(nextPage) {
      if (!pdfDoc) return;
      const total = pdfDoc.numPages;
      pageNum = clamp(nextPage, 1, total);
      renderPage();
      updateIndicators();
      pvScheduleSaveUiState();
    }

    function setScale(nextScale) {
      scale = clamp(nextScale, SCALE_MIN, SCALE_MAX);
      renderPage();
      updateIndicators();
    }

    function fitWidth() {
      if (!pdfDoc) return;
      pdfDoc.getPage(pageNum).then((page) => {
        // Use scale=1 viewport to determine page width
        const vp1 = page.getViewport({ scale: 1.0 });
        const wrapW = Math.max(200, elCanvasWrap.clientWidth - 16);
        const s = wrapW / vp1.width;
        setScale(s);
      }).catch(() => {});
    }

    // -----------------------------
    // Loading
    // -----------------------------
    async function loadPdfFromUrl(url) {
      initPdfJsWorker();

      setStatus('Loading PDF...');
      clearHighlights();
      pageTextCache.clear();
      matches = [];
      matchIndex = -1;

      const loadingTask = window.pdfjsLib.getDocument({ url });
      const doc = await loadingTask.promise;
      pdfDoc = doc;

      // Restore last page from Firebase UI state (preferred), else keep existing pageNum.
      try {
        const stUi = await pvLoadUiState();
        try {
          const fbLang = stUi && typeof stUi.ocrLang === 'string' ? cleanStr(stUi.ocrLang) : '';
          if (fbLang && elOcrLang) elOcrLang.value = fbLang;
        } catch {}
        const fbPage = stUi && Number.isFinite(Number(stUi.pageNum)) ? Math.floor(Number(stUi.pageNum)) : null;
        const desired = Number.isFinite(Number(fbPage)) ? fbPage : pageNum;
        pageNum = clamp(desired, 1, pdfDoc.numPages);
      } catch {
        pageNum = clamp(pageNum, 1, pdfDoc.numPages);
      }

      updateIndicators();
      await renderPage();
      setStatus('');

      pvScheduleSaveUiState();
    }

    function normalizeUrlForFetch(inputUrl) {
      let raw = String(inputUrl || '').trim();
      if (!raw) return { url: '', warning: '' };

      // Accept Windows-style paths in the input ("pdf_viewer\file.pdf").
      raw = raw.replace(/\\+/g, '/');

      // If user types a workspace-style path like "pdf_viewer/learnbook_sw_beg.pdf",
      // interpret it as same-host absolute path ("/pdf_viewer/learnbook_sw_beg.pdf").
      // This avoids accidental resolution to "/pdf_viewer/pdf_viewer/..." when the viewer
      // itself is hosted under "/pdf_viewer/".
      if (/^pdf_viewer\//i.test(raw)) {
        try {
          const abs = new URL('/' + raw, window.location.origin);
          return { url: abs.toString(), warning: '' };
        } catch {
          // fall through
        }
      }

      // If user enters a bare filename, treat it as relative to current page.
      // (e.g. "learnbook_sw_beg.pdf" from /pdf_viewer/ -> resolves to /pdf_viewer/learnbook_sw_beg.pdf)
      // We'll leave it as-is and let the browser resolve.

      // If viewer is served over HTTPS, block mixed content and also browsers block loopback fetch
      // from non-local origins. Provide actionable guidance.
      const isHttps = (window.location && window.location.protocol === 'https:');
      if (isHttps && raw.startsWith('http://')) {
        try {
          const u = new URL(raw);
          const host = (u.hostname || '').toLowerCase();
          const isLoopback = host === 'localhost' || host === '127.0.0.1' || host === '::1';
          if (isLoopback) {
            return {
              url: raw,
              warning: 'Blocked: GitHub Pages (https) cannot fetch http://localhost. Use the file picker, or run this viewer locally (http://localhost:8080/pdf_viewer/), or host the PDF over https.'
            };
          }
          // Try upgrading to https for normal hosts (fixes "Mixed Content" for github.io, etc.)
          u.protocol = 'https:';
          return { url: u.toString(), warning: 'Upgraded URL to https to avoid mixed content.' };
        } catch {
          // keep raw
        }
      }

      return { url: raw, warning: '' };
    }

    async function loadPdfFromFile(file) {
      initPdfJsWorker();

      clearHighlights();
      pageTextCache.clear();

      matchIndex = -1;

      const loadingTask = window.pdfjsLib.getDocument({ data: buf });
      const doc = await loadingTask.promise;
      pdfDoc = doc;

      // Restore last page from Firebase UI state (preferred), else keep existing pageNum.
      try {
        const stUi = await pvLoadUiState();
        try {
          const fbLang = stUi && typeof stUi.ocrLang === 'string' ? cleanStr(stUi.ocrLang) : '';
          if (fbLang && elOcrLang) elOcrLang.value = fbLang;
        } catch {}
        const fbPage = stUi && Number.isFinite(Number(stUi.pageNum)) ? Math.floor(Number(stUi.pageNum)) : null;
        const desired = Number.isFinite(Number(fbPage)) ? fbPage : pageNum;
        pageNum = clamp(desired, 1, pdfDoc.numPages);
      } catch {
        pageNum = clamp(pageNum, 1, pdfDoc.numPages);
      }

      updateIndicators();
      await renderPage();
      setStatus('');

      pvScheduleSaveUiState();
    }

    // -----------------------------
    // Text search
    // -----------------------------
    async function getPageTextLower(pn) {
      if (!pdfDoc) return '';
      if (pageTextCache.has(pn)) return pageTextCache.get(pn).textLower;

      const page = await pdfDoc.getPage(pn);
      const tc = await page.getTextContent();

      // Some PDFs split words into multiple text items (sometimes even per-letter).
      // Keep both a spaced and a compact representation so search can succeed.
      const parts = (tc.items || []).map(it => (it && it.str) ? String(it.str) : '');
      const rawSpaced = parts.join(' ');
      const rawCompact = parts.join('');

      const norm = (s) => {
        try { return String(s || '').normalize('NFKD'); } catch { return String(s || ''); }
      };

      const textLower = norm(rawSpaced).toLowerCase();
      const textLowerNoWS = norm(rawCompact).replace(/\s+/g, '').toLowerCase();

      const obj = {
        rawText: rawSpaced,
        textLower,
        textLowerNoWS,
      };
      pageTextCache.set(pn, obj);
      return obj.textLower;
    }

    async function buildMatches(query) {
      if (!pdfDoc) return;
      const q = String(query || '').trim().toLowerCase();
      searchQuery = q;
      matches = [];
      matchIndex = -1;
      clearHighlights();

      if (!q) {
        updateIndicators();
        return;
      }

      setStatus('Searching...');
      const total = pdfDoc.numPages;

      const qNoWS = q.replace(/\s+/g, '');

      for (let pn = 1; pn <= total; pn++) {
        // eslint-disable-next-line no-await-in-loop
        await getPageTextLower(pn);
        const cached = pageTextCache.get(pn);
        const has = !!cached && (
          (q && cached.textLower && cached.textLower.indexOf(q) !== -1) ||
          (qNoWS && cached.textLowerNoWS && cached.textLowerNoWS.indexOf(qNoWS) !== -1)
        );
        if (has) matches.push({ pageNum: pn });
      }

      if (matches.length) {
        matchIndex = 0;
        setPage(matches[0].pageNum);
      }

      setStatus(matches.length ? '' : 'No matches');
      updateIndicators();
    }

    function gotoMatch(delta) {
      if (!matches.length) return;
      matchIndex = clamp(matchIndex + delta, 0, matches.length - 1);
      const m = matches[matchIndex];
      if (m && m.pageNum) setPage(m.pageNum);
      updateIndicators();
    }

    // -----------------------------
    // Wire UI
    // -----------------------------
    function wire() {
      // Default URL
      const st = loadState();
      currentUrl = (st && typeof st.url === 'string' && st.url.trim()) ? st.url.trim() : DEFAULT_URL;
      if (st && Number.isFinite(Number(st.scale))) scale = clamp(Number(st.scale), SCALE_MIN, SCALE_MAX);
      if (st && Number.isFinite(Number(st.pageNum))) pageNum = Math.max(1, Math.floor(Number(st.pageNum)));

      updateIndicators();

      // OCR language persistence
      try {
        const raw = localStorage.getItem(LS_KEY_OCR);
        if (raw) {
          const stOcr = JSON.parse(raw);
          if (stOcr && typeof stOcr.lang === 'string' && stOcr.lang) elOcrLang.value = stOcr.lang;
        }
      } catch {}

      elOcrLang.onchange = () => {
        try { localStorage.setItem(LS_KEY_OCR, JSON.stringify({ lang: String(elOcrLang.value || 'eng') })); } catch {}
        try { pvScheduleSaveUiState(); } catch {}
      };

      try { applyOcrHeaderHeight(); } catch {}

      elFile.onchange = async () => {
        const f = elFile.files && elFile.files[0];
        if (!f) return;
        try {
          await loadPdfFromFile(f);
          currentUrl = '';
          saveState();
        } catch (e) {
          setStatus('Failed to load file (check console)');
          try { console.warn('load file failed', e); } catch {}
        }
      };

      function openFilePicker() {
        if (!elFile) return;
        try { elFile.value = ''; } catch {}
        elFile.click();
      }

      async function loadFromUrlString(rawInput) {
        const norm = normalizeUrlForFetch(rawInput);
        const url = norm.url;
        if (!url) return;

        // When opened as file://, browsers frequently block fetching relative paths.
        // Allow http(s) URLs, but guide users to the file picker or a local server otherwise.
        const pageProto = (window.location && window.location.protocol) ? window.location.protocol : '';
        const isHttpUrl = /^https?:\/\//i.test(url);
        if (pageProto === 'file:' && !isHttpUrl) {
          setStatus('Tip: opened as file://. Use Ctrl+O (file picker), or run a local server (python -m http.server) to load by URL/path.');
          return;
        }

        if (norm.warning) setStatus(norm.warning);
        try {
          await loadPdfFromUrl(url);
          currentUrl = String(rawInput || '').trim();
          // Restore persisted page only after a successful load
          const st2 = loadState();
          const maybePage = st2 && Number.isFinite(Number(st2.pageNum)) ? Math.floor(Number(st2.pageNum)) : 1;
          if (maybePage > 1 && pdfDoc) {
            setPage(clamp(maybePage, 1, pdfDoc.numPages));
          }
        } catch (e) {
          setStatus('Failed to load URL (check console)');
          try { console.warn('load url failed', e); } catch {}
        }
      }

      async function promptAndLoadUrl() {
        const def = String(currentUrl || DEFAULT_URL || '').trim();
        const raw = window.prompt('PDF URL or path', def);
        if (raw == null) return;
        await loadFromUrlString(raw);
        saveState();
      }

      async function promptAndSearch() {
        if (!pdfDoc) return;
        const def = String(searchQuery || '').trim();
        const q = window.prompt('Search text', def);
        if (q == null) return;
        await buildMatches(q);
      }

      function consumeGotoPage() {
        if (!inGotoPage) return null;
        const raw = String(inGotoPage.value || '').trim();
        if (!raw) return null;
        const n = Math.floor(Number(raw));
        if (!Number.isFinite(n) || n < 1) {
          try { inGotoPage.value = ''; } catch {}
          return null;
        }
        try { inGotoPage.value = ''; } catch {}
        return n;
      }

      btnPrev.onclick = () => setPage(pageNum - 1);
      btnNext.onclick = () => {
        const n = consumeGotoPage();
        if (n != null) {
          setPage(n);
          return;
        }
        setPage(pageNum + 1);
      };

      btnZoomOut.onclick = () => setScale(scale / SCALE_STEP);
      btnZoomIn.onclick = () => setScale(scale * SCALE_STEP);
      btnFitWidth.onclick = () => fitWidth();

      if (inGotoPage) {
        inGotoPage.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            e.stopPropagation();
            const n = consumeGotoPage();
            if (n != null) setPage(n);
          }
        });
      }

      btnSelect.onclick = () => {
        setSelectMode(!selectMode);
      };

      btnClearSel.onclick = () => {
        clearSelection();
      };

      btnSaveToFB_Ocr.onclick = async () => {
        try {
          if (!pdfDoc) return;

          // Ensure current page entries are loaded before checking duplicates / updating.
          await loadSavedEntriesForCurrentPage(true);

          const nowIso = new Date().toISOString();
          const txt = cleanStr(elOcrText && elOcrText.value);
          if (!txt) {
            setOcrStatus('Nothing to save');
            return;
          }

          let rect1 = null;
          let entryId = '';
          let isEdit = false;

          if (activeSavedEntryId && activeSavedRect1) {
            isEdit = true;
            entryId = String(activeSavedEntryId);
            rect1 = activeSavedRect1;
          } else {
            if (!selRectCanvas) {
              setOcrStatus('No selection');
              return;
            }
            rect1 = {
              x: selRectCanvas.x / scale,
              y: selRectCanvas.y / scale,
              w: selRectCanvas.w / scale,
              h: selRectCanvas.h / scale,
            };

            const dupId = findDuplicateEntryIdByRect1(rect1, 2);
            if (dupId) {
              setOcrStatus('Already saved');
              return;
            }
            entryId = makeEntryIdFromRect1(rect1);

            // Guard against ID collisions from rounding: never overwrite an existing entry.
            if (savedEntriesById && typeof savedEntriesById === 'object' && savedEntriesById[entryId]) {
              entryId = `${entryId}_${Date.now()}`;
            }
          }

          const path = `${pvGetRtdbPagePath(pageNum)}/${entryId}`;
          const prev = (savedEntriesById && typeof savedEntriesById === 'object') ? savedEntriesById[entryId] : null;
          const createdAt = toIsoTimestamp(prev && prev.createdAt, nowIso);
          const updatedAt = nowIso;

          const payload = {
            rect1,
            scaleSaved: scale,
            text_sw: txt,
            text_en: cleanStr(prev && prev.text_en),
            text_uk: cleanStr(prev && prev.text_uk),
            createdAt,
            updatedAt,
          };

          await pvRtdbRequest(path, 'PUT', payload);

          // Update local cache and overlay.
          try {
            if (!savedEntriesById || typeof savedEntriesById !== 'object') savedEntriesById = {};
            savedEntriesById[entryId] = payload;
            savedCache.set(pvActiveSavedKey(pageNum), { entriesById: savedEntriesById });
          } catch {}

          renderSavedOverlay();
          setOcrStatus(isEdit ? 'Updated' : 'Saved');
          clearActiveEditEntry();

          // Close dialog after saving a NEW record only.
          if (!isEdit && dlgOcr && typeof dlgOcr.close === 'function') {
            try { dlgOcr.close(); } catch {}
          }
        } catch (e) {
          const msg = (e && e.message) ? e.message : String(e || 'save failed');
          setOcrStatus(`Save failed: ${msg}`);
          try { console.warn('Save OCR to FB failed', e); } catch {}
        }
      };

      // Click saved rectangle to open OCR dialog in edit mode (only when Select mode is OFF)
      if (elSavedOverlay) {
        elSavedOverlay.onclick = (ev) => {
          try {
            if (selectMode) return;
            const t = ev && ev.target ? ev.target : null;
            const id = t && t.dataset ? cleanStr(t.dataset.entryId) : '';
            if (!id) return;
            const entry = (savedEntriesById && typeof savedEntriesById === 'object') ? savedEntriesById[id] : null;
            if (!entry || typeof entry !== 'object') return;

            activeSavedEntryId = id;
            activeSavedRect1 = entry.rect1 || null;
            if (elOcrText) elOcrText.value = cleanStr(entry.text_sw);

            clearOcrStatus();

            try { applyOcrHeaderHeight(); } catch {}

            // Position dialog near saved rectangle.
            const rc = rect1ToCanvasRect(entry.rect1);
            if (rc) {
              try { positionOcrDialogNearCanvasRect(rc); } catch {}
            } else {
              try { positionOcrDialog(); } catch {}
            }

            if (dlgOcr && typeof dlgOcr.showModal === 'function') {
              try { dlgOcr.showModal(); } catch {}
            }
          } catch {}
        };
      }

      async function ensureOcrWorker(lang) {
        const l = String(lang || 'eng').trim();
        if (!window.Tesseract) throw new Error('Tesseract not loaded');

        if (ocrWorker && ocrWorkerLang === l) return ocrWorker;
        if (ocrWorker) {
          try { await ocrWorker.terminate(); } catch {}
          ocrWorker = null;
          ocrWorkerLang = '';
        }

        setOcrStatus('OCR: init...');
        // Tesseract.js v5: languages are provided to createWorker and are preloaded/initialized.
        // Avoid deprecated loadLanguage/initialize calls.
        ocrWorker = await window.Tesseract.createWorker(l);
        ocrWorkerLang = l;
        return ocrWorker;
      }

      async function runOcrSelection() {
        if (!selRectCanvas) return;
        if (!pdfDoc) return;

        // Starting OCR from a fresh selection must not be treated as "edit existing".
        clearActiveEditEntry();

        const lang = String(elOcrLang.value || 'eng');
        try { applyOcrHeaderHeight(); } catch {}
        try { positionOcrDialog(); } catch {}
        if (dlgOcr && typeof dlgOcr.showModal === 'function') {
          try { dlgOcr.showModal(); } catch {}
        }
        if (elOcrText) elOcrText.value = '';
        clearOcrStatus();
        setOcrStatus('OCR: preparing image...');

        // Prefer extracting real PDF text from the selection if available.
        // This preserves diacritics (å/ä/ö) and punctuation better than OCR.
        try {
          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale });
          const txt = await extractPdfTextInRect(page, viewport, selRectCanvas);
          if (txt) {
            if (elOcrText) elOcrText.value = txt;
            setOcrStatus('Text extracted from PDF layer');
            try { positionOcrDialog(); } catch {}
            return;
          }
        } catch {
          // ignore and fall back to OCR
        }

        // Crop current canvas into an offscreen canvas
        const crop = document.createElement('canvas');
        crop.width = selRectCanvas.w;
        crop.height = selRectCanvas.h;
        const cctx = crop.getContext('2d');
        const ctx = elCanvas.getContext('2d');
        const img = ctx.getImageData(selRectCanvas.x, selRectCanvas.y, selRectCanvas.w, selRectCanvas.h);
        cctx.putImageData(img, 0, 0);

        // Upscale selection to help OCR detect small diacritics (ö/ä/å).
        // Tesseract performs much better with ~200-300 DPI equivalent.
        const UPSCALE = 2;
        const off = document.createElement('canvas');
        off.width = Math.max(1, crop.width * UPSCALE);
        off.height = Math.max(1, crop.height * UPSCALE);
        const octx = off.getContext('2d');
        octx.imageSmoothingEnabled = true;
        octx.drawImage(crop, 0, 0, off.width, off.height);

        // Light preprocessing: grayscale + contrast stretch (simple, fast).
        try {
          const id = octx.getImageData(0, 0, off.width, off.height);
          const d = id.data;
          for (let i = 0; i < d.length; i += 4) {
            const r = d[i];
            const g = d[i + 1];
            const b = d[i + 2];
            // luminance
            let y = (0.2126 * r + 0.7152 * g + 0.0722 * b);
            // contrast (center around 128)
            y = (y - 128) * 1.25 + 128;
            y = Math.max(0, Math.min(255, y));
            d[i] = d[i + 1] = d[i + 2] = y;
            d[i + 3] = 255;
          }
          octx.putImageData(id, 0, 0);
        } catch {
          // ignore preprocessing failure
        }

        try {
          const worker = await ensureOcrWorker(lang);
          try {
            // Improve recognition for small snippets.
            // 7 = single text line, 8 = single word.
            // Auto-pick based on selection aspect ratio (wide => line).
            const aspect = (selRectCanvas && selRectCanvas.h) ? (selRectCanvas.w / Math.max(1, selRectCanvas.h)) : 1;
            const psm = (aspect >= 2.2) ? '7' : '8';

            const params = {
              user_defined_dpi: '300',
              tessedit_pageseg_mode: psm,
              // Keep spaces when OCR is configured to drop them.
              preserve_interword_spaces: '1'
            };
            await worker.setParameters(params);
          } catch {
            // setParameters may not be available in some builds; ignore
          }
          setOcrStatus('OCR: recognizing...');
          const res = await worker.recognize(off);
          const text = (res && res.data && typeof res.data.text === 'string') ? res.data.text : '';
          if (elOcrText) elOcrText.value = String(text || '').trim();
          setOcrStatus('OCR: done');
          try { positionOcrDialog(); } catch {}
        } catch (e) {
          setOcrStatus('OCR failed (check console)');
          try { console.warn('OCR failed', e); } catch {}
        }
      }

      btnOcr.onclick = () => {
        runOcrSelection();
      };

      // Keyboard shortcuts (desktop)
      document.addEventListener('keydown', (e) => {
        if (isTypingTarget(document.activeElement)) return;

        // Global shortcuts (even before a PDF is loaded)
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
          e.preventDefault();
          openFilePicker();
          return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
          e.preventDefault();
          promptAndLoadUrl();
          return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          promptAndSearch();
          return;
        }

        if (!pdfDoc) {
          return;
        }

        const k = e.key;
        if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); setPage(pageNum - 1); return; }
        if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); setPage(pageNum + 1); return; }
        if (k === '+' || k === '=') { e.preventDefault(); setScale(scale * SCALE_STEP); return; }
        if (k === '-') { e.preventDefault(); setScale(scale / SCALE_STEP); return; }
        if (k === 'Home') { e.preventDefault(); setPage(1); return; }
        if (k === 'End') { e.preventDefault(); setPage(pdfDoc.numPages); return; }

        // Match navigation: F3 / Shift+F3, or N/P
        if (k === 'F3') { e.preventDefault(); gotoMatch(e.shiftKey ? -1 : +1); return; }
        if (k.toLowerCase() === 'n') { e.preventDefault(); gotoMatch(+1); return; }
        if (k.toLowerCase() === 'p') { e.preventDefault(); gotoMatch(-1); return; }
      });

      // Selection with pointer events (mouse + touch)
      elCanvas.addEventListener('pointerdown', (e) => {
        if (!selectMode) return;
        // Any new pointer selection cancels previous edit target.
        clearActiveEditEntry();
        try { elCanvas.setPointerCapture(e.pointerId); } catch {}

        const rect = elCanvas.getBoundingClientRect();
        const xCss = clamp(e.clientX - rect.left, 0, rect.width);
        const yCss = clamp(e.clientY - rect.top, 0, rect.height);
        selStart = { xCss, yCss };
        selRectCss = { x: xCss, y: yCss, w: 1, h: 1 };
        isSelecting = true;
        updateSelectionOverlay();
        e.preventDefault();
      });

      elCanvas.addEventListener('pointermove', (e) => {
        if (!selectMode || !isSelecting || !selStart) return;
        const rect = elCanvas.getBoundingClientRect();
        const xCss = clamp(e.clientX - rect.left, 0, rect.width);
        const yCss = clamp(e.clientY - rect.top, 0, rect.height);

        const x0 = selStart.xCss;
        const y0 = selStart.yCss;
        const x = Math.min(x0, xCss);
        const y = Math.min(y0, yCss);
        const w = Math.max(1, Math.abs(xCss - x0));
        const h = Math.max(1, Math.abs(yCss - y0));
        selRectCss = { x, y, w, h };
        updateSelectionOverlay();
        e.preventDefault();
      });

      function endSelect(e) {
        if (!selectMode || !isSelecting) return;
        isSelecting = false;
        selStart = null;
        updateSelectionOverlay();
        e.preventDefault();
      }

      elCanvas.addEventListener('pointerup', endSelect);
      elCanvas.addEventListener('pointercancel', endSelect);

      // Keep bottom bar from covering content
      const bottom = document.getElementById('bottomBar');
      const spacer = document.querySelector('.spacer');
      const updateSpacer = () => {
        if (!bottom) return;
        const h = Math.ceil(bottom.getBoundingClientRect().height || 92);
        const pad = Math.max(72, h + 12);
        try {
          document.documentElement.style.setProperty('--pv-bottomBarPad', `${pad}px`);
        } catch {}
        // Spacer is kept only for legacy layout; it's hidden via CSS.
        if (spacer) {
          try { spacer.style.height = '0px'; } catch {}
        }
      };
      updateSpacer();
      try { new ResizeObserver(updateSpacer).observe(bottom); } catch { window.addEventListener('resize', updateSpacer); }

      // Reposition OCR dialog when viewport changes
      window.addEventListener('resize', () => {
        if (isOcrDialogOpen()) {
          try { positionOcrDialog(); } catch {}
        }
        try { alignSavedOverlayToCanvas(); } catch {}
        try { renderSavedOverlay(); } catch {}
      });

      // Clear edit mode when dialog closes to avoid accidental overwrites later.
      if (dlgOcr) {
        dlgOcr.addEventListener('close', () => {
          clearActiveEditEntry();
        });
      }

      // Auto-load URL if available
      if (currentUrl && String(currentUrl).trim()) {
        // Avoid confusing startup error when opened via file:// and URL is a relative path.
        const pageProto = (window.location && window.location.protocol) ? window.location.protocol : '';
        const isHttpUrl = /^https?:\/\//i.test(String(currentUrl).trim());
        if (pageProto !== 'file:' || isHttpUrl) loadFromUrlString(currentUrl);
      }
    }

    // Start
    wire();
  </script>
</body>
</html>
