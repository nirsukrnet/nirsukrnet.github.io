function DeleteCursorPointStyle() {
    var styles = document.styleSheets;
    for (var i = 0; i < styles.length; i++) {
        let rules;
        try {
            rules = styles[i].cssRules || styles[i].rules;
        } catch (e) {
            // SecurityError: Cannot access rules of cross-origin stylesheet
            continue;
        }
        if (!rules) continue;
        for (var j = 0; j < rules.length; j++) {
            if (rules[j].style && rules[j].style.cursor === 'pointer') {
                rules[j].style.cursor = '';
            }
        }
    }
}


function setFontSize() {
    var codeBlocks = document.querySelectorAll('code');
    codeBlocks.forEach(function(block) {
        if (block.classList.contains('language-python')) {
            block.style.fontSize = '0.8em'; // Set the desired font size for Python code blocks
        } else {
            block.style.fontSize = '1em'; // Set the default font size for other code blocks
        }
    });
        
}


function AddToMenuNewItem(index, menuTitle) {
    var menu = document.getElementById("menu");
    var newItem = document.createElement("a");
    newItem.href = `#section_${index}`; // Change this to the appropriate section ID
    newItem.innerText = menuTitle; // Change this to the desired text
    menu.appendChild(newItem);
}

function ReadFromMainData() {
    // extract data between <section> tags from  main_data_content    
    var arr_sections = [];    
    var data1 = main_data_content.split("<delimeter7823892367>");
    data1.forEach(item => {
        if (item.trim() != "") {
           arr_sections.push(item.trim());
         }   
    });
    return arr_sections;
}

function ExtractFromSection_VarSection(data1,name_varsection) {
    var regex = new RegExp(`<${name_varsection}>(.*?)<\/${name_varsection}>`, 's');
    var match = data1.match(regex);
    return match ? match[1] : null;
}

function forEachSectionConvertFromMDToHTML() {
    const withButtonCopy = '   <div class="container-clp" onclick="copyToClipboard(this)">               <button class="copy-btn-clp">Copy</button>';
    const withoutButtonCopy = '   <div class="container-clp">';
    const DivMenu = document.getElementById("menu");
    const newDivParent = document.createElement("div");
    newDivParent.id = "visible_block1";
    // add newDivParent after menu div
    DivMenu.parentNode.insertBefore(newDivParent, DivMenu.nextSibling);

    //read data from main_data_content
    var sections = ReadFromMainData();

    var inx = 0;
    sections.forEach(section => {
        // extract menu_title and menu_title_short
        let s_menuTitle = ExtractFromSection_VarSection(section, "menu_title");
        let s_menuTitleShort = ExtractFromSection_VarSection(section, "menu_title_short");
        let s_response = ExtractFromSection_VarSection(section, "response");
        if(!s_response) {
            console.log("No response found", 'last section index', inx);
        }
        const menuTitle = s_menuTitle.trim();
        const menuTitleShort = s_menuTitleShort.trim();
        const responseText = s_response.trim();
        // Add new item to menu        
        inx++;
        AddToMenuNewItem(inx, menuTitleShort);
        var markcode1 = responseText; // section.innerHTML; 
        var Html1 = marked.parse(markcode1);
        var newSection = document.createElement("section");        
        newSection.id = `section_${inx}`; // Set the id for each section
        newSection.className = "section"; // Add a class for styling
        newSection.innerHTML = `               
               <div><a class = "href-clp" href="#menu">menu</a> <div class="descr_copy-clp">${menuTitleShort}</div> </div>
               <div class="container-clp">
               <div class="text-to-copy-clp">${Html1}</div>
               </div>    
        `;
        newDivParent.appendChild(newSection); // Append the new section to the parent div
        Prism.highlightAll(); // Highlight the code after setting the innerHTML
    });

}
