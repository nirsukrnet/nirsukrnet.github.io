<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rec_voice — live speech to text</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: 12px;
      padding-bottom: 84px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.4;
      color: #111;
    }

    header {
      margin: 0;
      display: none;
    }

    h1 { margin: 0; font-size: 18px; }
    .sub { opacity: 0.8; font-size: 13px; }

    main { width: 100%; max-width: none; margin: 0; }

    /* Top-right main menu (sessions) */
    #mainMenu {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: none;
      gap: 8px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid color-mix(in srgb, #111 18%, #999);
      background: color-mix(in srgb, #fff 92%, #111);
      box-shadow: 0 10px 26px rgba(0,0,0,.10);
      width: min(420px, calc(100vw - 24px));
    }

    #mainMenu .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      opacity: 0.85;
    }

    #mainMenu .row {
      margin: 0;
      gap: 8px;
    }

    #selSession {
      min-width: 240px;
      width: 100%;
    }

    #mainMenu small {
      opacity: 0.75;
      font-size: 12px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin: 12px 0;
    }

    label {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font-size: 14px;
    }

    select {
      min-height: 40px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #999;
      background: #fff;
    }

    button {
      padding: 10px 12px;
      min-height: 44px;
      border: 1px solid currentColor;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    button:disabled { opacity: 0.6; cursor: default; }

    /* yout_pl2-like controls */
    .yu2-btn { white-space: nowrap; }
    .yu2-btn--play { font-variant-numeric: tabular-nums; }

    .row.controls {
      flex-wrap: nowrap;
      background: transparent;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: min(980px, calc(100vw - 24px));
      margin: 0;
      padding: 12px;
      z-index: 900;
    }

    /* Keep control buttons transparent by default */
    .row.controls button { background: transparent; }

    /* Tool buttons: match yout_pl2 purple style */
    .row.controls button.yu2-btn--tool {
      user-select: none;
      color: #fff;
      border-color: color-mix(in srgb, #502cd4 70%, #ffffff);
      background-color: rgba(80,44,212,.25); /* fallback */
      background-color: color-mix(in srgb, #502cd4 90%, transparent);
    }

    #btnPermission[data-state="unknown"] { color: #333; }
    #btnPermission[data-state="allowed"] { color: #1a7f37; }
    #btnPermission[data-state="denied"] { color: #b42318; }
    #btnPermission[data-state="unsupported"] { color: #555; }

    #btnRec[data-state="idle"] { color: #1d4ed8; }
    #btnRec[data-state="recording"] {
      color: #fff;
      background-color: color-mix(in srgb, #b42318 85%, transparent);
      border-color: color-mix(in srgb, #b42318 85%, transparent);
    }

    .panel {
      border: 1px solid #999;
      border-radius: 12px;
      padding: 10px;
      min-height: 220px;
      max-height: min(70vh, 720px);
      overflow-y: auto;
      display: grid;
      gap: 10px;
      background: #fff;
    }

    .latest {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, #1d4ed8 35%, #999);
      background: color-mix(in srgb, #1d4ed8 7%, transparent);
    }

    .latestTitle { font-size: 12px; opacity: 0.75; margin-bottom: 6px; }
    #latestText { font-size: 15px; white-space: pre-wrap; word-break: break-word; }

    .historyTitle { font-size: 12px; opacity: 0.75; }

    #history {
      display: grid;
      gap: 8px;
    }

    /* History meta visibility (default hidden via data-show-meta="0") */
    #history[data-show-meta="0"] .meta {
      display: none;
    }

    /* Selected history items */
    .item[data-selected="1"] {
      border-color: color-mix(in srgb, #0ea5e9 55%, #999);
      background: color-mix(in srgb, #0ea5e9 12%, transparent);
    }

    .itemHead {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .selBtn {
      padding: 6px 10px;
      min-height: 32px;
      border-radius: 10px;
      border: 1px solid currentColor;
      background: transparent;
      font-size: 12px;
    }

    .selBtn[data-on="1"] {
      color: #fff;
      background-color: color-mix(in srgb, #0ea5e9 85%, transparent);
      border-color: color-mix(in srgb, #0ea5e9 85%, transparent);
    }

    .item {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, #111 18%, #999);
      background: color-mix(in srgb, #111 3%, transparent);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .meta {
      display: flex;
      gap: 10px;
      align-items: baseline;
      justify-content: space-between;
      font-size: 12px;
      opacity: 0.75;
      margin-bottom: 4px;
    }

    .status {
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px dashed #999;
      background: color-mix(in srgb, #f59e0b 10%, transparent);
    }

    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    dialog {
      border: 1px solid currentColor;
      border-radius: 12px;
      padding: 12px;
      width: min(680px, calc(100vw - 24px));
    }

    dialog::backdrop {
      background: rgba(0,0,0,.35);
    }

    /* YouTube transcript items window */
    .ytItems {
      border: 1px solid color-mix(in srgb, #111 18%, #999);
      border-radius: 12px;
      padding: 10px;
      background: #fff;
      margin: 0 0 12px;
    }

    .ytAllText {
      border: 1px solid color-mix(in srgb, #111 14%, #999);
      border-radius: 10px;
      padding: 10px;
      background: color-mix(in srgb, #111 2%, transparent);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: min(35vh, 360px);
      overflow: auto;
    }

    .ytItemsHead {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .ytItemsTitle {
      font-size: 12px;
      opacity: 0.85;
      display: flex;
      gap: 8px;
      align-items: baseline;
    }

    #ytItemsList {
      display: grid;
      gap: 6px;
    }

    .ytItem {
      border: 1px solid color-mix(in srgb, #111 14%, #999);
      border-radius: 10px;
      padding: 8px 10px;
      background: color-mix(in srgb, #111 2%, transparent);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ytItemMeta {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .ytLine {
      display: flex;
      gap: 10px;
      align-items: baseline;
    }

    .ytLine small {
      min-width: 50px;
      opacity: 0.75;
    }

    .ytLine2 {
      padding-left: 60px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="mainMenu" aria-label="Main menu">
    <div class="title">
      <strong>Sessions</strong>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="btnSessionsReload" type="button" title="Reload sessions list" style="min-height:32px; padding:6px 10px;">Reload</button>
        <button id="btnSessionsHide" type="button" title="Hide sessions panel" style="min-height:32px; padding:6px 10px;">×</button>
      </div>
    </div>
    <div class="row" style="flex-wrap:nowrap;">
      <label style="flex:1; width:100%;">
        <span style="min-width:70px;">Session:</span>
        <select id="selSession" aria-label="Session list" disabled>
          <option value="">Loading…</option>
        </select>
      </label>
    </div>

    <div class="row" style="flex-wrap:nowrap;">
      <button id="btnRecYoutubeMenu" type="button" title="Choose YouTube reference video" style="min-height:32px; padding:6px 10px;">Menu</button>
      <div style="flex:1; min-height:32px; display:flex; align-items:center; justify-content:flex-end; gap:8px;">
        <span style="opacity:.75; font-size:12px;">YouTube:</span>
        <strong id="sessionYoutubeName" style="font-size:12px; font-weight:600;">(none)</strong>
      </div>
    </div>
    <small id="sessionHint">Firebase not ready</small>
  </div>

  <button id="btnSessionsShow" type="button" title="Toggle sessions panel" style="position:fixed; top:12px; right:12px; z-index:1001; min-height:32px; padding:6px 10px; border-radius:999px;">Sessions</button>

  <header></header>

  <main>
    <section id="ytItemsList" class="ytItems ytAllText" aria-label="Transcript items"></section>

    <div class="row controls">
      <button id="btnRec" class="yu2-btn yu2-btn--play" type="button" data-state="idle" disabled>R en</button>

      <button id="btnYtBeg" class="yu2-btn yu2-btn--tool" type="button" title="Go to beginning" disabled>Beg</button>
      <button id="btnYtPrev" class="yu2-btn yu2-btn--tool" type="button" title="Previous" disabled>Prev</button>
      <button id="btnYtNext" class="yu2-btn yu2-btn--tool" type="button" title="Next" disabled>Next</button>

      <button id="btnEndPhrase" class="yu2-btn yu2-btn--tool" type="button" title="End phrase: move current text to history">E</button>
      <button id="btnCMenu" class="yu2-btn yu2-btn--tool" type="button" title="Menu" style="margin-left:auto;">⋯</button>
    </div>

    <div id="panel" class="panel" aria-label="Transcript output">
      <div class="latest">
        <div class="latestTitle">Latest segment</div>
        <div id="latestText">(empty)</div>
      </div>

      <div>
        <div class="row" style="margin:0 0 6px; align-items:center;">
          <div class="historyTitle">History</div>
          <button id="btnClearSelected" type="button" style="margin-left:auto;" disabled>Clear selected</button>
        </div>
        <div id="history" data-show-meta="0"></div>
      </div>
    </div>
  </main>

  <dialog id="dlgCMenu">
    <form method="dialog">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <strong>Menu</strong>
        <button value="cancel" aria-label="Close" title="Close">Close</button>
      </div>
      <div class="row" style="margin:10px 0 0;">
        <button id="btnPermission" type="button" data-state="unknown" title="Check/ask microphone permission">Permission mic</button>
        <label style="gap:6px;">
          <span>Language</span>
          <select id="selLang" aria-label="Language">
            <option value="uk-UA">Ukrainian (uk-UA)</option>
            <option value="en-US" selected>English (en-US)</option>
            <option value="sv-SE">Swedish (sv-SE)</option>
          </select>
        </label>
        <button id="btnToggleMeta" type="button" data-state="0" title="Toggle meta line (time + language)">Meta: off</button>
      </div>

      <div class="row" style="margin:10px 0 0;">
        <button id="btnYtShowTranslation" type="button" data-state="1" title="Show/hide translation in the transcript items window">YT translation: on</button>
      </div>
      <div class="sub" style="margin-top:6px;">
        Tip: mic permission often requires HTTPS or <code>localhost</code>.
      </div>
    </form>
  </dialog>

  <dialog id="dlgConfirmDelete">
    <form method="dialog">
      <strong>Delete selected items?</strong>
      <div id="confirmDeleteText" style="margin:8px 0 12px;"></div>
      <div class="row" style="margin:0; justify-content:flex-end;">
        <button value="cancel">Cancel</button>
        <button id="btnConfirmDelete" value="confirm">Delete</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgCreateSession">
    <form method="dialog">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <strong>Create session</strong>
        <button value="cancel" aria-label="Close" title="Close">Close</button>
      </div>

      <div style="display:grid; gap:8px; margin-top:10px;">
        <label style="display:grid; gap:6px; align-items:start;">
          <span>Title</span>
          <input id="inpSessionTitle" type="text" style="min-height:40px; padding:8px 10px; border-radius:10px; border:1px solid #999;" />
        </label>
        <label style="display:grid; gap:6px; align-items:start;">
          <span>Description</span>
          <textarea id="inpSessionDesc" rows="3" style="padding:8px 10px; border-radius:10px; border:1px solid #999;"></textarea>
        </label>
      </div>

      <div class="row" style="margin:12px 0 0; justify-content:flex-end;">
        <button id="btnCreateSessionCancel" value="cancel">Cancel</button>
        <button id="btnCreateSessionSave" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgRecYoutubeMenu">
    <form method="dialog">
      <button value="cancel" aria-label="Close" title="Close"
        style="position:absolute; top:8px; right:8px; width:32px; min-height:32px; padding:0; border-radius:10px; line-height:1; font-size:18px;">
        ×
      </button>

      <strong>YouTube menu</strong>
      <div class="sub" style="margin:6px 0 10px;">Choose a reference video to attach to the current session.</div>

      <div class="row" style="margin:0 0 10px;">
        <input id="inRecYoutubeFilter" placeholder="type to filter" style="width:100%; box-sizing:border-box; padding:10px; border:1px solid currentColor; border-radius:10px;" />
      </div>

      <div id="recYoutubeStatus" class="sub" style="margin:0 0 10px;"></div>
      <ul id="recYoutubeList" style="list-style:none; padding:0; margin:10px 0 0; display:grid; gap:6px;"></ul>
    </form>
  </dialog>

  <script src="./yout_pl2/yu2_global_var.js"></script>

  <script>
    "use strict";

    /** @type {HTMLSelectElement} */
    const selLang = document.getElementById('selLang');
    /** @type {HTMLButtonElement} */
    const btnRec = document.getElementById('btnRec');
    /** @type {HTMLButtonElement} */
    const btnEndPhrase = document.getElementById('btnEndPhrase');
    /** @type {HTMLButtonElement} */
    const btnCMenu = document.getElementById('btnCMenu');

    /** @type {HTMLDialogElement} */
    const dlgCMenu = document.getElementById('dlgCMenu');
    /** @type {HTMLDialogElement} */
    const dlgConfirmDelete = document.getElementById('dlgConfirmDelete');
    const confirmDeleteText = document.getElementById('confirmDeleteText');
    const btnConfirmDelete = document.getElementById('btnConfirmDelete');

    /** @type {HTMLButtonElement} */
    const btnPermission = document.getElementById('btnPermission');
    /** @type {HTMLButtonElement} */
    const btnToggleMeta = document.getElementById('btnToggleMeta');
    /** @type {HTMLButtonElement} */
    const btnClearSelected = document.getElementById('btnClearSelected');

    /** @type {HTMLButtonElement} */
    const btnYtShowTranslation = document.getElementById('btnYtShowTranslation');

    /** @type {HTMLSelectElement} */
    const selSession = document.getElementById('selSession');
    /** @type {HTMLButtonElement} */
    const btnSessionsReload = document.getElementById('btnSessionsReload');
    /** @type {HTMLButtonElement} */
    const btnSessionsHide = document.getElementById('btnSessionsHide');
    /** @type {HTMLButtonElement} */
    const btnSessionsShow = document.getElementById('btnSessionsShow');
    const sessionHint = document.getElementById('sessionHint');

    /** @type {HTMLButtonElement} */
    const btnRecYoutubeMenu = document.getElementById('btnRecYoutubeMenu');
    const sessionYoutubeName = document.getElementById('sessionYoutubeName');
    /** @type {HTMLDialogElement} */
    const dlgRecYoutubeMenu = document.getElementById('dlgRecYoutubeMenu');
    /** @type {HTMLInputElement} */
    const inRecYoutubeFilter = document.getElementById('inRecYoutubeFilter');
    const recYoutubeStatus = document.getElementById('recYoutubeStatus');
    const recYoutubeList = document.getElementById('recYoutubeList');

    /** @type {HTMLDialogElement} */
    const dlgCreateSession = document.getElementById('dlgCreateSession');
    /** @type {HTMLInputElement} */
    const inpSessionTitle = document.getElementById('inpSessionTitle');
    /** @type {HTMLTextAreaElement} */
    const inpSessionDesc = document.getElementById('inpSessionDesc');
    /** @type {HTMLButtonElement} */
    const btnCreateSessionSave = document.getElementById('btnCreateSessionSave');
    /** @type {HTMLButtonElement} */
    const btnCreateSessionCancel = document.getElementById('btnCreateSessionCancel');

    const elStatus = document.getElementById('status');
    const panel = document.getElementById('panel');
    const latestText = document.getElementById('latestText');
    const history = document.getElementById('history');

    /** @type {HTMLButtonElement} */
    const btnYtBeg = document.getElementById('btnYtBeg');
    /** @type {HTMLButtonElement} */
    const btnYtPrev = document.getElementById('btnYtPrev');
    /** @type {HTMLButtonElement} */
    const btnYtNext = document.getElementById('btnYtNext');
    const ytItemsStatus = document.getElementById('ytItemsStatus');
    const ytItemsList = document.getElementById('ytItemsList');
    const ytItemsStart = document.getElementById('ytItemsStart');
    const ytItemsLangInfo = document.getElementById('ytItemsLangInfo');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let isRecording = false;
    let micPermissionState = 'unknown'; // unknown | allowed | denied | unsupported
    let _lastHistoryText = '';
    let _lastHistoryAtMs = 0;
    let accumulatedFinalText = '';

    // Firebase sessions state
    const SESSION_CREATE_VALUE = '__create__';
    let fbReady = false;
    let activeSessionId = '';
    let sessionsIndex = []; // [{id,title,description,updatedAt,youtube_ids}]
    let nextEntryId = 0;

    // Ref videos cache (from DB_CONST_REF_YOUTUBE_VIDEOS)
    let refVideosCache = []; // [{indent_id, short_name, title, url, order, tag}]
    let refVideosById = new Map();

    // YouTube transcript viewer state
    let ytStartIndex = 0;
    let ytLastVideoId = '';
    let ytLoadSeq = 0;
    let ytLang1Show = '';
    let ytLang2Show = '';

    // Render option: include translation (lang2) inside #ytItemsList
    let ytShowTranslation = true;
    let ytLastPrimaryText = '';
    let ytLastTranslationText = '';

    const SHOW_META_KEY = 'rec_voice_show_meta';

    function pad2(n) {
      const x = Number(n);
      return String(Number.isFinite(x) ? x : 0).padStart(2, '0');
    }

    function formatTitleDefault(now = new Date()) {
      return `${pad2(now.getDate())}-${pad2(now.getMonth() + 1)}-${now.getFullYear()} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    }

    function formatItemId(now = new Date()) {
      return `${pad2(now.getDate())}-${pad2(now.getMonth() + 1)}-${now.getFullYear()}_${pad2(now.getHours())}_${pad2(now.getMinutes())}_${pad2(now.getSeconds())}`;
    }

    function ensureGv() {
      if (window.gv && window.gv.URL_DS && window.gv.cst && typeof window.gv.cst.getcst === 'function') return window.gv;
      const GVClass = (typeof GlobalVars === 'function')
        ? GlobalVars
        : (typeof globalThis !== 'undefined' && typeof globalThis.GlobalVars === 'function')
          ? globalThis.GlobalVars
          : (typeof window.GlobalVars === 'function')
            ? window.GlobalVars
            : null;
      if (!GVClass) throw new Error('GlobalVars is not available (yu2_global_var.js not loaded)');
      const gv = new GVClass();
      window.gv = gv;
      return gv;
    }

    async function ensureSignedIn() {
      const gv = ensureGv();
      if (gv.URL_DS && gv.URL_DS.idToken) return;
      if (typeof gv.SignIn_User !== 'function') throw new Error('gv.SignIn_User missing');
      await gv.SignIn_User();
    }

    function requestByPath(addurl, method = 'GET', body = null) {
      return new Promise((resolve, reject) => {
        try {
          const gv = ensureGv();
          const ObjRequest = gv.URL_DS.GetObjForRequest();
          ObjRequest.addUrl = addurl;
          ObjRequest.ametod = method;
          ObjRequest.vobj = body;
          ObjRequest.CallBackFunction = function(vdata) { resolve(vdata); };
          ObjRequest.ErrorCallback = function(err) { reject(err || new Error('request failed')); };
          gv.URL_DS.requestData_By_URL_Path(ObjRequest);
        } catch (e) {
          reject(e);
        }
      });
    }

    function getDbRoot() {
      try {
        const gv = window.gv;
        const fromCst = (gv && gv.cst && typeof gv.cst.getcst === 'function') ? gv.cst.getcst('DB_CONST_DB_YOUTUBE2_ROOT') : '';
        const fromWin = (window.YT_DB_CONST && typeof window.YT_DB_CONST.DB_YOUTUBE2_ROOT === 'string') ? window.YT_DB_CONST.DB_YOUTUBE2_ROOT : '';
        return String(fromCst || fromWin || '../db_youtube2');
      } catch {
        return '../db_youtube2';
      }
    }

    function getPaths() {
      const ROOT = getDbRoot();
      return {
        ROOT,
        REF_REC_STORAGE: `${ROOT}/ref_rec_storage`,
        REC_STORAGE_DATA: `${ROOT}/rec_storage_data`,
        UI_STATE_REC_VOICE: `${ROOT}/ui_state/rec_voice`,
        YOUTUBE_TRANSCRIPTS: `${ROOT}/youtube_transcripts`,
      };
    }

    function setSessionUiReady(ready, hint) {
      fbReady = Boolean(ready);
      selSession.disabled = !fbReady;
      btnSessionsReload.disabled = !fbReady;
      sessionHint.textContent = hint || (fbReady ? 'Ready' : 'Firebase not ready');
    }

    function nowIso() {
      try { return new Date().toISOString(); } catch { return String(Date.now()); }
    }

    function safeParseIsoToMs(iso) {
      const t = Date.parse(String(iso || ''));
      return Number.isFinite(t) ? t : NaN;
    }

    function getSessionMeta(sessionId) {
      const sid = String(sessionId || '');
      return sessionsIndex.find(x => x && x.id === sid) || null;
    }

    function updateSessionYoutubeLabel() {
      const meta = getSessionMeta(activeSessionId);
      const vid = meta && typeof meta.youtube_ids === 'string' ? meta.youtube_ids : '';
      if (!vid) {
        sessionYoutubeName.textContent = '(none)';
        return;
      }
      const rec = refVideosById.get(vid);
      const shortName = rec && typeof rec.short_name === 'string' ? rec.short_name.trim() : '';
      sessionYoutubeName.textContent = shortName || vid;
    }

    function setYtItemsStatus(msg) {
      if (!ytItemsStatus) return;
      ytItemsStatus.textContent = msg || '';
    }

    function getActiveYoutubeId() {
      const meta = getSessionMeta(activeSessionId);
      return (meta && typeof meta.youtube_ids === 'string') ? meta.youtube_ids.trim() : '';
    }

    function cleanLangCode(x) {
      const s = (x == null) ? '' : String(x).trim().toLowerCase();
      if (!s) return '';
      if (!/^[a-z]{2,3}$/.test(s)) return '';
      return s;
    }

    function setYtLangInfo(l1, l2) {
      const a = cleanLangCode(l1);
      const b = cleanLangCode(l2);
      if (!ytItemsLangInfo) return;
      if (!a) {
        ytItemsLangInfo.textContent = '';
        return;
      }
      if (b && b !== a) ytItemsLangInfo.textContent = `(${a} + ${b})`;
      else ytItemsLangInfo.textContent = `(${a})`;
    }

    function langFromSelValue(selValue) {
      const raw = (selValue == null) ? '' : String(selValue);
      const base = raw.split('-')[0];
      const code = cleanLangCode(base);
      return code || '';
    }

    function getRowTextLikeYoutPl2(row, langCode) {
      const code = cleanLangCode(langCode);
      if (row && code) {
        const v = row[`text_${code}`];
        if (typeof v === 'string' && v.trim()) return v.trim();
      }
      const legacy = row && row.text;
      if (typeof legacy === 'string' && legacy.trim()) return legacy.trim();
      return '';
    }

    async function loadYtItemsListLangSettings(videoId) {
      // For rendering <section id="ytItemsList"> we must use per-video settings
      // stored together with the transcript:
      //   DB_CONST_YOUTUBE_TRANSCRIPTS/<videoId>/{lang1_show,lang2_show}
      try {
        const vid = cleanStr(videoId);
        if (!vid) return { lang1: '', lang2: '' };
        const { YOUTUBE_TRANSCRIPTS } = getPaths();
        if (!YOUTUBE_TRANSCRIPTS) return { lang1: '', lang2: '' };

        const data = await requestByPath(`${YOUTUBE_TRANSCRIPTS}/${vid}`, 'GET');

        const lang1 = cleanLangCode(data && data.lang1_show);

        // lang2_show may be intentionally empty (Off)
        let lang2 = '';
        try {
          if (data && typeof data === 'object' && Object.prototype.hasOwnProperty.call(data, 'lang2_show')) {
            lang2 = cleanLangCode(data.lang2_show) || '';
          }
        } catch {}

        return { lang1, lang2 };
      } catch {
        return { lang1: '', lang2: '' };
      }
    }

    function renderTranscriptText3(text) {
      if (!ytItemsList) return;
      ytItemsList.textContent = text || '';
    }

    function refreshYtTranslationToggleUI() {
      if (!btnYtShowTranslation) return;
      btnYtShowTranslation.dataset.state = ytShowTranslation ? '1' : '0';
      btnYtShowTranslation.textContent = ytShowTranslation ? 'YT translation: on' : 'YT translation: off';
    }

    function renderYtItemsFromCache() {
      let out = ytLastPrimaryText || '';
      if (ytShowTranslation && (ytLastTranslationText || '').trim()) {
        out = out ? `${out}\n\n${ytLastTranslationText}` : ytLastTranslationText;
      }
      renderTranscriptText3(out);
    }

    async function loadTranscriptItemsWindow(opts = {}) {
      const seq = ++ytLoadSeq;
      const requestedStart = Number.isFinite(Number(opts.startIndex)) ? Number(opts.startIndex) : ytStartIndex;
      ytStartIndex = Math.max(0, Math.floor(requestedStart));
      if (ytItemsStart) ytItemsStart.textContent = `start: ${ytStartIndex}`;

      const vid = getActiveYoutubeId();
      const canNav = fbReady && !!vid;
      btnYtBeg.disabled = !canNav;
      btnYtPrev.disabled = !canNav || (ytStartIndex === 0);
      btnYtNext.disabled = !canNav;

      if (!vid) {
        ytLastVideoId = '';
        setYtLangInfo('', '');
        setYtItemsStatus('Select YouTube video to view transcript items.');
        ytLastPrimaryText = '';
        ytLastTranslationText = '';
        renderTranscriptText3('');
        return;
      }

      if (!fbReady) {
        ytLastVideoId = vid;
        setYtLangInfo('', '');
        setYtItemsStatus('Firebase not ready.');
        ytLastPrimaryText = '';
        ytLastTranslationText = '';
        renderTranscriptText3('');
        return;
      }

      setYtItemsStatus('Loading…');
      const { lang1, lang2 } = await loadYtItemsListLangSettings(vid);
      ytLang1Show = lang1 || 'sv';
      // Respect Off/empty for lang2_show. Only use lang2 when it differs from lang1.
      ytLang2Show = (lang2 && lang2 !== ytLang1Show) ? lang2 : '';
      setYtLangInfo(ytLang1Show, ytLang2Show);

      const { YOUTUBE_TRANSCRIPTS } = getPaths();
      const idx = [ytStartIndex, ytStartIndex + 1, ytStartIndex + 2, ytStartIndex + 3];
      const results = await Promise.all(idx.map(async (i) => {
        try {
          const v = await requestByPath(`${YOUTUBE_TRANSCRIPTS}/${vid}/items/${i}`, 'GET');
          return { ok: true, index: i, value: v };
        } catch {
          return { ok: false, index: i, value: null };
        }
      }));

      if (seq !== ytLoadSeq) return;

      const rows = results.slice(0, 3).filter(r => r.ok && r.value != null).map(r => r.value);
      const lookahead = results[3];

      ytLastVideoId = vid;

      if (!rows.length) {
        setYtItemsStatus('(no items at this position)');
        ytLastPrimaryText = '';
        ytLastTranslationText = '';
        renderTranscriptText3('');
      } else {
        const part1 = [];
        const part2 = [];
        for (const row of rows) {
          const a = getRowTextLikeYoutPl2(row, ytLang1Show);
          const b = ytLang2Show ? getRowTextLikeYoutPl2(row, ytLang2Show) : '';
          if (a) part1.push(a);
          if (b) part2.push(b);
        }

        ytLastPrimaryText = part1.join('\n');
        ytLastTranslationText = part2.join('\n');

        let text = ytLastPrimaryText;
        if (ytShowTranslation && part2.length) text = `${text}\n\n${ytLastTranslationText}`;
        setYtItemsStatus('');
        renderTranscriptText3(text);
      }

      btnYtPrev.disabled = (ytStartIndex === 0);
      const hasNext = Boolean(lookahead && lookahead.ok && lookahead.value != null);
      btnYtNext.disabled = !hasNext;
      btnYtBeg.disabled = false;
    }

    function setRecYoutubeStatus(msg) {
      recYoutubeStatus.textContent = msg || '';
    }

    function cleanStr(x) {
      return (x == null) ? '' : String(x).trim();
    }

    function renderRefVideosList(filterText) {
      const f = cleanStr(filterText).toLowerCase();
      recYoutubeList.innerHTML = '';
      const list = (refVideosCache || []).filter(v => {
        if (!f) return true;

    async function loadRefVideos() {
      const gv = ensureGv();
      const refPath = gv.cst.getcst('DB_CONST_REF_YOUTUBE_VIDEOS');
      if (!refPath) throw new Error('DB_CONST_REF_YOUTUBE_VIDEOS missing');
      const data = await requestByPath(refPath, 'GET');
      const list = [];
      if (data && typeof data === 'object') {
        for (const v of Object.values(data)) {
          if (!v || typeof v !== 'object') continue;
          const indent_id = cleanStr(v.indent_id);
          if (!indent_id) continue;
          list.push({
            indent_id,
            short_name: cleanStr(v.short_name),
            title: cleanStr(v.title),
            url: cleanStr(v.url),
            tag: cleanStr(v.tag),
            order: Number(v.order)
          });
        }
      }
      list.sort((a, b) => {
        const ao = Number.isFinite(a.order) ? a.order : 9999;
        const bo = Number.isFinite(b.order) ? b.order : 9999;
        return (ao - bo) || cleanStr(a.short_name || a.title || a.indent_id).localeCompare(cleanStr(b.short_name || b.title || b.indent_id));
      });
      refVideosCache = list;
      refVideosById = new Map(list.map(x => [x.indent_id, x]));
      updateSessionYoutubeLabel();
      return list;
    }

    async function openRecYoutubeMenu() {

    async function onSelectRefVideo(v) {
      const sid = activeSessionId;
      if (!sid) {
        setStatus('Select or create a session first.', 'info');
        return;
      }
      const vid = cleanStr(v && v.indent_id);

      const patch = { youtube_ids: vid, updatedAt: nowIso() };
      await requestByPath(`${REF_REC_STORAGE}/${sid}`, 'PATCH', patch);

      // Update local cache
      const meta = getSessionMeta(sid);
      if (meta) {
        meta.youtube_ids = vid;
        meta.updatedAt = patch.updatedAt;
      }
      // Re-sort sessions (updatedAt changed)
      sessionsIndex.sort((a, b) => {
        const ta = safeParseIsoToMs(a && a.updatedAt);
        const tb = safeParseIsoToMs(b && b.updatedAt);
        return (tb - ta) || cleanStr(a.title).localeCompare(cleanStr(b.title));
      });

      renderSessionsSelect(sid);
      updateSessionYoutubeLabel();
      ytStartIndex = 0;
      loadTranscriptItemsWindow({ startIndex: 0 });
      setStatus('YouTube attached to session.', 'ok');

    }

    function setSessionsPanelVisible(visible) {
      const on = Boolean(visible);
      const panelEl = document.getElementById('mainMenu');
      // Note: #mainMenu is display:none in CSS by default, so we must explicitly
      // set a visible display mode when opening.
      if (panelEl) panelEl.style.display = on ? 'grid' : 'none';
      if (btnSessionsShow) {

    function setStatus(msg, kind = 'info') {
      if (!elStatus) return;
      if (!msg) {
        elStatus.hidden = true;
        elStatus.textContent = '';
        return;
      }
      elStatus.hidden = false;
      elStatus.textContent = msg;
      // keep kind hook if you want later
      elStatus.dataset.kind = kind;
    }

    function setMicPermissionState(state, details = '') {
      micPermissionState = state;
      btnPermission.dataset.state = state;

      if (state === 'allowed') {
        btnPermission.textContent = 'Mic: allowed';
        btnPermission.title = details || 'Microphone permission granted';
      } else if (state === 'denied') {
        btnPermission.textContent = 'Mic: denied';
        btnPermission.title = details || 'Microphone permission denied. Enable it in browser/site settings.';
      } else if (state === 'unsupported') {
        btnPermission.textContent = 'Mic: unsupported';
        btnPermission.title = details || 'Microphone permission API not available in this context.';
      } else {
        btnPermission.textContent = 'Permission mic';
        btnPermission.title = details || 'Check/ask microphone permission';
      }

      // Enable recognition button if speech API exists and mic is not explicitly denied.
      const speechSupported = Boolean(SpeechRecognition);
      btnRec.disabled = !speechSupported || (state === 'denied') || isRecording;

      if (!speechSupported) {
        setStatus('Speech recognition not supported in this browser (SpeechRecognition/webkitSpeechRecognition missing).', 'warn');
      }

      // Keep btnRec label synced with current state/lang.
      updateRecButtonLabel();
    }

    function updateRecButtonLabel() {
      const langTag = (selLang && selLang.value) ? String(selLang.value) : '';
      const shortLang = langTag.split(/[-_]/)[0] || langTag;
      btnRec.textContent = isRecording ? `S ${shortLang}` : `R ${shortLang}`;
    }

    function scrollIfNearTop() {
      // Keep latest segment + newest history visible, but don't yank user if they scroll down.
      if (panel.scrollTop <= 40) panel.scrollTop = 0;
    }

    function setLatest(text) {
      const t = (text == null || String(text).trim() === '') ? '(empty)' : String(text);
      latestText.textContent = t;
      scrollIfNearTop();
    }

    function addHistoryItem(text, lang, datetimeMs = null, entryId = null) {
      const cleanText = (text == null) ? '' : String(text).trim();
      if (!cleanText) return;

      // Prevent double-add when stopping can trigger a final result too.
      const now = Date.now();
      const norm = cleanText.replace(/\s+/g, ' ');
      if (_lastHistoryText === norm && (now - _lastHistoryAtMs) < 1500) return;
      _lastHistoryText = norm;
      _lastHistoryAtMs = now;

      const item = document.createElement('div');
      item.className = 'item';
      item.dataset.selected = '0';

      const head = document.createElement('div');
      head.className = 'itemHead';

      const meta = document.createElement('div');
      meta.className = 'meta';

      const left = document.createElement('span');
      const at = (datetimeMs && Number.isFinite(Number(datetimeMs))) ? new Date(Number(datetimeMs)) : new Date();
      left.textContent = at.toLocaleTimeString();
      const right = document.createElement('span');
      right.textContent = lang || '';

      meta.appendChild(left);
      meta.appendChild(right);

      const sel = document.createElement('button');
      sel.type = 'button';
      sel.className = 'selBtn';
      sel.textContent = 'Select';
      sel.dataset.on = '0';
      sel.addEventListener('click', (e) => {
        e.preventDefault();
        const on = item.dataset.selected === '1';
        item.dataset.selected = on ? '0' : '1';
        sel.dataset.on = on ? '0' : '1';
        sel.textContent = on ? 'Select' : 'Selected';
        refreshClearSelectedUI();
      });

      head.appendChild(meta);
      head.appendChild(sel);

      const body = document.createElement('div');
      body.textContent = cleanText;

      item.appendChild(head);
      item.appendChild(body);

      if (entryId != null && entryId !== '') item.dataset.entryId = String(entryId);

      // Newest on top
      history.prepend(item);
      scrollIfNearTop();

      refreshClearSelectedUI();

      return item;
    }

    function refreshClearSelectedUI() {
      const selected = history.querySelectorAll('.item[data-selected="1"]').length;
      btnClearSelected.disabled = selected === 0;
      btnClearSelected.textContent = selected ? `Clear selected (${selected})` : 'Clear selected';
    }

    function setShowMeta(on) {
      const v = on ? '1' : '0';
      history.dataset.showMeta = v;
      btnToggleMeta.dataset.state = v;
      btnToggleMeta.textContent = on ? 'Meta: on' : 'Meta: off';
      try { localStorage.setItem(SHOW_META_KEY, v); } catch { /* ignore */ }
    }

    function loadShowMetaSetting() {
      try {
        const v = localStorage.getItem(SHOW_META_KEY);
        return v === '1';
      } catch {
        return false;
      }
    }

    function setRecState(recording) {
      isRecording = Boolean(recording);

      if (isRecording) {
        btnRec.dataset.state = 'recording';
        updateRecButtonLabel();
        btnRec.disabled = false;
        // while recording, don't allow permission button to be clicked to avoid confusion
        btnPermission.disabled = true;
      } else {
        btnRec.dataset.state = 'idle';
        updateRecButtonLabel();
        btnPermission.disabled = false;
        // enable/disable based on current known permission + support
        const speechSupported = Boolean(SpeechRecognition);
        btnRec.disabled = !speechSupported || (micPermissionState === 'denied');
      }
    }

    async function queryPermissionIfPossible() {
      // Permissions API is not consistently supported for 'microphone' across browsers.
      // We'll try it, but we do not rely on it.
      try {
        if (!navigator.permissions || !navigator.permissions.query) return;
        const result = await navigator.permissions.query({ name: 'microphone' });
        if (!result) return;

        const mapState = (s) => {
          if (s === 'granted') return 'allowed';
          if (s === 'denied') return 'denied';
          return 'unknown'; // prompt
        };

        const apply = () => setMicPermissionState(mapState(result.state), `Permissions API: ${result.state}`);
        apply();
        result.onchange = apply;
      } catch {
        // ignore, fallback to unknown
      }
    }

    async function requestMicPermission() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setMicPermissionState('unsupported', 'navigator.mediaDevices.getUserMedia is not available.');
        setStatus('Microphone access is not available in this browser/context. Try HTTPS or localhost.', 'warn');
        return false;
      }

      try {
        setStatus('Requesting microphone permission…', 'info');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // Immediately stop tracks (we only need permission here)
        for (const track of stream.getTracks()) track.stop();

        setMicPermissionState('allowed');
        setStatus('Microphone permission granted.', 'ok');
        return true;
      } catch (err) {
        const msg = (err && err.name) ? `${err.name}: ${err.message || ''}` : String(err);
        setMicPermissionState('denied', msg);
        setStatus('Microphone permission denied. Enable it in browser/site settings and retry.', 'warn');
        return false;
      }
    }

    function createRecognition() {
      if (!SpeechRecognition) return null;
      const r = new SpeechRecognition();
      r.lang = selLang.value;
      r.continuous = true;
      r.interimResults = true;
      r.maxAlternatives = 1;

      r.onstart = () => {
        setStatus('Recognition started.', 'ok');
        setRecState(true);
      };

      r.onend = () => {
        // This can happen unexpectedly; always sync UI.
        setRecState(false);
        setStatus('Recognition stopped.', 'info');
      };

      r.onerror = (ev) => {
        const err = ev && ev.error ? String(ev.error) : 'unknown';
        setStatus(`Recognition error: ${err}`, 'warn');

        // Common errors: 'not-allowed', 'service-not-allowed'
        if (err === 'not-allowed' || err === 'service-not-allowed') {
          setMicPermissionState('denied', `Recognition error: ${err}`);
        }
      };

      r.onresult = (event) => {
        let interim = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const res = event.results[i];
          const text = res && res[0] ? String(res[0].transcript || '') : '';
          if (res.isFinal) {
            const t = text.trim();
            if (t) accumulatedFinalText = (accumulatedFinalText ? (accumulatedFinalText + ' ') : '') + t;
          } else {
            interim += text;
          }
        }

        // IMPORTANT: do not auto-move to history. Only update accumulated text in #latestText.
        const combined = (accumulatedFinalText + ' ' + interim).trim();
        setLatest(combined);
      };

      return r;
    }

    async function startRecognition() {
      if (isRecording) return;

      // Make sure mic permission is available; request only if needed.
      if (micPermissionState !== 'allowed') {
        const ok = await requestMicPermission();
        if (!ok) return;
      }

      if (!SpeechRecognition) {
        setStatus('Speech recognition not supported in this browser.', 'warn');
        return;
      }

      // Recreate recognition each start so language changes always apply.
      if (recognition) {
        try { recognition.onresult = null; recognition.onerror = null; recognition.onend = null; recognition.onstart = null; } catch {}
        recognition = null;
      }

      recognition = createRecognition();
      if (!recognition) return;

      try {
        recognition.start();
      } catch (err) {
        setStatus(`Failed to start recognition: ${String(err)}`, 'warn');
        setRecState(false);
      }
    }

    function stopRecognition() {
      if (!recognition) {
        setRecState(false);
        return;
      }

      try {
        recognition.stop();
      } catch {
        // If stop fails, force UI state.
        setRecState(false);
      }
    }

    btnPermission.addEventListener('click', async () => {
      await requestMicPermission();
    });

    btnRec.addEventListener('click', async () => {
      if (isRecording) stopRecognition();
      else await startRecognition();
    });

    btnEndPhrase.addEventListener('click', () => {
      const latest = (latestText && latestText.textContent) ? String(latestText.textContent).trim() : '';
      if (!latest || latest === '(empty)') {
        setStatus('Nothing to commit. Speak first, then press E.', 'info');
        return;
      }

      const el = addHistoryItem(latest, selLang.value, Date.now(), null);
      if (!activeSessionId) {
        setStatus('Committed locally. Select or create a session to save to Firebase.', 'info');
      } else if (!fbReady) {
        setStatus('Committed locally. Firebase not ready.', 'warn');
      } else {
        savePhraseToActiveSession(latest, selLang.value, el);
        setStatus('Committed (E) and saving to Firebase…', 'ok');
      }
      accumulatedFinalText = '';
      setLatest('');
    });

    btnCMenu.addEventListener('click', () => {
      try { dlgCMenu.showModal(); } catch { /* ignore */ }
      refreshYtTranslationToggleUI();
    });

    btnYtShowTranslation.addEventListener('click', async () => {
      ytShowTranslation = !ytShowTranslation;
      refreshYtTranslationToggleUI();
      renderYtItemsFromCache();
      try {
        const { UI_STATE_REC_VOICE } = getPaths();
        const cur = await requestByPath(UI_STATE_REC_VOICE, 'GET');
        const payload = {
          ...(cur && typeof cur === 'object' ? cur : {}),
          yt_show_translation: ytShowTranslation ? 1 : 0,
          atupdate: Date.now(),
        };
        await requestByPath(UI_STATE_REC_VOICE, 'PUT', payload);
      } catch {
        // ignore
      }
    });

    btnToggleMeta.addEventListener('click', () => {
      const cur = history.dataset.showMeta === '1';
      setShowMeta(!cur);
    });

    btnClearSelected.addEventListener('click', () => {
      const selected = Array.from(history.querySelectorAll('.item[data-selected="1"]'));
      if (selected.length === 0) {
        setStatus('No selected items to delete.', 'info');
        return;
      }
      confirmDeleteText.textContent = `This will delete ${selected.length} item(s) from history.`;
      try { dlgConfirmDelete.showModal(); } catch { /* ignore */ }
    });

    btnConfirmDelete.addEventListener('click', (e) => {
      const selected = Array.from(history.querySelectorAll('.item[data-selected="1"]'));

      (async () => {
        // Best-effort Firebase delete (only if item has entryId + session active)
        const sid = activeSessionId;
        if (fbReady && sid) {
          const { REC_STORAGE_DATA, REF_REC_STORAGE } = getPaths();
          const entryIds = selected
            .map(el => (el && el.dataset && el.dataset.entryId) ? String(el.dataset.entryId) : '')
            .filter(x => x !== '');

          if (entryIds.length) {
            try {
              for (const entryId of entryIds) {
                await requestByPath(`${REC_STORAGE_DATA}/${sid}/${entryId}`, 'DELETE');
              }
              await requestByPath(`${REF_REC_STORAGE}/${sid}`, 'PATCH', { updatedAt: nowIso() });
            } catch (err) {
              setStatus(`Firebase delete failed: ${String(err)}`, 'warn');
            }
          }
        }

        for (const el of selected) el.remove();
        refreshClearSelectedUI();
        setStatus(`Deleted ${selected.length} item(s).`, 'ok');
        e.preventDefault();
        try { dlgConfirmDelete.close('confirm'); } catch { /* ignore */ }
      })();
    });

    async function loadSessionsIndex() {
      const { REF_REC_STORAGE } = getPaths();
      const data = await requestByPath(REF_REC_STORAGE, 'GET');
      const list = [];
      const toMigrate = [];

      if (data && typeof data === 'object') {
        for (const [id, v] of Object.entries(data)) {
          if (!id) continue;
          const title = (v && typeof v.title === 'string') ? v.title : id;
          const description = (v && typeof v.description === 'string') ? v.description : '';
          const youtube_ids = (v && typeof v.youtube_ids === 'string') ? v.youtube_ids : '';

          let updatedAt = (v && typeof v.updatedAt === 'string') ? v.updatedAt : '';
          const t = safeParseIsoToMs(updatedAt);
          if (!Number.isFinite(t)) {
            // Legacy migration: derive updatedAt from atupdate if possible, else now.
            const legacyAt = Number(v && v.atupdate);
            if (Number.isFinite(legacyAt) && legacyAt > 0) updatedAt = new Date(legacyAt).toISOString();
            else updatedAt = nowIso();
            toMigrate.push({ id, updatedAt });
          }

          list.push({ id, title, description, youtube_ids, updatedAt });
        }
      }

      // Lazy migrate missing/invalid updatedAt (do not use atupdate for sorting)
      if (toMigrate.length) {
        for (const it of toMigrate) {
          try {
            await requestByPath(`${REF_REC_STORAGE}/${it.id}`, 'PATCH', { updatedAt: it.updatedAt });
          } catch (e) {
            console.warn('[rec_voice] updatedAt migration failed', it.id, e);
          }
        }
      }

      list.sort((a, b) => {
        const ta = safeParseIsoToMs(a && a.updatedAt);
        const tb = safeParseIsoToMs(b && b.updatedAt);
        return (tb - ta) || String(a.title).localeCompare(String(b.title));
      });
      sessionsIndex = list;
      updateSessionYoutubeLabel();
      return list;
    }

    function renderSessionsSelect(selectedId) {
      const prev = String(selectedId || '');
      selSession.innerHTML = '';

      const optCreate = document.createElement('option');
      optCreate.value = SESSION_CREATE_VALUE;
      optCreate.textContent = '+ Create new one…';
      selSession.appendChild(optCreate);

      if (!sessionsIndex.length) {
        const optEmpty = document.createElement('option');
        optEmpty.value = '';
        optEmpty.textContent = '(no sessions)';
        selSession.appendChild(optEmpty);
      } else {
        for (const it of sessionsIndex) {
          const opt = document.createElement('option');
          opt.value = it.id;
          opt.textContent = it.title || it.id;
          selSession.appendChild(opt);
        }
      }

      if (prev && sessionsIndex.some(x => x.id === prev)) selSession.value = prev;
      else selSession.value = SESSION_CREATE_VALUE;
    }

    async function loadUiStateSelection() {
      const { UI_STATE_REC_VOICE } = getPaths();
      try {
        const data = await requestByPath(UI_STATE_REC_VOICE, 'GET');
        const sid = (data && typeof data.selected_session_id === 'string') ? data.selected_session_id : '';
        ytShowTranslation = !data ? true : Boolean(data.yt_show_translation === 1 || data.yt_show_translation === true || data.yt_show_translation === '1');
        refreshYtTranslationToggleUI();
        renderYtItemsFromCache();
        return sid;
      } catch {
        return '';
      }
    }

    async function saveUiStateSelection(sessionId) {
      const { UI_STATE_REC_VOICE } = getPaths();
      await requestByPath(UI_STATE_REC_VOICE, 'PUT', {
        selected_session_id: String(sessionId || ''),
        yt_show_translation: ytShowTranslation ? 1 : 0,
        atupdate: Date.now(),
      });
    }

    function clearHistoryUi() {
      history.innerHTML = '';
      refreshClearSelectedUI();
    }

    function computeNextNumericKey(itemsObj) {
      let max = -1;
      if (itemsObj && typeof itemsObj === 'object') {
        for (const k of Object.keys(itemsObj)) {
          if (!/^\d+$/.test(k)) continue;
          const n = Number(k);
          if (Number.isFinite(n)) max = Math.max(max, n);
        }
      }
      return max + 1;
    }

    async function loadSessionItems(sessionId) {
      const { REC_STORAGE_DATA } = getPaths();
      const data = await requestByPath(`${REC_STORAGE_DATA}/${sessionId}`, 'GET');

      clearHistoryUi();

      const list = [];
      if (data && typeof data === 'object') {
        for (const [entryId, v] of Object.entries(data)) {
          const dt = Number(v && v.datetime);
          list.push({
            entryId,
            datetime: Number.isFinite(dt) ? dt : 0,
            text: (v && typeof v.text === 'string') ? v.text : '',
            lang: (v && typeof v.lang === 'string') ? v.lang : '',
          });
        }
      }

      list.sort((a, b) => (b.datetime - a.datetime) || (String(b.entryId).localeCompare(String(a.entryId))));
      for (const it of list) addHistoryItem(it.text, it.lang, it.datetime, it.entryId);

      nextEntryId = computeNextNumericKey(data);
      setStatus(`Loaded session ${sessionId}: ${list.length} item(s).`, 'ok');
    }

    function openCreateSessionDialog() {
      const defTitle = formatTitleDefault(new Date());
      inpSessionTitle.value = defTitle;
      inpSessionDesc.value = '';
      try {
        inpSessionTitle.focus();
        const len = inpSessionTitle.value.length;
        inpSessionTitle.setSelectionRange(len, len);
      } catch {}
      try { dlgCreateSession.showModal(); } catch { /* ignore */ }
    }

    async function createSessionFromDialog() {
      const now = new Date();
      let id = formatItemId(now);
      let suffix = 1;
      while (sessionsIndex.some(x => x.id === id)) {
        suffix++;
        id = `${formatItemId(now)}__${suffix}`;
      }

      const title = String(inpSessionTitle.value || '').trim() || formatTitleDefault(now);
      const description = String(inpSessionDesc.value || '').trim();
      const updatedAt = nowIso();

      const { REF_REC_STORAGE } = getPaths();
      await requestByPath(`${REF_REC_STORAGE}/${id}`, 'PUT', { title, description, updatedAt });

      activeSessionId = id;
      nextEntryId = 0;
      clearHistoryUi();
      await saveUiStateSelection(id);
      await loadSessionsIndex();
      renderSessionsSelect(id);
      updateSessionYoutubeLabel();
      ytStartIndex = 0;
      loadTranscriptItemsWindow({ startIndex: 0 });
      setStatus(`Created session: ${title}`, 'ok');
    }

    async function selectSession(sessionId) {
      const sid = String(sessionId || '');
      if (!sid) return;
      activeSessionId = sid;
      await saveUiStateSelection(sid);
      await loadSessionItems(sid);
      updateSessionYoutubeLabel();
      ytStartIndex = 0;
      loadTranscriptItemsWindow({ startIndex: 0 });
    }

    async function savePhraseToActiveSession(text, lang, historyEl) {
      const sid = activeSessionId;
      if (!fbReady || !sid) return;
      const { REC_STORAGE_DATA, REF_REC_STORAGE } = getPaths();

      const entryId = String(nextEntryId);
      const datetime = Date.now();
      const payload = { datetime, text: String(text || ''), lang: String(lang || '') };
      try {
        await requestByPath(`${REC_STORAGE_DATA}/${sid}/${entryId}`, 'PUT', payload);
        await requestByPath(`${REF_REC_STORAGE}/${sid}`, 'PATCH', { updatedAt: nowIso() });
        nextEntryId++;
        if (historyEl && historyEl.dataset) historyEl.dataset.entryId = entryId;
      } catch (err) {
        setStatus(`Firebase save failed: ${String(err)}`, 'warn');
      }
    }

    async function initSessionsUi() {
      try {
        ensureGv();
        await ensureSignedIn();
        setSessionUiReady(true, 'Ready');

        // Preload ref videos for short_name display (do not block init)
        loadRefVideos().catch(() => {});

        await loadSessionsIndex();
        const saved = await loadUiStateSelection();
        renderSessionsSelect(saved);

        if (saved && sessionsIndex.some(x => x.id === saved)) {
          await selectSession(saved);
        } else {
          activeSessionId = '';
          nextEntryId = 0;
          clearHistoryUi();
          updateSessionYoutubeLabel();
          ytStartIndex = 0;
          loadTranscriptItemsWindow({ startIndex: 0 });
        }
      } catch (err) {
        setSessionUiReady(false, 'Firebase not ready');
        console.warn('[rec_voice] sessions init failed', err);
      }
    }

    btnYtBeg.addEventListener('click', () => {
      ytStartIndex = 0;
      loadTranscriptItemsWindow({ startIndex: 0 });
    });

    btnYtPrev.addEventListener('click', () => {
      ytStartIndex = Math.max(0, ytStartIndex - 1);
      loadTranscriptItemsWindow({ startIndex: ytStartIndex });
    });

    btnYtNext.addEventListener('click', () => {
      ytStartIndex = ytStartIndex + 1;
      loadTranscriptItemsWindow({ startIndex: ytStartIndex });
    });

    selSession.addEventListener('change', () => {
      const v = String(selSession.value || '');
      if (v === SESSION_CREATE_VALUE) {
        renderSessionsSelect(activeSessionId);
        openCreateSessionDialog();
        return;
      }
      if (!v) return;
      (async () => {
        try {
          await selectSession(v);
        } catch (err) {
          setStatus(`Failed to load session: ${String(err)}`, 'warn');
        }
      })();
    });

    btnSessionsReload.addEventListener('click', () => {
      (async () => {
        try {
          await loadSessionsIndex();
          renderSessionsSelect(activeSessionId);
          loadTranscriptItemsWindow({ startIndex: ytStartIndex });
          setStatus('Sessions reloaded.', 'ok');
        } catch (err) {
          setStatus(`Reload failed: ${String(err)}`, 'warn');
        }
      })();
    });

    btnSessionsHide.addEventListener('click', () => {
      setSessionsPanelVisible(false);
    });

    btnSessionsShow.addEventListener('click', () => {
      const isOpen = btnSessionsShow && btnSessionsShow.dataset.open === '1';
      setSessionsPanelVisible(!isOpen);
    });

    btnRecYoutubeMenu.addEventListener('click', () => {
      openRecYoutubeMenu();
    });

    inRecYoutubeFilter.addEventListener('input', () => {
      renderRefVideosList(inRecYoutubeFilter.value);
    });

    btnCreateSessionSave.addEventListener('click', (e) => {
      e.preventDefault();
      (async () => {
        try {
          await createSessionFromDialog();
          try { dlgCreateSession.close('save'); } catch { /* ignore */ }
        } catch (err) {
          setStatus(`Create session failed: ${String(err)}`, 'warn');
        }
      })();
    });

    btnCreateSessionCancel.addEventListener('click', (e) => {
      e.preventDefault();
      try { dlgCreateSession.close('cancel'); } catch { /* ignore */ }
    });

    selLang.addEventListener('change', () => {
      // Per spec: language affects recognition on next start.
      setStatus(`Language set to ${selLang.value}.`, 'info');
      updateRecButtonLabel();
    });

    // Init
    (async function init() {
      setLatest('');

      updateRecButtonLabel();

      // Sessions panel opens only by click on the Sessions button.
      setSessionsPanelVisible(false);

      refreshClearSelectedUI();

      // Default: meta hidden
      setShowMeta(loadShowMetaSetting());

      // Firebase sessions (top-right menu)
      initSessionsUi();

      // Basic support hints
      if (!SpeechRecognition) {
        setMicPermissionState('unknown');
        btnRec.disabled = true;
        return;
      }

      // Start with unknown, then try to query.
      setMicPermissionState('unknown');
      await queryPermissionIfPossible();

      // If Permissions API says granted, allow starting immediately.
      // Otherwise user can press "Permission mic" first.
      if (micPermissionState === 'allowed') {
        btnRec.disabled = false;
      }
    })();
  </script>
</body>
</html>
