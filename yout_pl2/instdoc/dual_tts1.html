<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dictionary — dual TTS</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    .dialog {
      width: calc(100vw - 16px);
      max-width: 560px;
      height: calc(100vh - 16px);
      margin: 8px auto;
      border: 1px solid currentColor;
      border-radius: 12px;
      padding: 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid currentColor;
      background: transparent;
      border-radius: 10px;
      padding: 10px 14px;
      min-height: 36px;
      font-size: 14px;
      cursor: pointer;
    }

    button[data-selected="1"] {
      background-color: color-mix(in srgb, currentColor 14%, transparent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    input[type="number"] {
      width: 72px;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid currentColor;
      border-radius: 10px;
      font-size: 14px;
      min-height: 36px;
    }

    .muted {
      opacity: 0.7;
      font-size: 14px;
    }

    .current {
      padding: 10px;
      border: 1px solid currentColor;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 15px;
      line-height: 1.4;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 10px 0 0;
      display: grid;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    li {
      padding: 10px;
      border: 1px solid currentColor;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }

    li[data-active="1"] {
      background-color: color-mix(in srgb, currentColor 14%, transparent);
    }

    li[data-saved="1"] {
      outline: 2px solid currentColor;
      outline-offset: -2px;
    }

    .kind {
      font-size: 12px;
      opacity: 0.7;
      text-transform: uppercase;
    }

    .spacer { height: 10px; }
  </style>
</head>
<body>
  <div class="dialog">
    <h1>Dictionary</h1>
    <div class="muted">SV → ліве вухо, UK → праве. marks_dict1.json (287 cards)</div>

    <div class="spacer"></div>

    <div class="row">
      <span class="muted">N:</span>
      <input id="inPos" type="number" min="1" step="1" value="1" />
      <button id="btnGoN" type="button">Go to N</button>
      <button id="btnPlayFromN" type="button">Play from N</button>
    </div>

    <div class="row" style="margin-top: 10px;">
      <span class="muted">Mode:</span>
      <button id="btnModeOverlap" type="button" data-selected="1">overlap</button>
      <button id="btnModeSequential" type="button">sequential</button>
    </div>

    <div id="savedCard" class="muted">Saved: none</div>
    <div id="currentCard" class="current muted">Натисніть Play або картку в списку.</div>

    <ul id="cardList"></ul>
  </div>

  <script src="../yu2_global_var.js"></script>
  <script>
    'use strict';

    const AUDIO_BASE = 'audio/';
    const MARKS_URL = `${AUDIO_BASE}marks_dict1.json`;
    const LS_KEY = 'dual_tts1_cardIndex';
    const DB_PATH = '../db_youtube2/ui_state/dual_tts1';

    const DEFAULTS = {
      SV_START_DELAY_SEC: 0,
      UK_START_DELAY_SEC: 0.3,
      SV_VOLUME: 1.0,
      UK_VOLUME: 0.6,
      SV_PLAYBACK_RATE: 1,
      UK_PLAYBACK_RATE: 1,
      AFTER_SV_END_BEFORE_UK_DELAY_SEC: 0.3,
      AFTER_UK_END_BEFORE_NEXT_DELAY_SEC: 0.5,
      CLIP_TAIL_PAD_SEC: 0.2,
    };

    const state = {
      audioCtx: null,
      svBuffer: null,
      ukBuffer: null,
      marks: null,
      playMode: 'overlap',
      playing: false,
      stopRequested: false,
      activeSources: [],
      nextTimer: null,
      currentIndex: -1,
      lastPlayedIndex: -1,
      savedIndex: -1,
    };

    const elCurrent = document.getElementById('currentCard');
    const elSaved = document.getElementById('savedCard');
    const elCardList = document.getElementById('cardList');
    const inPos = document.getElementById('inPos');
    const btnGoN = document.getElementById('btnGoN');
    const btnPlayFromN = document.getElementById('btnPlayFromN');
    const btnModeOverlap = document.getElementById('btnModeOverlap');
    const btnModeSequential = document.getElementById('btnModeSequential');

    function readConfig() {
      return { ...DEFAULTS };
    }

    function ensureGv() {
      if (window.gv && window.gv.URL_DS) return window.gv;
      if (typeof GlobalVars !== 'function') return null;
      window.gv = new GlobalVars();
      return window.gv;
    }

    function clampIndex(index) {
      const n = state.marks?.items?.length || 0;
      const num = Number(index);
      if (!n || !Number.isFinite(num) || num < 0) return -1;
      return Math.min(Math.trunc(num), n - 1);
    }

    function readLocalSavedIndex() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw == null || raw === '') return -1;
        return clampIndex(raw);
      } catch {
        return -1;
      }
    }

    function applySavedIndex(index) {
      const cardIndex = clampIndex(index);
      markSavedCard(cardIndex);
      if (cardIndex >= 0) {
        setPosInput(cardIndex);
        scrollCardIntoView(cardIndex);
      }
      return cardIndex;
    }

    function setPosInput(index) {
      if (!inPos || index < 0) return;
      inPos.value = String(index + 1);
    }

    function readPosIndex() {
      const n = state.marks?.items?.length || 0;
      if (inPos) inPos.max = String(Math.max(1, n));
      const oneBased = Number.parseInt(inPos.value, 10);
      if (!Number.isFinite(oneBased)) return -1;
      return clampIndex(oneBased - 1);
    }

    function goToN() {
      const index = readPosIndex();
      if (index < 0) {
        elCurrent.textContent = 'Enter a card number N.';
        return -1;
      }
      setPosInput(index);
      scrollCardIntoView(index);
      const item = state.marks.items[index];
      elCurrent.textContent = `At #${index + 1} ${item.sv} — ${item.uk}`;
      return index;
    }

    function updateSavedLabel() {
      const index = state.savedIndex;
      if (index < 0 || !state.marks?.items?.[index]) {
        elSaved.textContent = 'Saved: none';
        return;
      }
      const item = state.marks.items[index];
      elSaved.textContent = `Saved: #${index + 1} ${item.sv} — ${item.uk}`;
    }

    function setPlayFromNLabel(playing) {
      btnPlayFromN.textContent = playing ? 'Pause' : 'Play from N';
    }

    function markSavedCard(index) {
      state.savedIndex = clampIndex(index);
      for (const li of elCardList.querySelectorAll('li')) {
        li.dataset.saved = li.dataset.index === String(state.savedIndex) ? '1' : '0';
      }
      updateSavedLabel();
    }

    function scrollCardIntoView(index) {
      const li = elCardList.querySelector(`li[data-index="${index}"]`);
      if (li) {
        li.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    async function ensureSignedIn() {
      const gv = ensureGv();
      if (!gv) throw new Error('GlobalVars is not available');
      if (gv.URL_DS.idToken) return gv;
      await gv.SignIn_User();
      return gv;
    }

    function requestByPath(addurl, method, body) {
      return new Promise((resolve, reject) => {
        const gv = ensureGv();
        if (!gv) {
          reject(new Error('GlobalVars is not available'));
          return;
        }
        const req = gv.URL_DS.GetObjForRequest();
        req.addUrl = addurl;
        req.ametod = method;
        req.vobj = body;
        req.CallBackFunction = (data) => resolve(data);
        req.ErrorCallback = (err) => reject(err || new Error('DB request failed'));
        gv.URL_DS.requestData_By_URL_Path(req);
      });
    }

    async function savePositionToDb(index) {
      const cardIndex = clampIndex(index);
      if (cardIndex < 0) return;
      try {
        localStorage.setItem(LS_KEY, String(cardIndex));
      } catch {
        // ignore
      }
      try {
        await ensureSignedIn();
        await requestByPath(DB_PATH, 'PUT', {
          marksFile: 'marks_dict1.json',
          cardIndex,
          playMode: state.playMode,
          updatedAt: new Date().toISOString(),
        });
      } catch (err) {
        console.error('Save position failed', err);
      }
    }

    async function loadSavedPositionFromDb() {
      try {
        await ensureSignedIn();
        const data = await requestByPath(DB_PATH, 'GET', null);
        if (data && (data.playMode === 'overlap' || data.playMode === 'sequential')) {
          setPlayMode(data.playMode);
        }
        if (data && data.cardIndex != null) {
          return clampIndex(data.cardIndex);
        }
      } catch (err) {
        console.error('Load position failed', err);
      }
      return -1;
    }

    let persistChain = Promise.resolve();
    let persistQueued = null;

    function persistPosition(index) {
      const cardIndex = clampIndex(index);
      if (cardIndex < 0) return;
      markSavedCard(cardIndex);
      try {
        localStorage.setItem(LS_KEY, String(cardIndex));
      } catch {
        // ignore
      }
      persistQueued = cardIndex;
      persistChain = persistChain
        .then(async () => {
          const toSave = persistQueued;
          persistQueued = null;
          if (toSave == null) return;
          await savePositionToDb(toSave);
        })
        .catch((err) => console.error('Auto-save failed', err));
    }

    async function ensureAudioContext() {
      if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (state.audioCtx.state === 'suspended') {
        await state.audioCtx.resume();
      }
      return state.audioCtx;
    }

    async function loadBuffer(url) {
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`Failed to fetch ${url}: ${res.status}`);
      }
      const arr = await res.arrayBuffer();
      return state.audioCtx.decodeAudioData(arr);
    }

    async function loadMarks() {
      if (state.marks) return state.marks;
      const res = await fetch(MARKS_URL);
      if (!res.ok) {
        throw new Error(`Failed to fetch marks: ${res.status}`);
      }
      state.marks = await res.json();
      return state.marks;
    }

    async function ensureAssetsLoaded() {
      await loadMarks();
      await ensureAudioContext();
      if (!state.svBuffer) {
        state.svBuffer = await loadBuffer(`${AUDIO_BASE}${state.marks.sv_file}`);
      }
      if (!state.ukBuffer) {
        state.ukBuffer = await loadBuffer(`${AUDIO_BASE}${state.marks.uk_file}`);
      }
    }

    function startClip(buffer, when, offset, duration, volume, pan, rate) {
      const src = state.audioCtx.createBufferSource();
      src.buffer = buffer;
      src.playbackRate.value = rate;

      const gain = state.audioCtx.createGain();
      gain.gain.value = volume;

      const panner = state.audioCtx.createStereoPanner();
      panner.pan.value = pan;

      src.connect(gain);
      gain.connect(panner);
      panner.connect(state.audioCtx.destination);

      src.start(when, offset, duration);
      state.activeSources.push(src);
      src.onended = () => {
        state.activeSources = state.activeSources.filter((s) => s !== src);
      };
      return src;
    }

    function pausePlayback() {
      if (state.lastPlayedIndex >= 0) {
        persistPosition(state.lastPlayedIndex);
        setPosInput(state.lastPlayedIndex);
      }
      state.stopRequested = true;
      state.playing = false;
      if (state.nextTimer) {
        clearTimeout(state.nextTimer);
        state.nextTimer = null;
      }
      for (const src of state.activeSources) {
        try {
          src.stop();
        } catch {
          // already stopped
        }
      }
      state.activeSources = [];
      setPlayFromNLabel(false);
      if (state.lastPlayedIndex >= 0) {
        const item = state.marks.items[state.lastPlayedIndex];
        elCurrent.textContent = `Paused at #${state.lastPlayedIndex + 1} ${item.sv} — ${item.uk}`;
        setActiveCard(state.lastPlayedIndex);
      } else {
        elCurrent.textContent = 'Paused.';
      }
    }

    function setActiveCard(index) {
      state.currentIndex = index;
      if (index >= 0) {
        state.lastPlayedIndex = index;
      }
      for (const li of elCardList.querySelectorAll('li')) {
        li.dataset.active = li.dataset.index === String(index) ? '1' : '0';
      }
      if (index >= 0) {
        scrollCardIntoView(index);
      }
    }

    function renderCardLabel(item, index) {
      const en = item.en ? ` (${item.en})` : '';
      return `#${index + 1} [${item.kind}] ${item.sv} — ${item.uk}${en}`;
    }

    function renderCardList() {
      elCardList.innerHTML = '';
      if (!state.marks?.items?.length) {
        return;
      }
      state.marks.items.forEach((item, index) => {
        const li = document.createElement('li');
        li.dataset.index = String(index);
        li.innerHTML = `<div class="kind">${item.kind}</div><div>${item.sv} — ${item.uk}</div>`;
        li.addEventListener('click', () => {
          setPosInput(index);
          goToN();
        });
        elCardList.appendChild(li);
      });
    }

    function waitMs(ms) {
      return new Promise((resolve) => {
        state.nextTimer = setTimeout(() => {
          state.nextTimer = null;
          resolve();
        }, ms);
      });
    }

    function waitForSourceEnd(src) {
      return new Promise((resolve) => {
        src.onended = () => {
          state.activeSources = state.activeSources.filter((s) => s !== src);
          resolve();
        };
      });
    }

    function clipSourceDuration(start, end, pad, bufferDuration) {
      const paddedEnd = Math.min(end + pad, bufferDuration);
      return Math.max(0, paddedEnd - start);
    }

    async function playCard(index, cfg) {
      const item = state.marks.items[index];
      const pad = cfg.CLIP_TAIL_PAD_SEC;
      const svDur = clipSourceDuration(
        item.sv_start,
        item.sv_end,
        pad,
        state.svBuffer.duration,
      );
      const ukDur = clipSourceDuration(
        item.uk_start,
        item.uk_end,
        pad,
        state.ukBuffer.duration,
      );
      const svPlayDur = svDur / Math.max(cfg.SV_PLAYBACK_RATE, 0.01);
      const ukPlayDur = ukDur / Math.max(cfg.UK_PLAYBACK_RATE, 0.01);

      setActiveCard(index);
      setPosInput(index);
      persistPosition(index);
      elCurrent.textContent = renderCardLabel(item, index);

      const t0 = state.audioCtx.currentTime;

      if (state.playMode === 'overlap') {
        const svWhen = t0 + cfg.SV_START_DELAY_SEC;
        const ukWhen = t0 + cfg.UK_START_DELAY_SEC;

        startClip(
          state.svBuffer,
          svWhen,
          item.sv_start,
          svDur,
          cfg.SV_VOLUME,
          -1,
          cfg.SV_PLAYBACK_RATE,
        );

        startClip(
          state.ukBuffer,
          ukWhen,
          item.uk_start,
          ukDur,
          cfg.UK_VOLUME,
          1,
          cfg.UK_PLAYBACK_RATE,
        );

        const svEndAt = svWhen + svPlayDur;
        const ukEndAt = ukWhen + ukPlayDur;
        const cardEndAt = Math.max(svEndAt, ukEndAt);
        const waitSec = Math.max(0, cardEndAt - state.audioCtx.currentTime);
        await waitMs(waitSec * 1000);
      } else {
        const svWhen = state.audioCtx.currentTime + cfg.SV_START_DELAY_SEC;
        const svSrc = startClip(
          state.svBuffer,
          svWhen,
          item.sv_start,
          svDur,
          cfg.SV_VOLUME,
          -1,
          cfg.SV_PLAYBACK_RATE,
        );
        await waitForSourceEnd(svSrc);

        if (state.stopRequested) {
          return;
        }

        await waitMs(cfg.AFTER_SV_END_BEFORE_UK_DELAY_SEC * 1000);
        if (state.stopRequested) {
          return;
        }

        const ukWhen = state.audioCtx.currentTime + cfg.UK_START_DELAY_SEC;
        const ukSrc = startClip(
          state.ukBuffer,
          ukWhen,
          item.uk_start,
          ukDur,
          cfg.UK_VOLUME,
          1,
          cfg.UK_PLAYBACK_RATE,
        );
        await waitForSourceEnd(ukSrc);
      }

      if (state.stopRequested) {
        return;
      }

      await waitMs(cfg.AFTER_UK_END_BEFORE_NEXT_DELAY_SEC * 1000);
    }

    async function playFromIndex(startIndex) {
      if (state.playing) {
        pausePlayback();
        return;
      }

      state.stopRequested = false;
      state.playing = true;
      setPlayFromNLabel(true);

      try {
        await ensureAssetsLoaded();
        if (!state.marks?.items?.length) {
          throw new Error('No items in marks JSON');
        }

        const cfg = readConfig();
        const endIndex = state.marks.items.length - 1;

        for (let i = startIndex; i <= endIndex; i += 1) {
          if (state.stopRequested) {
            break;
          }
          await playCard(i, cfg);
        }

        if (!state.stopRequested) {
          setActiveCard(-1);
          elCurrent.textContent = 'Finished.';
        }
      } catch (err) {
        console.error(err);
        elCurrent.textContent = `Error: ${err.message}`;
      } finally {
        state.playing = false;
        setPlayFromNLabel(false);
      }
    }

    function setPlayMode(mode) {
      state.playMode = mode;
      btnModeOverlap.dataset.selected = mode === 'overlap' ? '1' : '0';
      btnModeSequential.dataset.selected = mode === 'sequential' ? '1' : '0';
    }

    btnGoN.addEventListener('click', goToN);
    btnPlayFromN.addEventListener('click', () => {
      if (state.playing) {
        pausePlayback();
        return;
      }
      const index = goToN();
      if (index < 0) return;
      playFromIndex(index);
    });
    inPos.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (state.playing) return;
        const index = goToN();
        if (index >= 0) playFromIndex(index);
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && state.lastPlayedIndex >= 0) {
        persistPosition(state.lastPlayedIndex);
      }
    });
    window.addEventListener('pagehide', () => {
      if (state.lastPlayedIndex >= 0) {
        persistPosition(state.lastPlayedIndex);
      }
    });
    btnModeOverlap.addEventListener('click', () => setPlayMode('overlap'));
    btnModeSequential.addEventListener('click', () => setPlayMode('sequential'));

    loadMarks()
      .then(() => {
        renderCardList();
        inPos.max = String(state.marks.items.length);
        inPos.min = '1';
        const local = applySavedIndex(readLocalSavedIndex());
        elCurrent.textContent = local >= 0
          ? `At saved #${local + 1}.`
          : 'Ready.';
        loadSavedPositionFromDb().then((dbIndex) => {
          if (dbIndex < 0) return;
          applySavedIndex(dbIndex);
          elCurrent.textContent = `At saved #${dbIndex + 1}.`;
        });
      })
      .catch((err) => {
        console.error(err);
        elCurrent.textContent = `Load error: ${err.message}. Use http://localhost:8080/...`;
      });
  </script>
</body>
</html>
