<script src="../yout_pl2/yu2_global_var.js"></script>
<script src="beta/glue_batches.js"></script>
  <script>
    'use strict';

    const VT_VERSION = '2026.11.14-2';
    const IS_LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
    const IS_BETA = location.pathname.includes('/voicetrain/beta/');
    const CHANNEL_SUFFIX = IS_BETA ? '_beta' : '';
    const PAUSE_EXTRA_MAX = 5;
    let audioBase = 'audio/';
    const LS_KEY = `voicetrain_stepIndex${CHANNEL_SUFFIX}`;
    const LS_MARKS_KEY = `voicetrain_userMarks${CHANNEL_SUFFIX}`;
    const LS_LESSON_KEY = `voicetrain_lessonId${CHANNEL_SUFFIX}`;
    const LS_PAUSE_KEY = `voicetrain_pauseExtra${CHANNEL_SUFFIX}`;
    const LS_SHUFFLE_KEY = `voicetrain_shuffle${CHANNEL_SUFFIX}`;
    const LS_TR_FIRST_KEY = `voicetrain_translationFirst${CHANNEL_SUFFIX}`;
    const LS_SKIP_KNOWN_KEY = `voicetrain_skipKnown${CHANNEL_SUFFIX}`;
    const LESSONS_DB = '../db_youtube2/ref_voice_lessons';
    const TAGS_DB = '../db_youtube2/ref_voice_tags';
    const TAG_PAGE = 3;
    const LS_EN_KEY = 'voicetrain_showEn';
    const LS_UK_KEY = 'voicetrain_showUk';
    const LS_TRANS_LANG_KEY = 'voicetrain_translationLang';
    const LS_TRANS_FOCUS_KEY = 'voicetrain_translationFocus';
    const DB_PATH = `../db_youtube2/ui_state/voicetrain${CHANNEL_SUFFIX}`;
    // Marks are the user's own data, so they stay when the beta becomes the working player.
    const KNOWN_DB = '../db_youtube2/ui_state/known_words';
    const LS_KNOWN_KEY = 'voicetrain_knownWords';
    const LS_MARK_TR_KEY = 'voicetrain_markShowTranslation';
    // Glue batches: unlearned words cut from many lessons, played by byte range (beta/glue_batches.js).
    const { wordKey, shuffledApart } = window.GlueBatches;
    const GLUE_TAG = '__glue__';
    const GLUE_DB = '../db_youtube2/ui_state/glue_batches';
    const LS_GLUE_KEY = 'voicetrain_glueBatches';
    const CLIP_PREFETCH = 8;

    const DEFAULTS = {
      PLAYBACK_RATE: 1,
      CLIP_TAIL_PAD_SEC: 0.2,
      VOLUME: 1,
    };

    const state = {
      audioCtx: null,
      svBuffer: null,
      ukBuffer: null,
      enBuffer: null,
      marks: null,
      translationLang: 'uk',
      translationFocus: 'f1',
      pauseExtra: 0,
      shuffle: false,
      translationFirst: false,
      skipKnown: false,
      queueKnown: '',
      playing: false,
      stopRequested: false,
      activeSources: [],
      nextTimer: null,
      currentIndex: -1,
      lastPlayedIndex: -1,
      jumpTo: -1,
      playingIndex: 0,
      savedIndex: -1,
      userMarks: {},
      showEn: false,
      showUk: false,
      lessonId: '',
      clipCache: new Map(),
    };

    const elCurrent = document.getElementById('currentCard');
    const elCardList = document.getElementById('cardList');
    const inPos = document.getElementById('inPos');
    const posWrap = document.getElementById('posWrap');
    const posMenu = document.getElementById('posMenu');
    const posGoStart = document.getElementById('posGoStart');
    const btnEn = document.getElementById('btnEn');
    const btnUk = document.getElementById('btnUk');
    const langWrap = document.getElementById('langWrap');
    const focusWrap = document.getElementById('focusWrap');
    const btnTransLang = document.getElementById('btnTransLang');
    const btnTransFocus = document.getElementById('btnTransFocus');
    const langMenu = document.getElementById('langMenu');
    const focusMenu = document.getElementById('focusMenu');
    const LANG_LABEL = { uk: 'укр.', en: 'англ.', off: '—' };
    const FOCUS_LABEL = { f1: 'f1', f2: 'f2', f3: 'f3' };
    const btnPause = document.getElementById('btnPause');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnSeq = document.getElementById('btnSeq');
    const btnSkipKnown = document.getElementById('btnSkipKnown');
    const btnGoN = document.getElementById('btnGoN');
    const btnPlayFromN = document.getElementById('btnPlayFromN');
    const btnRestart = document.getElementById('btnRestart');
    const elMediaLog = document.getElementById('elMediaLog');
    const sessionKeeper = document.getElementById('sessionKeeper');

    let mediaSessionReady = false;

    const MEDIA_ACTION_NOTES = {
      play: 'F8 / ○',
      pause: 'F8 / ○ → skip',
      nexttrack: 'F9 / + → focus',
      previoustrack: 'F7 / −',
    };

    function logMedia(action, note) {
      if (!elMediaLog) return;
      const t = new Date().toLocaleTimeString('uk-UA', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
      elMediaLog.textContent = note ? `${action} — ${note} · ${t}` : `${action} · ${t}`;
    }

    function syncMediaPlaybackState() {
      if (!('mediaSession' in navigator)) return;
      const keeperOn = sessionKeeper && !sessionKeeper.paused;
      navigator.mediaSession.playbackState = keeperOn ? 'playing' : 'paused';
    }

    function bindMediaHandlers() {
      if (!('mediaSession' in navigator)) {
        if (!mediaSessionReady) {
          logMedia('no-session', 'Media Session недоступний');
        }
        mediaSessionReady = true;
        return false;
      }
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'EarPods receiver',
        artist: 'VoiceTraining',
      });
      for (const action of ['play', 'pause', 'nexttrack', 'previoustrack']) {
        try {
          navigator.mediaSession.setActionHandler(action, () => onMediaAction(action));
        } catch (err) {
          console.warn(`Media Session ${action} unsupported`, err);
        }
      }
      mediaSessionReady = true;
      syncMediaPlaybackState();
      return true;
    }

    async function startSilentKeeper() {
      if (!sessionKeeper) return;
      sessionKeeper.muted = false;
      sessionKeeper.volume = 0.01;
      sessionKeeper.loop = true;
      try {
        await sessionKeeper.play();
      } catch (err) {
        logMedia('keeper-error', err.message);
        return;
      }
      bindMediaHandlers();
      syncMediaPlaybackState();
    }

    let resumingKeeper = false;

    function keepSilentKeeperPlaying() {
      if (!sessionKeeper || resumingKeeper) return;
      if (sessionKeeper.paused) {
        resumingKeeper = true;
        sessionKeeper.play().finally(() => {
          resumingKeeper = false;
          bindMediaHandlers();
          syncMediaPlaybackState();
        });
        return;
      }
      bindMediaHandlers();
      syncMediaPlaybackState();
    }

    function onMediaAction(action) {
      logMedia(action, MEDIA_ACTION_NOTES[action] || '');
      keepSilentKeeperPlaying();
      if (action === 'pause') {
        markCurrentUserMark('skip');
      } else if (action === 'nexttrack') {
        markCurrentUserMark('focus');
      }
    }

    function stepIdForIndex(index) {
      const item = playList()[index];
      if (!item) return null;
      if (isAutoMode()) return `${item.step}:${item.lang}`;
      return String(item.step);
    }

    function userMarkForIndex(index) {
      const id = stepIdForIndex(index);
      if (!id) return '';
      return state.userMarks[id] || '';
    }

    function markCurrentUserMark(label) {
      let index = state.lastPlayedIndex;
      if (index < 0) index = readPosIndex();
      if (index < 0) return;
      const stepId = stepIdForIndex(index);
      if (!stepId) return;
      state.userMarks[stepId] = label;
      setKindMark(index, label);
      persistState(index);
    }

    function ensureGv() {
      if (window.gv && window.gv.URL_DS) return window.gv;
      if (typeof GlobalVars !== 'function') return null;
      window.gv = new GlobalVars();
      return window.gv;
    }

    function playList() {
      if (isAutoMode()) return state.queue || [];
      return state.marks?.items || [];
    }

    function rebuildQueue() {
      if (!state.marks || !isAutoMode()) {
        state.queue = null;
        return;
      }
      const items = orderedItems(state.marks.items || []).filter((item) => !isKnownItem(item));
      state.queueKnown = knownSignature();
      const queue = [];
      const playLang = state.translationLang;
      for (const item of items) {
        const plays = autoItemShowsTranslation(item);
        const hints = [];
        if (state.showUk && item.uk && !(plays && playLang === 'uk')) {
          hints.push({ text: item.uk });
        }
        if (state.showEn && item.en && !(plays && playLang === 'en')) {
          hints.push({ text: item.en });
        }
        const pair = [];
        if (item.sv_start != null && item.sv_end != null) {
          pair.push({
            lang: 'sv',
            role: 'sv',
            text: item.sv || '',
            start: item.sv_start,
            end: item.sv_end,
            clip: item.sv_clip,
            pause_sec: item.pause_sec,
            step: item.step,
            word: item.word,
            hints,
          });
        }
        const start = playLang === 'en' ? item.en_start : item.uk_start;
        const end = playLang === 'en' ? item.en_end : item.uk_end;
        const text = playLang === 'en' ? item.en : item.uk;
        if (plays && start != null && end != null && text) {
          pair.push({
            lang: playLang,
            role: 'tr',
            text,
            start,
            end,
            clip: item[`${playLang}_clip`],
            pause_sec: item.pause_sec,
            step: item.step,
            word: item.word,
            hints: [],
          });
        }
        if (state.translationFirst) pair.reverse();
        queue.push(...pair);
      }
      state.queue = queue;
    }

    function isKnownItem(item) {
      return state.skipKnown && !!item.word && !!knownWords[wordKey(item.word)];
    }

    function knownSignature() {
      return state.skipKnown ? Object.keys(knownWords).sort().join('|') : '';
    }

    function orderedItems(items) {
      const sorted = items.slice().sort((a, b) => {
        const stage = (a.stage_index || 0) - (b.stage_index || 0);
        if (stage) return stage;
        const word = (a.word_n || 0) - (b.word_n || 0);
        if (word) return word;
        return (a.step || 0) - (b.step || 0);
      });
      if (!state.shuffle) return sorted;
      const stages = new Map();
      for (const item of sorted) {
        const stage = item.stage_index || 0;
        if (!stages.has(stage)) stages.set(stage, new Map());
        const words = stages.get(stage);
        if (!words.has(item.word_n)) words.set(item.word_n, []);
        words.get(item.word_n).push(item);
      }
      const result = [];
      for (const [stage, words] of stages) {
        const seed = `${state.lessonId || state.marks?.lesson_id || ''}:${stage}`;
        for (const group of shuffledApart([...words.values()], seed)) result.push(...group);
      }
      return result;
    }

    function indexForStepId(stepId) {
      if (!stepId) return -1;
      return playList().findIndex((_, index) => stepIdForIndex(index) === stepId);
    }

    function clampIndex(index) {
      const n = playList().length;
      const num = Number(index);
      if (!n || !Number.isFinite(num) || num < 0) return -1;
      return Math.min(Math.trunc(num), n - 1);
    }

    function stepKey() {
      return state.lessonId ? `${LS_KEY}_${state.lessonId}` : LS_KEY;
    }

    function marksKey() {
      return state.lessonId ? `${LS_MARKS_KEY}_${state.lessonId}` : LS_MARKS_KEY;
    }

    function readLocalSavedIndex() {
      try {
        const raw = localStorage.getItem(stepKey());
        if (raw == null || raw === '') return -1;
        return clampIndex(raw);
      } catch {
        return -1;
      }
    }

    function readLocalUserMarks() {
      try {
        const raw = localStorage.getItem(marksKey());
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch {
        return {};
      }
    }

    function applySavedIndex(index) {
      const stepIndex = clampIndex(index);
      markSavedCard(stepIndex);
      if (stepIndex >= 0) {
        setPosInput(stepIndex);
        scrollCardIntoView(stepIndex);
      }
      return stepIndex;
    }

    let playLabelPlaying = false;
    function renderPlayLabel() {
      const total = playList().length;
      if (playLabelPlaying) {
        // While playing, the number is the step being played, not the value typed in the position field.
        const now = state.playingIndex + 1;
        btnPlayFromN.textContent = `Pause ${now}/${total}`;
        return;
      }
      btnPlayFromN.textContent = `▶ ${inPos.value || '1'}/${total}`;
    }

    function setPosInput(index) {
      if (!inPos || index < 0) return;
      inPos.value = String(index + 1);
      renderPlayLabel();
    }

    function readPosIndex() {
      const n = playList().length;
      if (inPos) inPos.max = String(Math.max(1, n));
      const oneBased = Number.parseInt(inPos.value, 10);
      if (!Number.isFinite(oneBased)) return -1;
      return clampIndex(oneBased - 1);
    }

    function esc(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function isAutoMode() {
      return state.marks?.mode === 'auto';
    }

    function applyPlaybackUi() {
      const auto = isAutoMode();
      if (langWrap) langWrap.hidden = !auto;
      if (focusWrap) focusWrap.hidden = !auto;
      if (btnShuffle) btnShuffle.hidden = !auto;
      if (btnSeq) btnSeq.hidden = !auto;
      if (btnSkipKnown) btnSkipKnown.hidden = !auto;
    }

    function readStoredLang() {
      try {
        const v = localStorage.getItem(LS_TRANS_LANG_KEY);
        return v === 'en' || v === 'off' ? v : 'uk';
      } catch {
        return 'uk';
      }
    }

    function readStoredFocus() {
      try {
        const v = localStorage.getItem(LS_TRANS_FOCUS_KEY);
        return v === 'f2' || v === 'f3' ? v : 'f1';
      } catch {
        return 'f1';
      }
    }

    function syncAutoPlaybackControls() {
      if (btnTransLang) {
        btnTransLang.textContent = LANG_LABEL[state.translationLang] || LANG_LABEL.uk;
      }
      if (btnTransFocus) {
        btnTransFocus.textContent = FOCUS_LABEL[state.translationFocus] || FOCUS_LABEL.f1;
      }
      langMenu?.querySelectorAll('[data-lang]').forEach((btn) => {
        btn.setAttribute('aria-checked', btn.dataset.lang === state.translationLang ? 'true' : 'false');
      });
      focusMenu?.querySelectorAll('[data-focus]').forEach((btn) => {
        btn.setAttribute('aria-checked', btn.dataset.focus === state.translationFocus ? 'true' : 'false');
      });
      paintOrder();
    }

    function paintOrder() {
      if (btnSkipKnown) {
        btnSkipKnown.dataset.selected = state.skipKnown ? '1' : '0';
        btnSkipKnown.setAttribute('aria-pressed', state.skipKnown ? 'true' : 'false');
      }
      if (btnShuffle) {
        btnShuffle.dataset.selected = state.shuffle ? '1' : '0';
        btnShuffle.setAttribute('aria-pressed', state.shuffle ? 'true' : 'false');
      }
      if (btnSeq) {
        const lang = state.translationLang === 'off' ? '' : state.translationLang.toUpperCase();
        btnSeq.disabled = !lang;
        btnSeq.dataset.selected = lang && state.translationFirst ? '1' : '0';
        if (!lang) btnSeq.textContent = 'SV';
        else btnSeq.textContent = state.translationFirst ? `${lang}→SV` : `SV→${lang}`;
      }
    }

    function initAutoPlaybackFromMarks() {
      if (!isAutoMode()) return;
      let hasLang = false;
      let hasFocus = false;
      try {
        hasLang = localStorage.getItem(LS_TRANS_LANG_KEY) != null;
        hasFocus = localStorage.getItem(LS_TRANS_FOCUS_KEY) != null;
      } catch {
        // ignore
      }
      if (hasLang) {
        state.translationLang = readStoredLang();
      } else {
        const lang = state.marks.translation_lang;
        state.translationLang = lang === 'en' || lang === 'off' ? lang : 'uk';
      }
      if (hasFocus) {
        state.translationFocus = readStoredFocus();
      } else {
        const focus = state.marks.translation_focus;
        state.translationFocus = focus === 'f2' || focus === 'f3' ? focus : 'f1';
      }
      syncAutoPlaybackControls();
    }

    function autoItemShowsTranslation(item) {
      const lang = state.translationLang;
      const focus = state.translationFocus;
      if (lang === 'off') return false;
      return !!(item.flags && item.flags[lang] && item.flags[lang][focus]);
    }

    function buildAutoPlaySegments(item) {
      const segments = [];
      if (item.sv_start != null && item.sv_end != null) {
        segments.push({ lang: 'sv', start: item.sv_start, end: item.sv_end });
      }
      if (!autoItemShowsTranslation(item)) return segments;
      const lang = state.translationLang;
      if (lang === 'uk' && item.uk_start != null && item.uk_end != null) {
        segments.push({ lang: 'uk', start: item.uk_start, end: item.uk_end });
      }
      if (lang === 'en' && item.en_start != null && item.en_end != null) {
        segments.push({ lang: 'en', start: item.en_start, end: item.en_end });
      }
      return segments;
    }

    function translationBits(item) {
      if (isAutoMode()) {
        if (!autoItemShowsTranslation(item)) return [];
        const lang = state.translationLang;
        if (lang === 'en' && item.en) return [item.en];
        if (lang === 'uk' && item.uk) return [item.uk];
        return [];
      }
      const bits = [];
      if (state.showEn && item.en && item.en !== item.text) bits.push(item.en);
      if (state.showUk && item.uk && item.uk !== item.text) bits.push(item.uk);
      return bits;
    }

    function autoCardHtml(item) {
      const parts = [`<p class="line say" data-seg="sv">${esc(item.sv || '')}</p>`];
      const playLang = state.translationLang;
      const plays = autoItemShowsTranslation(item);
      function add(lang, text) {
        if (!text) return;
        if (plays && playLang === lang) {
          parts.push(`<p class="line voiced" data-seg="${lang}">${esc(text)}</p>`);
          return;
        }
        const show = (lang === 'en' && state.showEn) || (lang === 'uk' && state.showUk);
        if (show) parts.push(`<p class="line hint" data-seg="${lang}">${esc(text)}</p>`);
      }
      add('uk', item.uk);
      add('en', item.en);
      return parts.join('');
    }

    function translationHtml(item) {
      const parts = [];
      if (state.showEn && item.en && item.en !== item.text) {
        parts.push(`<div class="tr tr-en">${esc(item.en)}</div>`);
      }
      if (state.showUk && item.uk && item.uk !== item.text) {
        parts.push(`<div class="tr tr-uk">${esc(item.uk)}</div>`);
      }
      return parts.join('');
    }

    function formatDuration(sec) {
      const total = Math.max(0, Math.round(sec));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes} хв ${seconds} с`;
    }

    function lessonDurationSec(marks) {
      const items = marks.items || [];
      const rate = Math.max(DEFAULTS.PLAYBACK_RATE, 0.01);
      const pad = DEFAULTS.CLIP_TAIL_PAD_SEC;
      if (marks.mode === 'auto') {
        let sum = 0;
        (state.queue || []).forEach((item) => {
          const speech = Math.max(0, Number(item.end) - Number(item.start));
          const pause = Number(item.pause_sec);
          const after = Number.isFinite(pause) && pause >= 0
            ? pause
            : (marks.pause_sec ?? 0.6);
          sum += speech / rate + after + state.pauseExtra;
        });
        return sum;
      }
      const lastOnTrack = {};
      items.forEach((item, index) => {
        lastOnTrack[item.lang] = index;
      });
      let sum = 0;
      items.forEach((item, index) => {
        const speech = Math.max(0, Number(item.end) - Number(item.start));
        const pause = Number(item.pause_sec);
        const after = Number.isFinite(pause) && pause >= 0
          ? pause
          : (marks.pause_sec ?? 0.6);
        const tail = index === lastOnTrack[item.lang] ? 0 : pad;
        sum += (speech + tail) / rate + after + state.pauseExtra;
      });
      return sum;
    }

    function showTotal() {
      const el = document.getElementById('elTotal');
      if (!el || !state.marks?.items?.length) return;
      el.textContent = `Без перерви ${formatDuration(lessonDurationSec(state.marks))}`;
    }

    function renderStepLabel(item, index) {
      if (isAutoMode()) return `#${index + 1} ${item.text || ''}`;
      const extra = translationBits(item);
      const tail = extra.length ? ` — ${extra.join(' · ')}` : '';
      return `#${index + 1} ${item.text}${tail}`;
    }

    function goToN() {
      if (btnRestart) btnRestart.hidden = true;
      const index = readPosIndex();
      if (index < 0) {
        elCurrent.textContent = 'Enter step number N.';
        return -1;
      }
      setPosInput(index);
      scrollCardIntoView(index);
      const item = playList()[index];
      elCurrent.textContent = renderStepLabel(item, index);
      return index;
    }

    function setPlayFromNLabel(playing) {
      playLabelPlaying = playing;
      renderPlayLabel();
    }

    function markSavedCard(index) {
      state.savedIndex = clampIndex(index);
      for (const li of elCardList.querySelectorAll('li')) {
        li.dataset.saved = li.dataset.index === String(state.savedIndex) ? '1' : '0';
      }
    }

    function scrollCardIntoView(index) {
      const li = elCardList.querySelector(`li[data-index="${index}"]`);
      if (li) {
        li.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    async function ensureSignedIn() {
      const gv = ensureGv();
      if (!gv) throw new Error('GlobalVars is not available');
      if (gv.URL_DS.idToken) return gv;
      await gv.SignIn_User();
      return gv;
    }

    function requestByPath(addurl, method, body) {
      return new Promise((resolve, reject) => {
        const gv = ensureGv();
        if (!gv) {
          reject(new Error('GlobalVars is not available'));
          return;
        }
        const req = gv.URL_DS.GetObjForRequest();
        req.addUrl = addurl;
        req.ametod = method;
        req.vobj = body;
        req.CallBackFunction = (data) => resolve(data);
        req.ErrorCallback = (err) => reject(err || new Error('DB request failed'));
        gv.URL_DS.requestData_By_URL_Path(req);
      });
    }

    async function saveStateToDb(stepIndex, lessonId, marks, stepId) {
      const index = Number(stepIndex);
      if (!Number.isFinite(index) || index < 0) return;
      const id = lessonId || '';
      try {
        await ensureSignedIn();
        await requestByPath(DB_PATH, 'PUT', {
          lessonId: id,
          marksFile: id ? `lessons/${id}/marks.json` : 'marks.json',
          stepIndex: index,
          stepId: stepId || '',
          marks: marks || {},
          updatedAt: new Date().toISOString(),
        });
      } catch (err) {
        console.error('Save state failed', err);
      }
    }

    async function loadSavedStateFromDb() {
      try {
        await ensureSignedIn();
        const data = await requestByPath(DB_PATH, 'GET', null);
        const savedLesson = data && data.lessonId != null ? String(data.lessonId) : '';
        if (state.lessonId && savedLesson !== state.lessonId) return -1;
        if (data && data.marks && typeof data.marks === 'object') {
          state.userMarks = { ...data.marks };
          try {
            localStorage.setItem(marksKey(), JSON.stringify(state.userMarks));
          } catch {
            // ignore
          }
        }
        const byStep = indexForStepId(data && data.stepId);
        if (byStep >= 0) return byStep;
        if (data && data.stepIndex != null) {
          return clampIndex(data.stepIndex);
        }
      } catch (err) {
        console.error('Load state failed', err);
      }
      return -1;
    }

    let persistChain = Promise.resolve();
    let persistQueued = null;

    function persistState(index) {
      const stepIndex = clampIndex(index);
      if (stepIndex < 0) return;
      markSavedCard(stepIndex);
      try {
        localStorage.setItem(stepKey(), String(stepIndex));
        localStorage.setItem(marksKey(), JSON.stringify(state.userMarks));
      } catch {
        // ignore
      }
      persistQueued = {
        stepIndex,
        stepId: stepIdForIndex(stepIndex),
        lessonId: state.lessonId,
        marks: { ...state.userMarks },
      };
      persistChain = persistChain
        .then(async () => {
          const toSave = persistQueued;
          persistQueued = null;
          if (toSave == null) return;
          await saveStateToDb(toSave.stepIndex, toSave.lessonId, toSave.marks, toSave.stepId);
        })
        .catch((err) => console.error('Auto-save failed', err));
    }

    async function loadMarks() {
      if (state.marks) return state.marks;
      const res = await fetch(`${audioBase}marks.json`);
      if (!res.ok) {
        throw new Error(`Failed to fetch marks: ${res.status}`);
      }
      state.marks = await res.json();
      return state.marks;
    }

    function unlockAudio() {
      if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (navigator.audioSession) {
        try {
          navigator.audioSession.type = 'playback';
        } catch {
          // ignore
        }
      }
      const resumePromise = state.audioCtx.state === 'suspended'
        ? state.audioCtx.resume()
        : Promise.resolve();
      const keeperPromise = startSilentKeeper();
      return Promise.all([resumePromise, keeperPromise]);
    }

    async function ensureAudioContext() {
      if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (navigator.audioSession) {
        try {
          navigator.audioSession.type = 'playback';
        } catch {
          // ignore
        }
      }
      if (state.audioCtx.state === 'suspended') {
        await state.audioCtx.resume();
      }
      return state.audioCtx;
    }

    async function loadBuffer(url) {
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`Failed to fetch ${url}: ${res.status}`);
      }
      const arr = await res.arrayBuffer();
      return state.audioCtx.decodeAudioData(arr);
    }

    async function ensureAssetsLoaded() {
      await loadMarks();
      await ensureAudioContext();
      if (isGlueId(state.lessonId)) return;
      if (!state.svBuffer) {
        state.svBuffer = await loadBuffer(`${audioBase}${state.marks.sv_file}`);
      }
      if (!state.ukBuffer) {
        state.ukBuffer = await loadBuffer(`${audioBase}${state.marks.uk_file}`);
      }
      if (isAutoMode() && state.marks.en_file && !state.enBuffer) {
        state.enBuffer = await loadBuffer(`${audioBase}${state.marks.en_file}`);
      }
    }

    function clipBuffer(clip) {
      const key = `${clip.url}#${clip.bytes[0]}-${clip.bytes[1]}`;
      if (!state.clipCache.has(key)) {
        const job = (async () => {
          const res = await fetch(clip.url, { headers: { Range: `bytes=${clip.bytes[0]}-${clip.bytes[1] - 1}` } });
          if (res.status !== 206) throw new Error(`Range ${clip.url}: HTTP ${res.status}`);
          return state.audioCtx.decodeAudioData(await res.arrayBuffer());
        })();
        job.catch(() => state.clipCache.delete(key));
        state.clipCache.set(key, job);
      }
      return state.clipCache.get(key);
    }

    function prefetchClips(fromIndex) {
      const list = playList();
      for (let i = fromIndex; i < Math.min(list.length, fromIndex + CLIP_PREFETCH); i += 1) {
        if (list[i].clip) clipBuffer(list[i].clip).catch(() => {});
      }
    }

    function bufferForLang(lang) {
      if (lang === 'sv') return state.svBuffer;
      if (lang === 'en') return state.enBuffer;
      return state.ukBuffer;
    }

    function bufferForItem(item) {
      return item.lang === 'sv' ? state.svBuffer : state.ukBuffer;
    }

    function startClip(buffer, when, offset, duration, volume, rate) {
      const src = state.audioCtx.createBufferSource();
      src.buffer = buffer;
      src.playbackRate.value = rate;

      const gain = state.audioCtx.createGain();
      gain.gain.value = volume;

      src.connect(gain);
      gain.connect(state.audioCtx.destination);

      src.start(when, offset, duration);
      state.activeSources.push(src);
      src.onended = () => {
        state.activeSources = state.activeSources.filter((s) => s !== src);
      };
      return src;
    }

    function pausePlayback() {
      // A double-clicked card waiting to be played next is where the resume starts.
      const resumeAt = state.jumpTo >= 0 ? state.jumpTo : state.lastPlayedIndex;
      state.jumpTo = -1;
      if (resumeAt >= 0) {
        persistState(resumeAt);
        setPosInput(resumeAt);
      }
      state.stopRequested = true;
      state.playing = false;
      if (state.nextTimer) {
        clearTimeout(state.nextTimer);
        state.nextTimer = null;
      }
      for (const src of state.activeSources) {
        try {
          src.stop();
        } catch {
          // already stopped
        }
      }
      state.activeSources = [];
      setPlayFromNLabel(false);
      if (state.lastPlayedIndex >= 0) {
        const item = playList()[state.lastPlayedIndex];
        elCurrent.textContent = `Paused at ${renderStepLabel(item, state.lastPlayedIndex)}`;
        setActiveCard(state.lastPlayedIndex);
      } else {
        elCurrent.textContent = 'Paused.';
      }
    }

    function setKindMark(index, label) {
      if (index < 0 || !label) return;
      const li = elCardList.querySelector(`li[data-index="${index}"]`);
      if (!li) return;
      li.dataset.mark = label;
    }

    function setActiveCard(index) {
      state.currentIndex = index;
      if (index >= 0) {
        state.lastPlayedIndex = index;
      }
      for (const li of elCardList.querySelectorAll('li')) {
        li.dataset.active = li.dataset.index === String(index) ? '1' : '0';
      }
      if (index >= 0) {
        scrollCardIntoView(index);
      }
    }

    function setPlayingLine(index, seg) {
      setActiveCard(index);
      elCardList.querySelectorAll('.line.on').forEach((el) => el.classList.remove('on'));
      const li = elCardList.querySelector(`li[data-index="${index}"]`);
      const line = li && seg ? li.querySelector(`.line[data-seg="${seg}"]`) : null;
      if (line) line.classList.add('on');
    }

    // Double click: this card becomes the next step. Playing: it starts when the current step ends. Paused: the position moves here.
    function makeNext(index) {
      if (state.playing) {
        state.jumpTo = index;
        markSavedCard(index);
        elCurrent.textContent = `Next: ${renderStepLabel(playList()[index], index)}`;
        return;
      }
      setPosInput(index);
      goToN();
      persistState(index);
    }

    function renderCardList() {
      elCardList.innerHTML = '';
      if (!state.marks?.items?.length) {
        return;
      }
      playList().forEach((item, index) => {
        const li = document.createElement('li');
        li.dataset.index = String(index);
        const mark = userMarkForIndex(index);
        const line = isAutoMode() ? '' : item.text;
        const hints = isAutoMode()
          ? (item.hints || []).map((hint) => `<p class="line hint">${esc(hint.text)}</p>`).join('')
          : '';
        li.innerHTML = isAutoMode()
          ? `<p class="line ${item.role === 'tr' ? 'voiced' : 'say'}" data-seg="${item.lang}">${esc(item.text)}</p>${hints}`
          : `<div class="line">${esc(line)}</div>${translationHtml(item)}`;
        if (mark) li.dataset.mark = mark;
        li.addEventListener('click', () => {
          setPosInput(index);
          goToN();
        });
        li.addEventListener('dblclick', () => makeNext(index));
        elCardList.appendChild(li);
      });
      if (state.savedIndex >= 0) {
        markSavedCard(state.savedIndex);
      }
    }

    function waitMs(ms) {
      return new Promise((resolve) => {
        state.nextTimer = setTimeout(() => {
          state.nextTimer = null;
          resolve();
        }, ms);
      });
    }

    function waitForSourceEnd(src) {
      return new Promise((resolve) => {
        src.onended = () => {
          state.activeSources = state.activeSources.filter((s) => s !== src);
          resolve();
        };
      });
    }

    function clipSourceDuration(start, end, pad, bufferDuration) {
      const paddedEnd = Math.min(end + pad, bufferDuration);
      return Math.max(0, paddedEnd - start);
    }

    async function playStep(index) {
      const item = playList()[index];
      if (!item) return;
      // A word marked while the lesson plays is skipped without stopping playback.
      if (isKnownItem(item)) return;
      if (isAutoMode()) setPlayingLine(index, item.lang);
      if (item.clip) prefetchClips(index + 1);
      const buffer = item.clip
        ? await clipBuffer(item.clip)
        : (isAutoMode() ? bufferForLang(item.lang) : bufferForItem(item));
      if (state.stopRequested) return;
      // A clip buffer starts at clip.cut[0] of the lesson track, not at 0.
      const shift = item.clip ? item.clip.cut[0] : 0;
      const pad = DEFAULTS.CLIP_TAIL_PAD_SEC;
      const rate = DEFAULTS.PLAYBACK_RATE;
      const dur = clipSourceDuration(item.start - shift, item.end - shift, pad, buffer.duration);
      const pauseSec = Number(item.pause_sec);
      const afterSec = Number.isFinite(pauseSec) && pauseSec >= 0
        ? pauseSec
        : (state.marks.pause_sec ?? 0.6);

      setActiveCard(index);
      setPosInput(index);
      persistState(index);
      elCurrent.textContent = renderStepLabel(item, index);

      const when = state.audioCtx.currentTime;
      const src = startClip(
        buffer,
        when,
        item.start - shift,
        dur,
        DEFAULTS.VOLUME,
        rate,
      );
      await waitForSourceEnd(src);

      if (state.stopRequested) {
        return;
      }

      await waitMs((afterSec + state.pauseExtra) * 1000);
    }

    async function playFromIndex(startIndex) {
      if (state.playing) {
        pausePlayback();
        return;
      }

      state.stopRequested = false;
      state.playing = true;
      // Reset before any await, so a double click made while the audio loads is kept.
      state.jumpTo = -1;
      state.playingIndex = startIndex;
      if (btnRestart) btnRestart.hidden = true;
      setPlayFromNLabel(true);
      const unlocked = unlockAudio();

      try {
        await Promise.all([ensureAssetsLoaded(), unlocked]);
        if (!playList().length) {
          throw new Error('No items in marks JSON');
        }

        await startSilentKeeper();

        const endIndex = playList().length - 1;

        let i = state.jumpTo >= 0 ? state.jumpTo : startIndex;
        state.jumpTo = -1;
        while (i <= endIndex) {
          if (state.stopRequested) {
            break;
          }
          state.playingIndex = i;
          renderPlayLabel();
          await playStep(i);
          // A double click on a card chose the next step; otherwise go on in order.
          if (state.jumpTo >= 0) {
            i = state.jumpTo;
            state.jumpTo = -1;
          } else {
            i += 1;
          }
        }

        if (!state.stopRequested) {
          setActiveCard(-1);
          elCurrent.textContent = 'Finished.';
          if (btnRestart) btnRestart.hidden = false;
        }
      } catch (err) {
        console.error(err);
        elCurrent.textContent = `Error: ${err.message}`;
      } finally {
        state.playing = false;
        setPlayFromNLabel(false);
      }
    }

    function setPosMenuOpen(open) {
      if (!posWrap) return;
      posWrap.classList.toggle('is-open', open);
    }

    function setIcoMenuOpen(wrap, btn, open) {
      if (!wrap || !btn) return;
      wrap.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function closeAllMenus(exceptWrap) {
      if (exceptWrap !== posWrap) setPosMenuOpen(false);
      if (exceptWrap !== langWrap) setIcoMenuOpen(langWrap, btnTransLang, false);
      if (exceptWrap !== focusWrap) setIcoMenuOpen(focusWrap, btnTransFocus, false);
    }

    if (posWrap && inPos) {
      inPos.addEventListener('focus', () => {
        closeAllMenus(posWrap);
        setPosMenuOpen(true);
      });
      inPos.addEventListener('click', () => {
        closeAllMenus(posWrap);
        setPosMenuOpen(true);
      });
      if (posMenu) {
        posMenu.addEventListener('mousedown', (e) => {
          e.preventDefault();
        });
      }
      if (posGoStart) {
        posGoStart.addEventListener('click', () => {
          inPos.value = '1';
          setPosMenuOpen(false);
          goToN();
        });
      }
    }

    function bindIcoMenu(wrap, btn, onPick) {
      if (!wrap || !btn) return;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = !wrap.classList.contains('is-open');
        closeAllMenus(wrap);
        setIcoMenuOpen(wrap, btn, open);
      });
      wrap.querySelector('.pos-menu')?.addEventListener('click', (e) => {
        const item = e.target.closest('[role="menuitemradio"]');
        if (!item || !wrap.contains(item)) return;
        onPick(item);
        setIcoMenuOpen(wrap, btn, false);
      });
    }

    bindIcoMenu(langWrap, btnTransLang, (item) => {
      const lang = item.dataset.lang;
      state.translationLang = lang === 'en' || lang === 'off' ? lang : 'uk';
      syncAutoPlaybackControls();
      onAutoPlaybackChange();
    });
    bindIcoMenu(focusWrap, btnTransFocus, (item) => {
      const focus = item.dataset.focus;
      state.translationFocus = focus === 'f2' || focus === 'f3' ? focus : 'f1';
      syncAutoPlaybackControls();
      onAutoPlaybackChange();
    });

    document.addEventListener('click', (e) => {
      const t = e.target;
      if (posWrap && posWrap.contains(t)) return;
      if (langWrap && langWrap.contains(t)) return;
      if (focusWrap && focusWrap.contains(t)) return;
      closeAllMenus();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAllMenus();
    });

    function readFlag(key) {
      try {
        return localStorage.getItem(key) === '1';
      } catch {
        return false;
      }
    }

    function paintFlag(button, on) {
      button.dataset.selected = on ? '1' : '0';
      button.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    function applyFlags() {
      paintFlag(btnEn, state.showEn);
      paintFlag(btnUk, state.showUk);
      if (state.marks) {
        rebuildQueue();
        renderCardList();
      }
      const index = state.currentIndex >= 0 ? state.currentIndex : state.lastPlayedIndex;
      if (index >= 0 && playList()[index]) {
        elCurrent.textContent = renderStepLabel(playList()[index], index);
      }
    }

    function toggleFlag(which) {
      if (which === 'en') state.showEn = !state.showEn;
      if (which === 'uk') state.showUk = !state.showUk;
      try {
        localStorage.setItem(LS_EN_KEY, state.showEn ? '1' : '0');
        localStorage.setItem(LS_UK_KEY, state.showUk ? '1' : '0');
      } catch {
        // ignore
      }
      applyFlags();
    }

    btnEn.addEventListener('click', () => toggleFlag('en'));
    btnUk.addEventListener('click', () => toggleFlag('uk'));

    btnGoN.addEventListener('click', goToN);
    document.getElementById('btnToStart').addEventListener('click', () => {
      if (state.playing) return;
      inPos.value = '1';
      const index = goToN();
      if (index >= 0) persistState(index);
      renderPlayLabel();
    });
    if (btnRestart) {
      btnRestart.addEventListener('click', () => {
        if (state.playing) return;
        inPos.value = '1';
        const index = goToN();
        if (index >= 0) persistState(index);
      });
    }
    btnPlayFromN.addEventListener('click', () => {
      if (state.playing) {
        pausePlayback();
        return;
      }
      const index = goToN();
      if (index < 0) return;
      playFromIndex(index);
    });
    if (sessionKeeper) {
      sessionKeeper.addEventListener('playing', () => {
        bindMediaHandlers();
        syncMediaPlaybackState();
      });
      sessionKeeper.addEventListener('pause', () => {
        keepSilentKeeperPlaying();
      });
    }
    inPos.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (state.playing) return;
        const index = goToN();
        if (index >= 0) playFromIndex(index);
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && state.lastPlayedIndex >= 0) {
        persistState(state.lastPlayedIndex);
      }
    });
    window.addEventListener('pagehide', () => {
      if (state.lastPlayedIndex >= 0) {
        persistState(state.lastPlayedIndex);
      }
    });

    function onAutoPlaybackChange() {
      if (!isAutoMode()) return;
      try {
        localStorage.setItem(LS_TRANS_LANG_KEY, state.translationLang);
        localStorage.setItem(LS_TRANS_FOCUS_KEY, state.translationFocus);
      } catch {
        // ignore
      }
      if (state.playing) {
        pausePlayback();
      }
      rebuildQueue();
      showTotal();
      renderCardList();
      const index = clampIndex(state.currentIndex >= 0 ? state.currentIndex : state.lastPlayedIndex);
      if (index >= 0 && playList()[index]) {
        elCurrent.textContent = renderStepLabel(playList()[index], index);
      }
    }

    const elLessonHeading = document.getElementById('lessonHeading');
    const dlgList = document.getElementById('dlgListMenu');
    const elTagRow = document.getElementById('listMenuTagRow');
    const elLessonList = document.getElementById('lessonList');
    const elListStatus = document.getElementById('listStatus');
    const elFilter = document.getElementById('inFilter');
    let catalog = { lessons: [], tags: [] };
    let selectedTag = '';
    let tagPage = 0;
    let listFilter = '';

    function paintLesson(lesson) {
      if (!elLessonHeading) return;
      if (!lesson) {
        elLessonHeading.textContent = '';
        return;
      }
      const bits = [lesson.short || lesson.lesson_id];
      if (lesson.title && lesson.title !== lesson.short) bits.push(lesson.title);
      if (lesson.tag) bits.push(`тег ${lesson.tag}`);
      elLessonHeading.textContent = bits.join(' · ');
    }

    function lessonRows(doc) {
      const inner = doc && doc.lessons;
      if (!inner || typeof inner !== 'object') return [];
      return Object.values(inner)
        .filter((row) => row && /^\d+$/.test(String(row.lesson_id || '')))
        .map((row) => ({
          lesson_id: String(row.lesson_id),
          short: String(row.short || row.lesson_id),
          title: String(row.title || ''),
          tag: String(row.tag || '').toUpperCase(),
          order: Number(row.order) || 0,
          kind: row.kind === 'manual' ? 'manual' : 'auto',
        }));
    }

    function tagRows(doc) {
      const inner = doc && doc.tags;
      if (!inner || typeof inner !== 'object') return [];
      return Object.entries(inner)
        .map(([code, row]) => ({
          code: String((row && row.label) || code).toUpperCase(),
          order: Number(row && row.order) || 0,
        }))
        .filter((row) => row.code)
        .sort((a, b) => a.order - b.order || a.code.localeCompare(b.code));
    }

    async function loadCatalog() {
      await ensureSignedIn();
      const [lessonsDoc, tagsDoc] = await Promise.all([
        requestByPath(LESSONS_DB, 'GET', null),
        requestByPath(TAGS_DB, 'GET', null),
      ]);
      return { lessons: lessonRows(lessonsDoc), tags: tagRows(tagsDoc) };
    }

    function visibleLessons() {
      const q = listFilter.trim().toLowerCase();
      return catalog.lessons
        .filter((item) => !selectedTag || item.tag === selectedTag)
        .filter((item) => !q || item.short.toLowerCase().includes(q) || item.title.toLowerCase().includes(q))
        .sort((a, b) => a.order - b.order || a.short.localeCompare(b.short));
    }

    function renderTags() {
      elTagRow.innerHTML = '';
      const page = catalog.tags.slice(tagPage, tagPage + TAG_PAGE);
      page.forEach((tag) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = tag.code;
        btn.dataset.tag = tag.code;
        btn.title = `${tag.code} (order ${tag.order})`;
        btn.dataset.selected = selectedTag === tag.code ? '1' : '0';
        btn.onclick = () => {
          selectedTag = tag.code;
          renderTags();
          renderLessonChoices();
        };
        elTagRow.appendChild(btn);
      });
      const all = document.createElement('button');
      all.type = 'button';
      all.textContent = 'All';
      all.dataset.all = '1';
      all.title = 'All';
      all.dataset.selected = selectedTag ? '0' : '1';
      all.onclick = () => {
        selectedTag = '';
        renderTags();
        renderLessonChoices();
      };
      elTagRow.appendChild(all);
      const glue = document.createElement('button');
      glue.type = 'button';
      glue.textContent = 'Склейки';
      glue.dataset.tag = GLUE_TAG;
      glue.dataset.selected = selectedTag === GLUE_TAG ? '1' : '0';
      glue.onclick = () => {
        selectedTag = GLUE_TAG;
        renderTags();
        renderLessonChoices();
      };
      elTagRow.appendChild(glue);
      if (catalog.tags.length > TAG_PAGE) {
        const next = document.createElement('button');
        next.type = 'button';
        next.textContent = '›';
        next.title = 'Next tags';
        next.setAttribute('aria-label', 'Next tags');
        next.onclick = () => {
          tagPage += TAG_PAGE;
          if (tagPage >= catalog.tags.length) tagPage = 0;
          renderTags();
        };
        elTagRow.appendChild(next);
      }
    }

    function openRow(li, label, load) {
      elLessonList.querySelectorAll('li').forEach((x) => { x.dataset.selected = '0'; x.dataset.loading = '0'; });
      li.dataset.loading = '1';
      elListStatus.textContent = 'Завантаження уроку…';
      load().then(() => {
        li.dataset.loading = '0';
        li.dataset.selected = '1';
        elListStatus.textContent = `Урок завантажено: ${label}`;
      }).catch((err) => {
        console.error(err);
        li.dataset.loading = '0';
        elListStatus.textContent = `Load error: ${err.message}`;
        elCurrent.textContent = `Load error: ${err.message}`;
      });
    }

    function renderGlueRows() {
      const gen = glueDoc.current;
      if (!gen) {
        elListStatus.textContent = 'Склейок ще немає: кнопка з книжкою → «Згенерувати».';
        return;
      }
      elListStatus.textContent = `${gen.batches.length} склейок від ${new Date(gen.created_at).toLocaleString('uk')}`;
      gen.batches.forEach((batch) => {
        const li = document.createElement('li');
        const left = GlueBatches.remaining(batch, knownWords);
        const label = `Склейка ${batch.idx}/${gen.batches.length}`;
        li.dataset.selected = GlueBatches.batchLessonId(gen, batch) === state.lessonId ? '1' : '0';
        li.textContent = `${label} · ${batch.words.length} слів · лишилось ${left}`;
        li.onclick = () => openRow(li, label, () => useBatch(gen, batch));
        elLessonList.appendChild(li);
      });
    }

    function renderLessonChoices() {
      elLessonList.innerHTML = '';
      if (selectedTag === GLUE_TAG) {
        renderGlueRows();
        return;
      }
      const rows = visibleLessons();
      elListStatus.textContent = rows.length ? `${rows.length} уроків` : 'Немає уроків за цим фільтром.';
      rows.forEach((lesson) => {
        const li = document.createElement('li');
        li.dataset.selected = lesson.lesson_id === state.lessonId ? '1' : '0';
        li.textContent = lesson.short;
        li.onclick = () => openRow(li, lesson.short, () => useLesson(lesson));
        elLessonList.appendChild(li);
      });
    }

    function pauseKey() {
      const lesson = state.lessonId || state.marks?.lesson_id || 'default';
      return `${LS_PAUSE_KEY}_${lesson}`;
    }

    function readPauseExtra() {
      try {
        const value = Number.parseInt(localStorage.getItem(pauseKey()), 10);
        return value >= 0 && value <= PAUSE_EXTRA_MAX ? value : 0;
      } catch {
        return 0;
      }
    }

    function paintPause() {
      if (btnPause) btnPause.textContent = `⏱+${state.pauseExtra}`;
    }

    function cyclePauseExtra() {
      state.pauseExtra = (state.pauseExtra + 1) % (PAUSE_EXTRA_MAX + 1);
      try {
        localStorage.setItem(pauseKey(), String(state.pauseExtra));
      } catch {
        // ignore
      }
      paintPause();
      showTotal();
    }

    if (btnPause) btnPause.addEventListener('click', cyclePauseExtra);

    function lessonPrefKey(base) {
      return `${base}_${state.lessonId || state.marks?.lesson_id || 'default'}`;
    }

    // fallback: value while the user has not toggled the flag for this lesson.
    function readLessonFlag(base, fallback = false) {
      try {
        const value = localStorage.getItem(lessonPrefKey(base));
        return value === null ? fallback : value === '1';
      } catch {
        return fallback;
      }
    }

    function writeLessonFlag(base, on) {
      try {
        localStorage.setItem(lessonPrefKey(base), on ? '1' : '0');
      } catch {
        // ignore
      }
    }

    // A new order changes step numbers, so the place is carried over by step, not by number.
    function changeOrder(apply) {
      const from = Math.max(readPosIndex(), 0);
      const ahead = playList().map((_, index) => stepIdForIndex(index));
      const anchors = [...ahead.slice(from), ...ahead.slice(0, from).reverse()];
      if (state.playing) pausePlayback();
      apply();
      paintOrder();
      rebuildQueue();
      showTotal();
      renderCardList();
      const index = anchors.map(indexForStepId).find((found) => found >= 0) ?? (playList().length ? 0 : -1);
      if (index < 0) {
        elCurrent.textContent = 'All words are known.';
        return;
      }
      setPosInput(index);
      setActiveCard(index);
      persistState(index);
      elCurrent.textContent = renderStepLabel(playList()[index], index);
    }

    if (btnShuffle) {
      btnShuffle.addEventListener('click', () => changeOrder(() => {
        state.shuffle = !state.shuffle;
        writeLessonFlag(LS_SHUFFLE_KEY, state.shuffle);
      }));
    }
    if (btnSkipKnown) {
      btnSkipKnown.addEventListener('click', () => changeOrder(() => {
        state.skipKnown = !state.skipKnown;
        writeLessonFlag(LS_SKIP_KNOWN_KEY, state.skipKnown);
      }));
    }
    function refreshQueueForKnown() {
      if (!state.skipKnown || state.playing || knownSignature() === state.queueKnown) return;
      changeOrder(() => {});
    }
    if (btnSeq) {
      btnSeq.addEventListener('click', () => changeOrder(() => {
        state.translationFirst = !state.translationFirst;
        writeLessonFlag(LS_TR_FIRST_KEY, state.translationFirst);
      }));
    }

    const elChannel = document.getElementById('elChannel');
    if (elChannel) {
      const channel = IS_LOCAL ? 'ЛОКАЛЬНО ' : IS_BETA ? 'БЕТА ' : '';
      elChannel.textContent = `${channel}v${VT_VERSION}`;
    }

    function finishLoad() {
      state.userMarks = readLocalUserMarks();
      state.pauseExtra = readPauseExtra();
      state.shuffle = readLessonFlag(LS_SHUFFLE_KEY);
      state.translationFirst = readLessonFlag(LS_TR_FIRST_KEY);
      state.skipKnown = readLessonFlag(LS_SKIP_KNOWN_KEY, true);
      knownWords = readLocalKnown();
      paintPause();
      applyPlaybackUi();
      initAutoPlaybackFromMarks();
      state.showEn = readFlag(LS_EN_KEY);
      state.showUk = readFlag(LS_UK_KEY);
      paintFlag(btnEn, state.showEn);
      paintFlag(btnUk, state.showUk);
      rebuildQueue();
      showTotal();
      renderCardList();
      syncKnown().then(refreshQueueForKnown);
      inPos.max = String(playList().length);
      inPos.min = '1';
      const local = applySavedIndex(readLocalSavedIndex());
      if (local < 0) {
        setPosInput(0);
        elCardList.scrollTop = 0;
      }
      elCurrent.textContent = local >= 0
        ? `At saved #${local + 1}.`
        : 'Ready.';
      loadSavedStateFromDb().then((dbIndex) => {
        if (Object.keys(state.userMarks).length) {
          renderCardList();
        }
        if (dbIndex < 0) return;
        applySavedIndex(dbIndex);
        elCurrent.textContent = `At saved #${dbIndex + 1}.`;
      });
    }

    async function useLesson(lesson) {
      const id = String(lesson.lesson_id || '');
      if (!/^\d+$/.test(id)) throw new Error('lesson id');
      const nextBase = `audio/lessons/${id}/`;
      const res = await fetch(`${nextBase}marks.json`);
      if (!res.ok) throw new Error(`marks ${res.status}`);
      applyLesson(id, nextBase, await res.json(), lesson);
    }

    function applyLesson(id, nextBase, marks, lesson) {
      if (state.playing || state.lastPlayedIndex >= 0) pausePlayback();
      audioBase = nextBase;
      state.lessonId = id;
      state.marks = marks;
      state.svBuffer = null;
      state.ukBuffer = null;
      state.enBuffer = null;
      state.clipCache = new Map();
      state.currentIndex = -1;
      state.lastPlayedIndex = -1;
      state.userMarks = {};
      try {
        localStorage.setItem(LS_LESSON_KEY, id);
      } catch {
        // ignore
      }
      paintLesson(lesson);
      finishLoad();
    }

    // ---- Glue batches: storage, screen, playback ----
    const marksCache = new Map();
    let glueDoc = GlueBatches.normalizeDoc(null);
    let glueMode = 'range';
    let glueLessons = [];

    function isGlueId(id) {
      return String(id || '').startsWith('glue:');
    }

    async function fetchLessonMarks(id) {
      if (!marksCache.has(id)) {
        const res = await fetch(`audio/lessons/${id}/marks.json`);
        if (!res.ok) throw new Error(`marks ${id}: ${res.status}`);
        marksCache.set(id, await res.json());
      }
      return marksCache.get(id);
    }

    function writeLocalGlue(doc) {
      try {
        localStorage.setItem(LS_GLUE_KEY, JSON.stringify(doc));
      } catch {
        // ignore
      }
    }

    function readLocalGlue() {
      try {
        return GlueBatches.normalizeDoc(JSON.parse(localStorage.getItem(LS_GLUE_KEY)));
      } catch {
        return GlueBatches.normalizeDoc(null);
      }
    }

    // The stored document wins over the local copy; offline the local copy is used.
    async function loadGlue() {
      glueDoc = readLocalGlue();
      try {
        await ensureSignedIn();
        const stored = await requestByPath(GLUE_DB, 'GET', null);
        if (stored) {
          glueDoc = GlueBatches.normalizeDoc(stored);
          writeLocalGlue(glueDoc);
        }
      } catch (err) {
        console.error('Glue read failed', err);
      }
      return glueDoc;
    }

    // GET → change → PUT of the whole document, so a generation written by another device is not lost.
    // The local state changes only after the PUT succeeded.
    async function saveGlue(change) {
      await ensureSignedIn();
      const doc = change(GlueBatches.normalizeDoc(await requestByPath(GLUE_DB, 'GET', null)));
      await requestByPath(GLUE_DB, 'PUT', doc);
      glueDoc = doc;
      writeLocalGlue(doc);
    }

    async function useBatch(generation, batch) {
      const ids = [...new Set(batch.words.map((w) => w.lesson_id))];
      const marksById = {};
      await Promise.all(ids.map(async (id) => { marksById[id] = await fetchLessonMarks(id); }));
      const marks = GlueBatches.buildBatchMarks(generation, batch, marksById);
      if (!marks.items.length) throw new Error('у склейці немає кроків');
      applyLesson(marks.lesson_id, audioBase, marks, {
        lesson_id: marks.lesson_id,
        short: `Склейка ${batch.idx}/${generation.batches.length}`,
        title: `${batch.words.length} слів`,
      });
    }

    const elGlueN = document.getElementById('glueN');
    const elGlueFrom = document.getElementById('glueFrom');
    const elGlueTo = document.getElementById('glueTo');
    const elGlueLessons = document.getElementById('glueLessons');
    const elGlueInfo = document.getElementById('glueInfo');
    const elGlueStatus = document.getElementById('glueStatus');
    const elGlueHistory = document.getElementById('glueHistory');

    function glueSelection() {
      if (glueMode === 'list') {
        const ids = [...elGlueLessons.querySelectorAll('input:checked')].map((box) => box.value);
        return { mode: 'list', ids };
      }
      return { mode: 'range', from: Number(elGlueFrom.value), to: Number(elGlueTo.value) };
    }

    function glueIds() {
      return GlueBatches.selectedIds(glueSelection(), glueLessons.filter((x) => x.ok).map((x) => x.id));
    }

    function glueDate(gen) {
      return new Date(gen.created_at).toLocaleString('uk');
    }

    function paintGlueInfo() {
      const ids = glueIds();
      const pool = ids.reduce((sum, id) => sum + GlueBatches.unlearnedWords(id, marksCache.get(id), knownWords).length, 0);
      const n = Math.max(1, Number(elGlueN.value) || 1);
      elGlueInfo.textContent = `Уроків: ${ids.length}. Невивчених слів: ${pool}. Склейок: ${Math.ceil(pool / n)}.`;
    }

    function paintGlueHistory() {
      elGlueHistory.innerHTML = '';
      if (!glueDoc.history.length) {
        const li = document.createElement('li');
        li.textContent = 'Резервів ще немає.';
        elGlueHistory.appendChild(li);
      }
      glueDoc.history.forEach((gen) => {
        const li = document.createElement('li');
        const text = document.createElement('span');
        text.textContent = `${glueDate(gen)} · уроки ${gen.lessons.join(', ')} · N=${gen.n} · ${gen.batches.length} склейок`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Відновити';
        btn.onclick = async () => {
          try {
            await saveGlue((doc) => GlueBatches.restoreGeneration(doc, gen.id));
            elGlueStatus.textContent = 'Відновлено; попередня черга пішла в резерв.';
          } catch (err) {
            elGlueStatus.textContent = `Не збережено: ${err.message}`;
          }
          paintGlueHistory();
        };
        li.append(text, btn);
        elGlueHistory.appendChild(li);
      });
    }

    function paintGlueMode() {
      document.getElementById('glueModeRange').dataset.selected = glueMode === 'range' ? '1' : '0';
      document.getElementById('glueModeList').dataset.selected = glueMode === 'list' ? '1' : '0';
      document.getElementById('glueRange').hidden = glueMode !== 'range';
      elGlueLessons.hidden = glueMode !== 'list';
      paintGlueInfo();
    }

    async function paintGlueView() {
      elGlueStatus.textContent = 'Читання уроків…';
      try {
        if (!catalog.lessons.length) catalog = await loadCatalog();
        await loadGlue();
        const autos = catalog.lessons.filter((row) => row.kind === 'auto')
          .sort((a, b) => Number(a.lesson_id) - Number(b.lesson_id));
        glueLessons = await Promise.all(autos.map(async (row) => {
          try {
            const marks = await fetchLessonMarks(row.lesson_id);
            return { id: row.lesson_id, short: row.short, ok: !!marks.byte_marks };
          } catch {
            return { id: row.lesson_id, short: row.short, ok: false };
          }
        }));
      } catch (err) {
        console.error(err);
        elGlueStatus.textContent = 'Список уроків не прочитано.';
        return;
      }
      knownWords = readLocalKnown();
      const usable = glueLessons.filter((x) => x.ok).map((x) => Number(x.id));
      if (usable.length && !elGlueFrom.value) elGlueFrom.value = String(Math.min(...usable));
      if (usable.length && !elGlueTo.value) elGlueTo.value = String(Math.max(...usable));
      elGlueLessons.innerHTML = '';
      glueLessons.forEach((lesson) => {
        const li = document.createElement('li');
        li.dataset.off = lesson.ok ? '0' : '1';
        const label = document.createElement('label');
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.value = lesson.id;
        box.disabled = !lesson.ok;
        box.onchange = paintGlueInfo;
        label.append(box, ` ${lesson.short}${lesson.ok ? '' : ' (немає байтових меж)'}`);
        li.appendChild(label);
        elGlueLessons.appendChild(li);
      });
      elGlueStatus.textContent = glueDoc.current
        ? `Поточна черга: ${glueDoc.current.batches.length} склейок від ${glueDate(glueDoc.current)}.`
        : 'Черги склейок ще немає.';
      paintGlueMode();
      paintGlueHistory();
    }

    async function runGlue() {
      const ids = glueIds();
      if (!ids.length) {
        elGlueStatus.textContent = 'Не обрано жодного уроку з байтовими межами.';
        return;
      }
      await syncKnown();
      const gen = GlueBatches.generate({
        lessons: ids.map((id) => ({ id, marks: marksCache.get(id) })),
        known: knownWords,
        selection: glueSelection(),
        n: Number(elGlueN.value),
        seed: crypto.getRandomValues(new Uint32Array(1))[0],
      });
      if (!gen.batches.length) {
        elGlueStatus.textContent = 'У вибраних уроках немає невивчених слів.';
        return;
      }
      const cur = glueDoc.current;
      if (cur && !confirm(`Перезаписати поточну чергу склейок (${cur.batches.length} склейок від ${glueDate(cur)})?\nПопередня піде в резерв (зберігаються 5 останніх).`)) return;
      try {
        await saveGlue((doc) => GlueBatches.pushGeneration(doc, gen));
        elGlueStatus.textContent = `Готово: ${gen.batches.length} склейок, ${gen.pool_size} слів. Вони в списку уроків, тег «Склейки».`;
      } catch (err) {
        console.error(err);
        elGlueStatus.textContent = `Не збережено: ${err.message}`;
      }
      paintGlueHistory();
    }

    document.getElementById('glueModeRange').onclick = () => { glueMode = 'range'; paintGlueMode(); };
    document.getElementById('glueModeList').onclick = () => { glueMode = 'list'; paintGlueMode(); };
    for (const el of [elGlueN, elGlueFrom, elGlueTo]) el.oninput = paintGlueInfo;
    document.getElementById('glueGo').onclick = runGlue;

    async function startPlayer() {
      let saved = '';
      try {
        saved = localStorage.getItem(LS_LESSON_KEY) || '';
      } catch {
        saved = '';
      }
      if (isGlueId(saved)) {
        try {
          knownWords = readLocalKnown();
          await loadGlue();
          const found = GlueBatches.findBatch(glueDoc, saved);
          if (found) {
            await useBatch(found.generation, found.batch);
            return;
          }
        } catch (err) {
          console.error(err);
        }
      }
      if (/^\d+$/.test(saved)) {
        try {
          catalog = await loadCatalog();
          const lesson = catalog.lessons.find((item) => item.lesson_id === saved);
          if (lesson) {
            await useLesson(lesson);
            return;
          }
        } catch (err) {
          console.error(err);
        }
      }
      await loadMarks();
      finishLoad();
    }

    document.getElementById('btnListMenu').onclick = async () => {
      dlgList.dataset.view = 'lessons';
      btnModeListen.dataset.selected = '1';
      btnModeMark.dataset.selected = '0';
      btnModeSettings.dataset.selected = '0';
      btnModeGlue.dataset.selected = '0';
      btnModeGlue.removeAttribute('aria-current');
      btnModeListen.setAttribute('aria-current', 'true');
      btnModeMark.removeAttribute('aria-current');
      btnModeSettings.removeAttribute('aria-current');
      dlgList.showModal();
      elListStatus.textContent = 'Завантаження…';
      elLessonList.innerHTML = '';
      try {
        catalog = await loadCatalog();
        await loadGlue();
        tagPage = 0;
        renderTags();
        renderLessonChoices();
      } catch (err) {
        console.error(err);
        elListStatus.textContent = 'Список не прочитано.';
      }
    };

    const elMarkList = document.getElementById('markList');
    const btnModeListen = document.getElementById('btnModeListen');
    const btnModeMark = document.getElementById('btnModeMark');
    const btnModeSettings = document.getElementById('btnModeSettings');
    const btnModeGlue = document.getElementById('btnModeGlue');
    const btnMarkAll = document.getElementById('markAll');
    const btnMarkKnown = document.getElementById('markKnown');
    const btnMarkTr = document.getElementById('markTr');
    let knownWords = {};
    let knownOps = {};
    let knownOnly = false;
    let knownChain = Promise.resolve();

    function lessonWords() {
      const words = new Map();
      for (const item of state.marks?.items || []) {
        if (!item.word) continue;
        const key = wordKey(item.word);
        if (!words.has(key) || item.band === 'word') {
          words.set(key, { key, word: item.word, tr: item.uk || item.en || '' });
        }
      }
      return [...words.values()];
    }

    function readLocalKnown() {
      try {
        const parsed = JSON.parse(localStorage.getItem(LS_KNOWN_KEY) || '{}');
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch {
        return {};
      }
    }

    function writeLocalKnown() {
      try {
        localStorage.setItem(LS_KNOWN_KEY, JSON.stringify(knownWords));
      } catch {
        // ignore
      }
    }

    function paintMarkStatus(note) {
      const words = lessonWords();
      const known = words.filter((row) => knownWords[row.key]).length;
      elListStatus.textContent = note || `${state.lessonId ? `Lesson ${state.lessonId} · ` : ''}${words.length} words · ✓ ${known}`;
      btnMarkAll.textContent = `All ${words.length}`;
      btnMarkKnown.textContent = `✓ ${known}`;
      btnMarkAll.dataset.selected = knownOnly ? '0' : '1';
      btnMarkKnown.dataset.selected = knownOnly ? '1' : '0';
    }

    function renderMarkList() {
      elMarkList.innerHTML = '';
      lessonWords()
        .filter((row) => !knownOnly || knownWords[row.key])
        .forEach((row) => {
          const li = document.createElement('li');
          const on = !!knownWords[row.key];
          li.dataset.known = on ? '1' : '0';
          li.setAttribute('role', 'button');
          li.setAttribute('aria-pressed', on ? 'true' : 'false');
          const text = document.createElement('span');
          text.className = 'wd';
          const word = document.createElement('b');
          word.textContent = row.word;
          const tr = document.createElement('small');
          tr.textContent = row.tr;
          text.append(word, tr);
          const mark = document.createElement('span');
          mark.className = 'mk';
          mark.textContent = on ? '✓' : '';
          li.append(text, mark);
          li.onclick = () => toggleKnown(row.key);
          elMarkList.appendChild(li);
        });
      paintMarkStatus();
    }

    function applyKnownOps(doc) {
      const next = { ...(doc || {}) };
      for (const [key, value] of Object.entries(knownOps)) {
        if (value) next[key] = value;
        else delete next[key];
      }
      return next;
    }

    // Always merges with the stored list, so marks from another device are not lost.
    function syncKnown() {
      knownChain = knownChain
        .then(async () => {
          await ensureSignedIn();
          const stored = await requestByPath(KNOWN_DB, 'GET', null);
          const sent = { ...knownOps };
          const merged = applyKnownOps(stored);
          if (Object.keys(sent).length) await requestByPath(KNOWN_DB, 'PUT', merged);
          for (const [key, value] of Object.entries(sent)) {
            if (knownOps[key] === value) delete knownOps[key];
          }
          knownWords = applyKnownOps(merged);
          writeLocalKnown();
          if (dlgList.dataset.view === 'mark') renderMarkList();
        })
        .catch((err) => {
          console.error('Known words sync failed', err);
          if (dlgList.dataset.view === 'mark') paintMarkStatus('Not saved. Will retry on the next tap.');
        });
      return knownChain;
    }

    function toggleKnown(key) {
      const value = knownWords[key] ? null : new Date().toISOString();
      if (value) knownWords[key] = value;
      else delete knownWords[key];
      knownOps[key] = value;
      writeLocalKnown();
      renderMarkList();
      syncKnown();
    }

    function setDialogView(view) {
      dlgList.dataset.view = view;
      const mark = view === 'mark';
      const settings = view === 'settings';
      const glue = view === 'glue';
      const listen = !mark && !settings && !glue;
      btnModeListen.dataset.selected = listen ? '1' : '0';
      btnModeMark.dataset.selected = mark ? '1' : '0';
      btnModeSettings.dataset.selected = settings ? '1' : '0';
      btnModeGlue.dataset.selected = glue ? '1' : '0';
      btnModeGlue.toggleAttribute('aria-current', glue);
      btnModeListen.toggleAttribute('aria-current', listen);
      btnModeMark.toggleAttribute('aria-current', mark);
      btnModeSettings.toggleAttribute('aria-current', settings);
      if (settings) return;
      if (glue) {
        paintGlueView();
        return;
      }
      if (mark) {
        knownWords = readLocalKnown();
        knownOnly = false;
        renderMarkList();
        syncKnown();
      } else {
        renderLessonChoices();
      }
    }

    function readMarkTr() {
      try {
        return localStorage.getItem(LS_MARK_TR_KEY) !== '0';
      } catch {
        return true;
      }
    }

    function paintMarkTr(on) {
      elMarkList.dataset.noTr = on ? '0' : '1';
      btnMarkTr.dataset.selected = on ? '1' : '0';
      btnMarkTr.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    btnMarkTr.onclick = () => {
      const on = elMarkList.dataset.noTr === '1';
      try {
        localStorage.setItem(LS_MARK_TR_KEY, on ? '1' : '0');
      } catch {
        // ignore
      }
      paintMarkTr(on);
    };
    paintMarkTr(readMarkTr());

    dlgList.addEventListener('close', refreshQueueForKnown);
    btnModeListen.onclick = () => {
      if (dlgList.dataset.view === 'lessons') {
        dlgList.close();
        return;
      }
      setDialogView('lessons');
    };
    btnModeSettings.onclick = () => setDialogView('settings');
    btnModeMark.onclick = () => setDialogView('mark');
    btnModeGlue.onclick = () => setDialogView('glue');
    btnMarkAll.onclick = () => {
      knownOnly = false;
      renderMarkList();
    };
    btnMarkKnown.onclick = () => {
      knownOnly = true;
      renderMarkList();
    };

    elFilter.oninput = (event) => {
      listFilter = event.target.value;
      renderLessonChoices();
    };

    dlgList.querySelector('form').addEventListener('submit', (event) => {
      if (event.submitter && event.submitter.id === 'btnListClose') return;
      event.preventDefault();
    });

    startPlayer().catch((err) => {
      console.error(err);
      elCurrent.textContent = `Load error: ${err.message}. Use http://localhost:8080/...`;
    });
  </script>
<script>
// UI-only additions: theme toggle + progress bar (no changes to original logic)
(function(){
  const h=document.documentElement,k='voicetrain_theme',t=localStorage.getItem(k),bt=document.getElementById('btnTheme');
  const themes=['light','dark','light-big','dark-big'],names={light:'Світла',dark:'Темна','light-big':'Світла, крупний шрифт','dark-big':'Темна, крупний шрифт'};
  const tw=document.getElementById('themeWrap'),tm=document.getElementById('themeMenu');
  function cur(){return h.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
  function show(){const c=cur();bt.textContent=c.endsWith('-big')?'A◐':'◐';bt.title=names[c];tm.querySelectorAll('[data-theme-pick]').forEach(b=>b.setAttribute('aria-checked',b.dataset.themePick===c?'true':'false'));}
  function setOpen(o){tw.classList.toggle('is-open',o);bt.setAttribute('aria-expanded',o?'true':'false');}
  if(themes.includes(t))h.dataset.theme=t;show();
  bt.onclick=()=>setOpen(!tw.classList.contains('is-open'));
  tm.addEventListener('click',e=>{const b=e.target.closest('[data-theme-pick]');if(!b)return;h.dataset.theme=b.dataset.themePick;localStorage.setItem(k,h.dataset.theme);show();setOpen(false);});
  document.addEventListener('click',e=>{if(!tw.contains(e.target))setOpen(false);},true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false);});
  const list=document.getElementById('cardList'),bar=document.getElementById('progBar'),of=document.getElementById('posOf');
  function upd(){const n=list.children.length;const a=list.querySelector('li[data-active="1"]');const i=a?[...list.children].indexOf(a)+1:(+document.getElementById('inPos').value||0);bar.style.width=n?Math.min(100,i/n*100)+'%':'0';of.textContent=n?`з ${n}`:'';}
  new MutationObserver(upd).observe(list,{subtree:true,childList:true,attributes:true,attributeFilter:['data-active']});
  document.getElementById('inPos').addEventListener('input',upd);
})();
</script>
