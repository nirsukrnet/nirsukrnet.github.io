<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<base href="https://nirsukrnet.github.io/voicetrain/" />
<title>VoiceTraining</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7fb;--card:#fff;--fg:#14161c;--mut:#667085;--line:#e4e7ee;--acc:#2563eb;--acc2:#1d4ed8;--accfg:#fff;--soft:#eef2ff;--say:#fff6dc;--sayfg:#3d3424;--voi:#fff1e6;--voifg:#9a3f10;--hint:#f2f4f7;--hintfg:#5b6675;--skip:#2563eb;--focus:#ea580c;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#171b23;--fg:#e8eaf0;--mut:#98a2b3;--line:#2a303c;--acc:#3b82f6;--acc2:#60a5fa;--soft:#1e2a44;--say:#2e2816;--sayfg:#f5e7bf;--voi:#33200f;--voifg:#ffb784;--hint:#1f242e;--hintfg:#a9b4c4}}
html[data-theme=light],html[data-theme=light-big]{color-scheme:light;--bg:#f6f7fb;--card:#fff;--fg:#14161c;--mut:#667085;--line:#e4e7ee;--soft:#eef2ff;--say:#fff6dc;--sayfg:#3d3424;--voi:#fff1e6;--voifg:#9a3f10;--hint:#f2f4f7;--hintfg:#5b6675}
html[data-theme=dark],html[data-theme=dark-big]{color-scheme:dark;--bg:#0e1117;--card:#171b23;--fg:#e8eaf0;--mut:#98a2b3;--line:#2a303c;--soft:#1e2a44;--say:#2e2816;--sayfg:#f5e7bf;--voi:#33200f;--voifg:#ffb784;--hint:#1f242e;--hintfg:#a9b4c4}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-tap-highlight-color:transparent}
.dialog{max-width:640px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:0 12px calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0}
h1{margin:0;font-size:20px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total{margin:0;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;transition:background .15s,transform .05s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:2px}
.icon{width:44px;padding:0;font-size:18px}
#btnListMenu{font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flag{min-width:56px;font-weight:700;letter-spacing:.04em}
button[data-selected="1"],.flag[aria-pressed=true]{background:var(--soft);border-color:var(--acc);color:var(--acc2)}
.seg{color:var(--mut);font-size:13px;margin-right:2px}
input[type=number]{width:84px;padding:10px;border:1px solid var(--line);border-radius:12px;font:inherit;min-height:44px;background:var(--card);color:var(--fg);text-align:center}
.muted{color:var(--mut);font-size:14px}
.current{margin:10px 0 4px;padding:12px 14px;border-radius:var(--r);background:var(--soft);color:var(--fg);font-size:15px;border-left:4px solid var(--acc)}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 0}
.progress>i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px;flex:1;overflow-y:auto;min-height:0;align-content:start;scroll-padding:12px}
li{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;user-select:none;position:relative}
li:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
li[data-active="1"]{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
li[data-active="1"]:not(:has(.say)){background:var(--soft)}
li[data-saved="1"]::after{content:"● saved";position:absolute;top:8px;right:10px;font-size:11px;color:var(--acc2);font-weight:600}
li[data-mark=skip]{border-left:5px solid var(--skip)}
li[data-mark=focus]{border-left:5px solid var(--focus)}
.line.say,.line.voiced,.line.hint{margin:0;border-radius:10px;padding:6px 10px;line-height:1.4}
.line.say{font-weight:700;font-size:17px;background:var(--say);color:var(--sayfg)}
.line.voiced{margin-top:6px;font-weight:700;background:var(--voi);color:var(--voifg)}
.line.hint{margin-top:6px;font-size:14px;background:var(--hint);color:var(--hintfg)}
.line.on{outline:2px solid var(--acc);outline-offset:1px}
.kind{display:none}
.tr{margin-top:6px;font-size:14px;line-height:1.4}
.tr-en{color:#3b6fd8}.tr-uk{color:#c2631f}
.card-audio{position:absolute;width:1px;height:1px;opacity:.01;pointer-events:none}
.pos-wrap,.ico-wrap{position:relative}
.pos-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:100%;width:max-content;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:4px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pos-wrap.is-open .pos-menu,.ico-wrap.is-open .pos-menu{display:block}
.pos-menu button{width:100%;text-align:left;white-space:nowrap;border:0;border-radius:8px;min-height:40px;background:transparent}
.pos-menu button:hover{background:var(--soft)}
.pos-menu button[aria-checked=true]{background:var(--soft);color:var(--acc2);font-weight:600}
/* bottom action bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
#btnPlayFromN{flex:1;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:var(--accfg);font-size:18px;font-weight:700;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
#btnPlayFromN:hover{background:var(--acc2)}
#btnGoN{min-height:56px;border-radius:16px;font-weight:600}
/* lesson picker */
#dlgListMenu{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;inset:0;border:0;border-radius:0;padding:16px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);color:var(--fg)}
#dlgListMenu::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(2px)}
#dlgListMenu form{display:flex;flex-direction:column;height:100%;min-height:0}
#btnListClose{position:absolute;top:10px;right:10px;width:44px;padding:0;font-size:22px;border-radius:50%}
#listMenuTagRow{margin:44px 0 10px}
#inFilter{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--fg)}
#lessonList{flex:1;min-height:0}
#lessonList li{width:100%}
#lessonList li[data-selected="1"]{background:var(--soft);border-color:var(--acc)}
#markChips{display:none;margin:44px 0 10px}
#dlgListMenu[data-view=mark] #listMenuTagRow,#dlgListMenu[data-view=mark] #inFilter,#dlgListMenu[data-view=mark] #lessonList{display:none}
#dlgListMenu[data-view=mark] #markChips{display:flex}
#markList{display:none;flex:1;min-height:0}
#dlgListMenu[data-view=mark] #markList{display:grid}
#markList li{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:4px 8px 4px 10px}
#markList li::before{content:none}
#markList li[data-known="1"]{background:var(--soft);border-color:var(--acc)}
#markList .wd{flex:1;min-width:0;line-height:1.25}
#markList .wd b,#markList .wd small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#markList .wd small{font-size:13px;color:var(--mut)}
#markTr{margin-left:auto}
#markList[data-no-tr="1"] .wd small{display:none}
#markList .mk{flex:none;width:28px;text-align:center;font-size:20px;color:var(--acc2)}
#settingsView{display:none;flex:1;min-height:0;overflow:auto;margin-top:44px;flex-direction:column;gap:18px}
#dlgListMenu[data-view=settings] :is(#listMenuTagRow,#inFilter,#lessonList,#listStatus){display:none}
#dlgListMenu[data-view=settings] #settingsView{display:flex}
#glueView{display:none;flex:1;min-height:0;overflow:auto;margin-top:44px;flex-direction:column;gap:16px}
#dlgListMenu[data-view=glue] :is(#listMenuTagRow,#inFilter,#lessonList,#listStatus){display:none}
#dlgListMenu[data-view=glue] #glueView{display:flex}
#glueView .row{gap:8px;align-items:center}
#glueView button[data-selected="1"]{border-color:var(--acc)}
#glueView label{display:flex;gap:6px;align-items:center;font-size:14px}
#glueLessons,#glueHistory{display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow:auto}
#glueLessons li{display:flex;gap:8px;align-items:center;padding:6px 10px}
#glueLessons li[data-off="1"]{opacity:.4}
#glueHistory li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 10px;font-size:14px}
#glueGo{width:100%}
.set-sec h4{margin:0 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.set-sec:has(> [hidden]){display:none}
#settingsView .ico-wrap > button{display:none}
#settingsView .pos-menu{position:static;display:flex;flex-wrap:wrap;gap:6px;width:auto;min-width:0;border:0;padding:0;box-shadow:none;background:none}
#settingsView .pos-menu button{width:auto;flex:1 1 auto;border:1px solid var(--line);border-radius:10px;padding:6px 14px;text-align:center}
#settingsView .pos-menu button[aria-checked=true]{border-color:var(--acc)}
#settingsView #btnSkipKnown{width:100%;justify-content:flex-start;gap:10px;padding:6px 12px;font-size:15px}
#btnSkipKnown span{display:none}#settingsView #btnSkipKnown span{display:inline}
#lessonList li[data-selected="1"]::after{content:"✓";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--acc2);font-weight:700}
#lessonList li[data-loading="1"]::after{content:"…";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--acc2);font-weight:700}
#lessonList li{position:relative;padding-right:32px}
#btnToStart{flex:none;width:44px;padding:0;font-size:16px}
#btnRestart{display:none!important}
#modeBar{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
#modeBar button{height:44px;min-height:44px;padding:0;display:flex;align-items:center;justify-content:center}
#modeBar button:disabled{opacity:.4;cursor:default}
#modeBar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<style id="compact">
.dialog{padding:0 8px calc(60px + env(safe-area-inset-bottom))}
.top{padding:4px 0;gap:6px;min-height:40px}
.top .ttl{display:flex;align-items:baseline;gap:8px;overflow:hidden}
h1{font-size:16px;flex:none}
.total{font-size:12px}
#lessonHeading:empty{display:none}
button{min-height:40px;padding:6px 10px;border-radius:10px}
.icon{width:40px}
.panel{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:4px 6px;border-radius:12px;position:relative}
.panel .row{gap:4px;flex-wrap:nowrap}
.seg{font-size:12px}
.flag{min-width:40px;padding:4px 8px;font-size:13px}
input[type=number]{width:60px;min-height:36px;padding:4px}
.progress{position:absolute;left:6px;right:6px;bottom:2px;height:3px;margin:0}
.current{margin:4px 0 2px;padding:4px 8px;font-size:13px;border-left-width:3px;border-radius:8px}
ul{gap:3px;margin-top:4px;counter-reset:st}
li{padding:5px 8px 5px 34px;border-radius:10px;counter-increment:st}
li::before{content:counter(st);position:absolute;left:6px;top:7px;font-size:10px;color:var(--mut);width:22px;text-align:right}
li[data-saved="1"]::after{content:"●";top:4px;right:6px}
li[data-active="1"]{box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}
li[data-mark=skip],li[data-mark=focus]{border-left-width:4px}
.line.say,.line.voiced,.line.hint{padding:1px 6px;border-radius:6px;line-height:1.3}
.line.say{font-size:15px}
.line.voiced,.line.hint,.tr{margin-top:1px}
.line.hint,.tr{font-size:13px}
.dock{padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
.dock .in{gap:6px}
#btnPlayFromN,#btnGoN{min-height:44px;border-radius:12px}
#btnPlayFromN{font-size:16px}
#lessonList{gap:4px}#lessonList li{padding:8px 10px}#lessonList li::before{content:none}
</style>
<style id="bottom">
.dialog{height:auto;padding:4px 6px 0}
ul#cardList{overflow:visible;margin:0;padding-bottom:calc(130px + env(safe-area-inset-bottom))}
.dock{background:var(--bg);padding:3px 6px calc(4px + env(safe-area-inset-bottom))}
.dock .in{flex-direction:column;gap:3px}
.info{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;font-size:12px}
.info h1{font-size:12px;font-weight:700;flex:none}
.info .current{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;margin:0;padding:0;background:none;border:0;font-size:12px;color:var(--fg)}
.info .total{flex:none;font-size:11px}
.progress{position:static;height:3px;margin:0}
.bar{display:flex;gap:4px;align-items:center}
.bar .sp{flex:1}
.bar .flag{min-width:40px}
#btnListMenu{width:44px;padding:0;font-size:18px}
#btnPause{flex:none;width:44px;min-width:44px;padding:0;white-space:nowrap}
#btnShuffle{flex:none;width:40px;padding:0;font-size:18px}
#btnPlayFromN{white-space:nowrap;padding:0 4px}
#posOf{flex:none;white-space:nowrap}
#btnSkipKnown{flex:none;width:40px;padding:0;display:flex;align-items:center;justify-content:center}
#btnSkipKnown svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#btnSeq{flex:none;width:60px;padding:0;font-size:13px;white-space:nowrap}
@media (max-width:374px){.bar{gap:2px}.bar .flag{min-width:36px;padding:4px 2px}.icon{width:36px}#btnListMenu{width:38px}#btnPause{width:40px;min-width:40px}#btnShuffle{width:36px}#btnSkipKnown{width:36px}#btnPlayFromN{font-size:13px}}
#btnGoN{min-height:40px}
#btnPlayFromN{flex:1;min-height:40px;font-size:15px;box-shadow:none}
.pos-menu{top:auto;bottom:calc(100% + 6px)}
#themeMenu{left:auto;right:0;width:auto}
#btnRestart{min-height:40px;font-weight:600;white-space:nowrap}
.bar:has(#btnRestart:not([hidden])) :is(#btnGoN,#posOf){display:none}
</style>
<style id="fullwidth">
.dialog{max-width:none;padding:2px 0 0}
.dock .in{max-width:none}
ul#cardList{gap:2px}
ul#cardList li{touch-action:manipulation}
li{padding:3px 4px 3px 4px;border-radius:6px;border-left-width:1px;border-right-width:1px}
li::before{position:absolute;left:auto;right:3px;top:1px;width:auto;font-size:9px;opacity:.7;z-index:1}
li[data-saved="1"]::after{right:auto;left:1px;top:-2px;font-size:9px}
.line.say,.line.voiced,.line.hint{padding:1px 12px 1px 4px;border-radius:4px;letter-spacing:-.012em}
.line.say,.line.voiced{font-size:14px}
.line.hint,.tr{font-size:13px;padding-right:12px}
</style>
<style id="big">
/* large-font themes: light-big / dark-big (colors come from light / dark) */
html[data-theme$="-big"] ul#cardList{gap:4px;padding-bottom:calc(280px + env(safe-area-inset-bottom))}
html[data-theme$="-big"] li{padding:5px 6px}
html[data-theme$="-big"] li::before{font-size:12px}
html[data-theme$="-big"] li[data-saved="1"]::after{font-size:12px}
html[data-theme$="-big"] .line.say,html[data-theme$="-big"] .line.voiced{font-size:21px;line-height:1.35}
html[data-theme$="-big"] .line.hint,html[data-theme$="-big"] .tr{font-size:18px;line-height:1.35}
html[data-theme$="-big"] .info,html[data-theme$="-big"] .info h1,html[data-theme$="-big"] .info .current{font-size:16px}
html[data-theme$="-big"] .info .total,html[data-theme$="-big"] .muted{font-size:15px}
html[data-theme$="-big"] .progress{height:4px}
html[data-theme$="-big"] .dock .in{gap:5px}
html[data-theme$="-big"] .bar{gap:6px;flex-wrap:wrap}
html[data-theme$="-big"] #btnPause{width:64px;min-width:64px}
html[data-theme$="-big"] #btnShuffle{width:52px;min-width:52px;font-size:22px}
html[data-theme$="-big"] #btnSkipKnown{width:52px;min-width:52px}
html[data-theme$="-big"] #btnSeq{width:84px;min-width:84px;font-size:16px}
html[data-theme$="-big"] button{min-height:48px;font-size:18px}
html[data-theme$="-big"] .bar .flag{min-width:52px;font-size:17px}
html[data-theme$="-big"] .icon,html[data-theme$="-big"] #btnListMenu{width:48px;font-size:20px}
html[data-theme$="-big"] input[type=number]{width:76px;min-height:48px;font-size:18px}
html[data-theme$="-big"] #btnGoN,html[data-theme$="-big"] #btnRestart{min-height:52px}
html[data-theme$="-big"] #btnRestart{font-size:16px;padding:6px 8px}
html[data-theme$="-big"] #btnPlayFromN{min-height:52px;font-size:18px;padding:6px 10px;white-space:nowrap}
html[data-theme$="-big"] .pos-menu button{min-height:48px;font-size:18px}
html[data-theme$="-big"] #modeBar button{height:52px;min-height:52px}
html[data-theme$="-big"] #markList .wd b{font-size:20px}
html[data-theme$="-big"] #markList .wd small{font-size:17px}
html[data-theme$="-big"] #inFilter,html[data-theme$="-big"] #lessonList li{font-size:18px}
</style>
</head>
<body>
<div class="dialog">
  <audio id="sessionKeeper" class="card-audio" loop playsinline webkit-playsinline preload="auto" src="audio/session_keeper.wav"></audio>
  <ul id="cardList"></ul>
</div>
<nav class="dock"><div class="in">
  <div class="info">
    <h1 id="elMediaLog">VoiceTraining</h1>
    <span id="elChannel" class="total"></span>
    <span id="lessonHeading" class="total"></span>
    <span id="currentCard" class="current">Натисніть ▶ Play або оберіть крок.</span>
    <span id="elTotal" class="total"></span>
  </div>
  <div class="progress" aria-hidden="true"><i id="progBar"></i></div>
  <div class="bar" id="rowLegacyFlags">
    <button id="btnEn" class="flag" type="button" data-selected="0" aria-pressed="false">EN</button>
    <button id="btnUk" class="flag" type="button" data-selected="0" aria-pressed="false">UK</button>
    <div class="ico-wrap" id="langWrap" hidden>
      <button type="button" id="btnTransLang" class="flag" aria-haspopup="menu" aria-expanded="false" aria-label="Мова перекладу">укр.</button>
      <div class="pos-menu" id="langMenu" role="menu">
        <button type="button" role="menuitemradio" data-lang="uk">укр.</button>
        <button type="button" role="menuitemradio" data-lang="en">англ.</button>
        <button type="button" role="menuitemradio" data-lang="off">немає</button>
      </div>
    </div>
    <button id="btnPause" class="flag" type="button" title="Extra pause between steps" aria-label="Extra pause between steps">⏱+0</button>
    <button id="btnShuffle" class="flag" type="button" title="Shuffle words" aria-label="Shuffle words" data-selected="0" aria-pressed="false" hidden>⇄</button>
  </div>
  <div class="bar">
    <button id="btnListMenu" type="button" aria-label="Lessons">☰</button>
    <button id="btnToStart" type="button" title="На початок (1)" aria-label="На початок (1)">⏮</button>
    <div class="pos-wrap" id="posWrap" hidden>
      <input id="inPos" type="number" min="1" step="1" value="1" autocomplete="off" inputmode="numeric" aria-label="Step N" />
      <div class="pos-menu" id="posMenu" role="menu">
        <button type="button" id="posGoStart" role="menuitem">На початок (1)</button>
      </div>
    </div>
    <span class="muted" id="posOf" hidden></span>
    <button id="btnGoN" type="button" hidden>Go</button>
    <button id="btnSeq" class="flag" type="button" title="Which language plays first" aria-label="Which language plays first" hidden>SV→UK</button>
    <button id="btnRestart" type="button" hidden>⟲ На початок</button>
    <button id="btnPlayFromN" type="button">▶ 1</button>
  </div>
</div></nav>
<dialog id="dlgListMenu">
  <form method="dialog">
    <button id="btnListClose" value="cancel" type="submit" aria-label="Close">×</button>
    <div id="listMenuTagRow" class="row"></div>
    <div id="markChips" class="row">
      <button type="button" id="markAll" data-selected="1">All</button>
      <button type="button" id="markKnown" data-selected="0">✓</button>
