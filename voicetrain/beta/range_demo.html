<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Склейка кроків через Range — демо</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e8eaf0;--mut:#8a90a0;--acc:#4f8cff;--line:#2a2f3a}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:16px;max-width:720px;margin-inline:auto}
h1{font-size:18px;margin:0 0 4px}
p.note{color:var(--mut);margin:0 0 14px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
label{color:var(--mut);font-size:14px}
input,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
input[type=number]{width:70px}
button{cursor:pointer;border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
audio{width:100%;margin:8px 0 12px}
#stats{font-size:13px;color:var(--mut);white-space:pre-wrap;margin-bottom:10px}
ol{padding-left:28px;margin:0}
li{padding:4px 6px;border-radius:8px}
li small{color:var(--mut)}
li.on{background:#1f2a44;outline:1px solid var(--acc)}
</style>
</head>
<body>
<h1>Склейка кроків через Range</h1>
<p class="note">Вибирає випадкові кроки уроку, тягне лише їхні байти з великих mp3 (HTTP Range, паралельно), склеює в один Blob і грає одним &lt;audio&gt;. Перевірка: чи немає клацань і затримок між шматками.</p>

<div class="row">
  <label>Урок <select id="lesson"><option>2</option></select></label>
  <label>Кроків <input id="count" type="number" min="1" max="200" value="15" /></label>
  <label>Переклад <select id="lang"><option value="uk">uk</option><option value="en">en</option><option value="">без</option></select></label>
  <button id="build">Зібрати</button>
</div>
<audio id="player" controls preload="auto"></audio>
<div id="stats"></div>
<ol id="list"></ol>

<script>
const AUDIO_BASE = '../audio/lessons/';
const $ = (id) => document.getElementById(id);
let segments = [];

async function loadMarks(lessonId) {
  const resp = await fetch(`${AUDIO_BASE}${lessonId}/marks.json`, { cache: 'no-store' });
  if (!resp.ok) throw new Error(`marks.json: HTTP ${resp.status}`);
  return resp.json();
}

function pickSteps(items, n) {
  const pool = items.filter((it) => it.sv_bytes);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, n);
}

async function fetchRange(url, [start, end]) {
  const resp = await fetch(url, { headers: { Range: `bytes=${start}-${end - 1}` } });
  if (resp.status !== 206) throw new Error(`${url}: очікував 206, отримав ${resp.status}`);
  const buf = await resp.arrayBuffer();
  if (buf.byteLength !== end - start) throw new Error(`${url}: ${buf.byteLength} байт замість ${end - start}`);
  return buf;
}

async function build() {
  const btn = $('build');
  btn.disabled = true;
  $('stats').textContent = 'Завантаження…';
  try {
    const lessonId = $('lesson').value;
    const tr = $('lang').value;
    const doc = await loadMarks(lessonId);
    if (!doc.byte_marks) throw new Error('у marks.json немає байтових меж (запусти dev/byte_marks.py)');
    const steps = pickSteps(doc.items, Math.max(1, Number($('count').value) || 15));
    segments = [];
    for (const it of steps) {
      for (const lang of tr ? ['sv', tr] : ['sv']) {
        if (!it[`${lang}_bytes`]) continue;
        segments.push({ step: it.step, lang, text: it[lang], bytes: it[`${lang}_bytes`], cut: it[`${lang}_cut`],
          url: `${AUDIO_BASE}${lessonId}/${doc[`${lang}_file`]}` });
      }
    }
    const t0 = performance.now();
    const parts = await Promise.all(segments.map((s) => fetchRange(s.url, s.bytes)));
    const fetchMs = Math.round(performance.now() - t0);
    let at = 0;
    for (const s of segments) {
      s.from = at;
      at += s.cut[1] - s.cut[0];
      s.to = at;
    }
    const blob = new Blob(parts, { type: 'audio/mpeg' });
    const player = $('player');
    if (player.src) URL.revokeObjectURL(player.src);
    player.src = URL.createObjectURL(blob);
    $('list').innerHTML = segments
      .map((s, i) => `<li data-i="${i}"><small>${s.lang} · крок ${s.step}</small> ${escapeHtml(s.text)}</li>`)
      .join('');
    $('stats').textContent =
      `${segments.length} шматків, ${(blob.size / 1024).toFixed(0)} КБ, завантаження ${fetchMs} мс, ` +
      `тривалість за кадрами ${at.toFixed(1)} с`;
    player.play().catch(() => {});
  } catch (err) {
    $('stats').textContent = `Помилка: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

$('player').addEventListener('timeupdate', () => {
  const t = $('player').currentTime;
  document.querySelectorAll('#list li').forEach((li) => {
    const s = segments[Number(li.dataset.i)];
    li.classList.toggle('on', t >= s.from && t < s.to);
  });
});
$('list').addEventListener('click', (e) => {
  const li = e.target.closest('li');
  if (li) { $('player').currentTime = segments[Number(li.dataset.i)].from; $('player').play(); }
});
$('build').addEventListener('click', build);
</script>
</body>
</html>
